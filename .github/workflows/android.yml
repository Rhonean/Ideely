# Bouwt bij elke wijziging een Android-testversie (APK) die je zelf kunt installeren.
name: Android-testversie

on:
  push:
    branches: [main]
    paths: ["index.html", "icon.svg", "mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pakketten installeren
        working-directory: mobile
        run: npm ci

      - name: Webapp klaarzetten en synchroniseren
        working-directory: mobile
        run: npm run build:www && npx cap sync android

      - name: Testversie bouwen
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Testversie beschikbaar maken
        uses: actions/upload-artifact@v4
        with:
          name: ideeenstash-android-test
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
