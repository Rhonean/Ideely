<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ideely</title>
<meta name="theme-color" content="#f7f6f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ideely">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: één-scherm telefoonapp — kop, inhoud, onderbalk; profiel en lezen openen als volledig scherm */
:root{
  --bg:#f7f6f2; --surface:#ffffff; --ink:#15211e; --muted:#5f6b67; --line:#e3e3dc;
  --accent:#c2410c; --accent-ink:#fff7ef; --soft:#fbe9dc;
  --t1:#1e4d47; --t2:#5b3a6e; --t3:#7a4a1c; --t4:#24466e; --t5:#6e2f3c; --t6:#3d5a24;
  --card-ink:#f7f5ef;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root[data-theme="system"]{
  --bg:#0f1716; --surface:#172220; --ink:#e9eeeb; --muted:#93a39e; --line:#26332f;
  --accent:#f08a4b; --accent-ink:#1a0d04; --soft:#3a2416;
  --t1:#235a53; --t2:#5e3f73; --t3:#80511f; --t4:#2a4f7c; --t5:#773645; --t6:#45652a;
  --card-ink:#f7f5ef; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1716; --surface:#172220; --ink:#e9eeeb; --muted:#93a39e; --line:#26332f;
  --accent:#f08a4b; --accent-ink:#1a0d04; --soft:#3a2416;
  --t1:#235a53; --t2:#5e3f73; --t3:#80511f; --t4:#2a4f7c; --t5:#773645; --t6:#45652a;
  --card-ink:#f7f5ef; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 4px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.45rem;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.hright{display:flex;align-items:center;gap:10px}
.streak{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.avatar{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
main{flex:1;overflow-y:auto;padding:4px 16px 24px;min-height:0}
nav.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.02em}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
nav.tabs button[aria-current="page"] svg{color:var(--accent)}

h2{font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:-.01em;margin:22px 0 10px;text-wrap:balance}
.h2row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.h2row button{border:0;background:none;color:var(--accent);font-size:.86rem;padding:4px 0}
.lede{color:var(--muted);margin:0 0 12px;font-size:.92rem}

.today{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:8px}
.ring{width:64px;height:64px}
.ring circle{fill:none;stroke-width:7}
.ring .track{stroke:var(--line)}
.ring .bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring text{fill:var(--ink);font-family:var(--f-display);font-weight:700;font-size:17px}
.today b{font-family:var(--f-display);font-size:1.05rem;display:block}
.today small{color:var(--muted)}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,46%);gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .book{scroll-snap-align:start}
.book{position:relative;border:0;border-radius:14px;padding:14px 12px 12px;min-height:180px;text-align:left;color:var(--card-ink);background:var(--tc);display:flex;flex-direction:column;gap:6px;overflow:hidden}
.book::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.10),transparent 45%);pointer-events:none}
.book .topic{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
.book .ttl{font-family:var(--f-display);font-weight:700;font-size:1.02rem;line-height:1.15;text-wrap:balance}
.book .au{font-size:.8rem;opacity:.85}
.book .why{font-size:.74rem;opacity:.9;font-style:italic}
.book .meter{margin-top:auto;height:4px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
.book .meter i{display:block;height:100%;background:var(--card-ink)}
.book .count{font-size:.72rem;opacity:.85;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:.66rem;padding:1px 6px;border-radius:99px;background:rgba(255,255,255,.18);width:max-content}

.maker{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:7px;border-radius:8px;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
input[type=text],textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px}
textarea{min-height:130px;resize:vertical}
.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.status{font-size:.86rem;color:var(--muted);min-height:1.2em}
.status.err{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:.86rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.li b{font-family:var(--f-display);font-weight:700;display:block;line-height:1.2}
.li small{color:var(--muted);display:block}
.li p{margin:3px 0 0;font-size:.86rem}
.li .btn{padding:8px 12px;font-size:.84rem}
.li .ready{font-size:.7rem;color:var(--good,var(--muted));text-transform:uppercase;letter-spacing:.06em}

.saved{display:flex;flex-direction:column;gap:10px}
.sv{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--tc);border-radius:12px;padding:12px 14px}
.sv h3{margin:0 0 4px;font-family:var(--f-display);font-size:1rem;line-height:1.25}
.sv p{margin:0;font-family:var(--f-read);font-size:.93rem;line-height:1.55}
.sv footer{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:.78rem;color:var(--muted)}
.sv footer button{border:0;background:none;color:var(--muted);text-decoration:underline;padding:4px}
.empty{color:var(--muted);text-align:center;padding:26px 10px;border:1px dashed var(--line);border-radius:14px}

/* profiel-onboarding */
.ob{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ob-in{flex:1;overflow-y:auto;padding:14px 16px 10px;max-width:560px;width:100%;margin:0 auto;box-sizing:border-box;min-height:0}
.ob-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ob-top button{border:0;background:none;color:var(--muted);padding:6px 0;font-size:.9rem}
.steps{flex:1;display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.ob h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.55rem,6.5vw,2rem);line-height:1.1;letter-spacing:-.02em;margin:6px 0 8px;text-wrap:balance}
.ob .lede{font-size:.95rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:74px}
.opt b{font-weight:600;font-size:.95rem;line-height:1.2}
.opt small{color:var(--muted);font-size:.78rem}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.opts.one{grid-template-columns:1fr}
.opt.row2{flex-direction:row;align-items:center;justify-content:space-between;min-height:0}
.ob-foot{padding:10px 16px 14px;max-width:560px;width:100%;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:6px}
.ob-foot small{color:var(--muted);text-align:center;font-size:.8rem}
.prof{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;margin-top:14px}
.prof dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.prof dd{margin:2px 0 0}

/* lezer */
.reader{position:fixed;inset:0;z-index:20;background:var(--tc);color:var(--card-ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.rbar{display:flex;align-items:center;gap:10px;padding:10px 14px}
.rbar button{border:0;background:rgba(255,255,255,.14);color:var(--card-ink);border-radius:99px;width:36px;height:36px;display:grid;place-items:center;flex:none}
.rprog{flex:1;display:flex;gap:3px}
.rprog i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.25)}
.rprog i.on{background:var(--card-ink)}
.slides{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;box-sizing:border-box;padding:8px 22px 18px;display:flex;flex-direction:column;overflow-y:auto}
.slide>*{max-width:560px;width:100%;margin-left:auto;margin-right:auto;box-sizing:border-box}
.slide .kicker{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;opacity:.75;font-variant-numeric:tabular-nums}
.slide h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,7vw,2.2rem);line-height:1.08;letter-spacing:-.02em;margin-top:10px;margin-bottom:14px;text-wrap:balance}
.slide h2{color:var(--card-ink);font-size:clamp(1.3rem,5.6vw,1.65rem);line-height:1.15;margin-top:14px;margin-bottom:14px}
.slide p{font-family:var(--f-read);font-size:1.08rem;line-height:1.62;margin-top:0;margin-bottom:12px}
.slide .meta{opacity:.85;font-size:.92rem}
.slide .acts{margin-top:auto;display:flex;flex-wrap:wrap;gap:10px;padding-top:16px}
.slide .acts button{border:1px solid rgba(255,255,255,.4);background:none;color:var(--card-ink);border-radius:99px;padding:9px 14px;font-size:.88rem;display:flex;align-items:center;gap:6px}
.slide .acts button[aria-pressed="true"]{background:var(--card-ink);color:var(--tc);border-color:var(--card-ink)}
.slide .hint{opacity:.75;font-size:.84rem;margin-top:auto;padding-top:16px}
.slide .apply{background:rgba(255,255,255,.12);border-radius:12px;padding:12px 14px;margin-top:4px;margin-bottom:4px}
.slide .apply b{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;opacity:.8;margin-bottom:4px}
.slide .apply span{font-size:.97rem;line-height:1.5}
.slide .deep{border-top:1px solid rgba(255,255,255,.25);margin-top:16px;padding-top:12px}
.slide .deep .dk{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;opacity:.8;margin-bottom:8px}
.slide .deep p{font-size:1.02rem}
.slide .buy{margin:6px 0 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stats div,.stats button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;color:var(--ink);font:inherit}
.stats button span{color:var(--accent)}
.backlink{border:0;background:none;color:var(--accent);font-weight:600;padding:10px 0 0;font-size:.92rem}
.pageh{font-family:var(--f-display);font-size:1.6rem;margin:6px 0 4px}
h2 .cnt{font-size:.8rem;color:var(--muted);font-weight:500}
.stats b{display:block;font-family:var(--f-display);font-size:1.3rem;line-height:1.1}
.stats span{font-size:.78rem;color:var(--muted)}
.iotd{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;border:0;margin-top:14px;background:var(--tc);color:var(--card-ink);border-radius:20px;padding:18px;box-shadow:0 12px 28px -16px rgba(0,0,0,.45)}
.iotd .kicker{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;opacity:.8}
.iotd .t{font-family:var(--f-display);font-weight:700;font-size:1.3rem;line-height:1.15}
.iotd .b{font-family:var(--f-read);font-size:.97rem;line-height:1.5;opacity:.95}
.iotd .go{font-weight:700;font-size:.9rem;margin-top:4px}
.lede.sub{margin:-6px 0 8px;font-size:.88rem}
.gains{display:flex;flex-direction:column;gap:10px}
.gain{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.gain .gh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.gain .gh .ic{width:36px;height:36px;border-radius:10px}
.gain .gh b{font-family:var(--f-display);font-size:1.08rem}
.gain ul{list-style:none;margin:0;padding:0}
.gain li{position:relative;padding:5px 0 5px 22px;font-size:.93rem;color:var(--ink)}
.gain li::before{content:"";position:absolute;left:3px;top:11px;width:9px;height:5px;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}
.minilang{display:flex;gap:2px;margin-left:auto}
.minilang button{border:0;background:none;font-size:.78rem;font-weight:600;color:var(--muted);padding:6px 7px;border-radius:8px}
.minilang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.intro .dots{justify-content:flex-start}
.ob-foot .skip{display:block;margin:0 auto;border:0;background:none;color:var(--muted);font-size:.86rem;padding:4px}
.menu{position:fixed;inset:0;z-index:28;background:rgba(10,20,18,.28)}
.menu-in{position:absolute;top:calc(env(safe-area-inset-top,0px) + 54px);right:12px;left:12px;max-width:360px;margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px -16px rgba(0,0,0,.35);max-height:calc(100vh - 80px);overflow:auto}
.mrow{display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:14px;font-size:.95rem;font-weight:600;color:var(--ink);text-align:left}
.mrow svg{width:20px;height:20px;color:var(--accent)}
.mlegal{display:flex;gap:16px;padding:12px 14px;font-size:.82rem}
.mlegal a{color:var(--muted)}
.slide .buybtn{display:block;text-align:center;background:var(--card-ink);color:var(--tc);text-decoration:none;font-weight:700;border-radius:99px;padding:12px 16px;font-size:.95rem}
.slide .buy small{display:block;opacity:.7;font-size:.74rem;margin-top:6px;text-align:center}
.slide .buylink{color:var(--card-ink);opacity:.85;font-size:.86rem;margin-top:12px;text-underline-offset:3px}
.slide .deep small{display:block;opacity:.7;font-size:.78rem;margin-top:4px}
.sv .ap{margin-top:8px;font-size:.86rem;color:var(--muted)}
.sv .ap b{color:var(--ink);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:99px;font-size:.86rem;z-index:40;max-width:86vw;text-align:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
.reader .spin{border-color:rgba(255,255,255,.3);border-top-color:var(--card-ink)}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.ring .bar{transition:none}}
.note{font-size:.78rem;color:var(--muted);margin-top:18px}
.pw-ben{list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:10px}
.pw-ben li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:.95rem}
.pw-ben svg{color:var(--accent);margin-top:2px}
.plans{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.plan{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.plan[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.plan b{font-size:1rem}.plan small{color:var(--muted);font-size:.8rem}
.plan .pr{font-weight:700;font-variant-numeric:tabular-nums;grid-row:1/3;grid-column:2}
.badge{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.pw-legal{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:.78rem}
.pw-legal a,.pw-legal button{color:var(--muted);background:none;border:0;padding:4px;text-decoration:underline;font:inherit;font-size:.78rem}
.prem-tag{font-size:.7rem;font-weight:700;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.codebox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.cb-in{background:var(--surface);color:var(--ink);border-radius:16px;padding:18px;width:100%;max-width:420px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
.cb-in h2{margin:0}
/* welkom, instellingen, widgettip */
.seg3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg3 button{border:0;background:none;padding:8px 4px;border-radius:9px;font-size:.86rem;color:var(--muted)}
.seg3 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.langsel{max-width:360px;margin:4px auto 0}
.dots{flex:1;display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .2s}
.dots i.on{background:var(--accent);width:22px}
.intro .ob-top{min-height:34px}
.hero{text-align:center;margin:22px 0 20px}
.brand.big{font-size:2.3rem}
.hero h1{margin-top:12px}
.hero .lede{max-width:420px;margin:0 auto}
.demo{background:var(--tc);color:var(--card-ink);border-radius:20px;padding:18px 18px 16px;box-shadow:0 14px 30px -14px rgba(30,77,71,.5);transform:rotate(-1.2deg);margin:6px 8px 10px}
.demo .kicker{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;opacity:.8}
.demo h3{font-family:var(--f-display);font-size:1.3rem;line-height:1.15;margin:8px 0}
.demo p{font-family:var(--f-read);font-size:.97rem;line-height:1.55;margin:0 0 10px}
.demo .apply{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px}
.demo .apply b{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;opacity:.8;margin-bottom:3px}
.demo .apply span{font-size:.92rem}
.feat{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-direction:column;gap:10px}
.feat li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--accent)}
.feat b{display:block;font-family:var(--f-display);font-size:1.02rem;margin-bottom:2px}
.feat span:not(.ic){color:var(--muted);font-size:.9rem}
.tip{display:grid;grid-template-columns:44px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.tip p{margin:3px 0 10px;font-size:.88rem;color:var(--muted)}
.tip .btn{padding:8px 12px;font-size:.86rem}
.set{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.setrow{padding:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.setrow:last-child{border-bottom:0}
.setrow p,.setrow small{margin:0;color:var(--muted);font-size:.86rem}
</style>

<script type="application/json" id="catalog">[{"id":"c-subtle-art","title":"The Subtle Art of Not Giving a F*ck","titleNl":"Het subtiele lak hebben aan alles","author":"Mark Manson","year":2016,"topic":"Mindset","summary":"Manson stelt dat een goed leven niet draait om overal positief over zijn, maar om bewust kiezen waar je je druk om maakt. Pijn, falen en beperkingen horen erbij; de vraag is welke problemen je wilt hebben.","ideas":[["Niet alles kan je iets schelen","Lak hebben aan dingen betekent niet onverschillig zijn. Het betekent dat je je op je gemak voelt met anders zijn en dat je kiest waar je energie naartoe gaat. Je aandacht is beperkt. Wie zich overal druk om maakt, maakt zich vooral druk om onbelangrijke dingen. Volwassen worden is leren selecteren: minder dingen belangrijk vinden, maar die wel echt.","Schrijf drie dingen op waar je je deze week druk om maakte. Streep er één door die over een jaar niet meer telt."],["De feedbackloop uit de hel","Je voelt je angstig, en daarna voel je je ook nog slecht over het feit dat je angstig bent. Sociale media versterken dit: iedereen lijkt gelukkiger dan jij. De uitweg is negatieve gevoelens accepteren als normaal onderdeel van het leven. Wie stopt met vechten tegen het slechte gevoel, doorbreekt de spiraal.","Merk je dat je je slecht voelt over een gevoel? Zeg tegen jezelf: dit is normaal, dit mag er zijn. Kijk wat er dan verandert."],["Geluk is problemen oplossen","Een leven zonder problemen bestaat niet. Problemen verdwijnen niet; ze worden vervangen door andere, liefst betere problemen. Geluk komt voort uit het oplossen ervan. Wie problemen ontkent of anderen de schuld geeft, blijft erin hangen. Hoop dus niet op een leven zonder zorgen, maar op problemen die het oplossen waard zijn.","Benoem je grootste probleem van nu. Vraag je af: welk beter probleem wil ik ervoor in de plaats hebben?"],["Kies je strijd","Iedereen wil een goed lichaam, succes en een fijne relatie. De interessantere vraag is: welke pijn wil je ervoor verdragen? Wat je bereikt, wordt bepaald door de moeite die je bereid bent te nemen, niet door wat je wenst. Wie van het resultaat houdt maar niet van het proces, haalt het zelden.","Kies een doel en schrijf eerlijk op welke saaie of zware dagelijkse taken erbij horen. Kun je die verdragen? Dan is het jouw strijd."],["Je bent niet bijzonder","Onze cultuur leert ons dat iedereen uitzonderlijk moet zijn. Dat leidt tot een gevoel van recht hebben op succes, of tot het gevoel dat je faalt als je gewoon bent. De meeste mensen zijn op de meeste vlakken gemiddeld, en dat is prima. Wie dat accepteert, kan gewone dingen weer waarderen en zonder druk werken aan verbetering.","Kies één gebied waar je gemiddeld mag zijn. Haal daar de druk weg en gebruik die energie voor iets wat je echt belangrijk vindt."],["Goede en slechte waarden","Je problemen worden bepaald door wat je belangrijk vindt. Slechte waarden zijn bijvoorbeeld plezier als hoofddoel, materieel succes, altijd gelijk willen hebben en altijd positief blijven. Goede waarden zijn volgens Manson gebaseerd op de werkelijkheid, sociaal opbouwend en binnen je eigen controle, zoals eerlijkheid en verantwoordelijkheid.","Kijk naar een terugkerende frustratie. Welke waarde zit eronder? Toets die aan: is hij realistisch, opbouwend en binnen je controle?"],["Schuld is niet hetzelfde als verantwoordelijkheid","Veel van wat je overkomt is niet jouw schuld. Toch ben je verantwoordelijk voor hoe je ermee omgaat, want je kiest altijd je reactie. Manson vergelijkt het met poker: je krijgt kaarten die je niet zelf kiest, maar hoe je speelt bepaalt de uitkomst. Wie verantwoordelijkheid neemt, krijgt invloed terug.","Denk aan iets wat je oneerlijk overkwam. Schrijf op welke reactie jij daarop kiest, los van wie de schuld heeft."],["Je hebt het vaak mis","Zekerheid is de vijand van groei. Wat je nu gelooft, blijkt later vaak onvolledig of fout. We ontwijken informatie die onze identiteit bedreigt: hoe meer iets botst met wie je denkt te zijn, hoe meer je het vermijdt. Twijfel aan jezelf durven toelaten maakt je flexibeler en eerlijker.","Kies een overtuiging waar je zeker van bent. Vraag je af: wat zou ik zien als die niet klopt? Zoek daar actief naar."],["Falen is de weg vooruit","Verbetering komt uit talloze kleine mislukkingen. Wie bang is om te falen, doet niets. Manson noemt het 'doe-iets'-principe: wacht niet op motivatie, maar begin. Actie leidt tot inspiratie, en inspiratie tot motivatie. Niet eerst zin hebben en dan beginnen, maar eerst beginnen.","Is er iets wat je uitstelt omdat je geen zin hebt? Doe vandaag vijf minuten. Kijk of de motivatie daarna vanzelf komt."],["Nee zeggen geeft vrijheid","Iets kiezen betekent andere dingen afwijzen. Wie overal ja op zegt, heeft geen richting. Duidelijke grenzen maken relaties gezonder: je bent verantwoordelijk voor je eigen problemen, niet voor die van de ander. Vrijheid ontstaat juist door toewijding aan een paar dingen, niet door eindeloos opties open te houden.","Zeg deze week bewust nee tegen één verzoek dat niet bij je prioriteiten past. Merk op wat het je oplevert."],["En dan ga je dood","Het besef dat je sterfelijk bent, zet alles in perspectief. Manson bouwt voort op Ernest Becker, die stelde dat mensen veel doen om de dood te ontkennen. Wie de eigen sterfelijkheid onder ogen ziet, maakt zich minder druk om oppervlakkige waarden en kiest makkelijker wat echt telt.","Stel je voor dat je nog een jaar te leven hebt. Welke zorg laat je meteen los, en waar besteed je meer tijd aan?"]]},{"id":"c-mindset","title":"Mindset: The New Psychology of Success","titleNl":"Mindset: de weg naar een succesvol leven","author":"Carol S. Dweck","year":2006,"topic":"Mindset","summary":"Psycholoog Carol Dweck onderscheidt twee overtuigingen over je eigen kunnen: een vaste en een groeigerichte mindset. Welke je hebt, bepaalt hoe je omgaat met uitdagingen, falen en kritiek.","ideas":[["Twee manieren om naar talent te kijken","Mensen met een vaste mindset geloven dat intelligentie en talent vastliggen: je hebt het of je hebt het niet. Mensen met een groeimindset geloven dat je capaciteiten kunt ontwikkelen door inzet, goede strategieën en hulp van anderen. Dat verschil lijkt klein, maar het stuurt hoe je leert, werkt en omgaat met tegenslag.","Let deze week op zinnen als 'ik ben gewoon niet goed in...'. Voeg er bewust 'nog niet' aan toe."],["Bewijzen of ontwikkelen","In een vaste mindset is elke situatie een test van je waarde. Je wilt slim overkomen en vermijdt daarom uitdagingen waarin je kunt falen. In een groeimindset is een uitdaging juist een kans om te leren. Dweck ziet dat mensen met een vaste mindset vaker kiezen voor wat veilig en makkelijk is.","Kies een uitdaging die je vermijdt omdat je bang bent om dom over te komen. Zet er een eerste kleine stap in."],["Falen als oordeel of als informatie","Voor iemand met een vaste mindset zegt falen iets over wie je bent: ik ben een mislukkeling. Voor iemand met een groeimindset zegt falen iets over wat je deed: deze aanpak werkte niet. Daardoor kun je na een tegenslag weer aan de slag, in plaats van je terug te trekken of de schuld bij anderen te leggen.","Schrijf na een mislukking drie dingen op die je ervan leerde, zonder er een oordeel over jezelf aan te koppelen."],["Inspanning maakt je goed","De vaste mindset ziet inspanning als bewijs dat je geen talent hebt: wie echt goed is, hoeft niet zo hard te werken. De groeimindset ziet inspanning als datgene wat je goed maakt. Dweck laat zien dat juist uitblinkers vaak extreem veel oefenen, ook als ze talent hebben.","Zie een moeilijke taak als training. Vraag niet 'ben ik hier goed in?', maar 'wat kan ik hier oefenen?'."],["Prijs het proces, niet het slim zijn","In onderzoek van Dweck en collega's kozen kinderen die geprezen werden om hun intelligentie daarna vaker makkelijke opdrachten; ze wilden het label slim niet kwijt. Kinderen die geprezen werden om hun inzet kozen vaker moeilijke opdrachten. Prijs dus aanpak, doorzetten en strategie in plaats van aanleg.","Geef vandaag iemand een compliment over aanpak of doorzetten in plaats van over talent of slimheid."],["Mindset in relaties","Mensen met een vaste mindset denken vaak dat een goede relatie vanzelf moet gaan en dat problemen bewijzen dat het niet de ware is. Met een groeimindset zie je dat een relatie onderhoud vraagt en dat conflicten opgelost kunnen worden. Je kijkt naar wat je samen kunt leren, in plaats van naar wie schuldig is.","Ervaar je een conflict met je partner? Benoem het als iets wat jullie samen kunnen oplossen, niet als bewijs dat het niet past."],["Leiders die willen leren","Leiders met een vaste mindset willen zich bewijzen, omringen zich met jaknikkers en vermijden slecht nieuws. Leiders met een groeimindset zoeken feedback, ontwikkelen hun mensen en durven te erkennen wat ze niet weten. Dweck stelt dat organisaties met zo'n cultuur beter leren en zich beter aanpassen.","Vraag een collega of leidinggevende om eerlijke feedback op iets waar je onzeker over bent, en bedank voor kritiek."],["Je kunt je mindset veranderen","Een mindset is een overtuiging, en overtuigingen kun je bijsturen. Dweck adviseert om de stem van je vaste mindset te herkennen, bijvoorbeeld 'wat als ik faal?'. Besef dat je een keuze hebt in hoe je die gedachte interpreteert. Antwoord met een groeigerichte stem en kies daarna voor de actie die je leert.","Geef je vaste-mindsetstem een naam. Als je die stem hoort, antwoord dan bewust met een groeigerichte zin."]]},{"id":"c-frankl","title":"Man's Search for Meaning","titleNl":"De zin van het bestaan","author":"Viktor E. Frankl","year":1946,"topic":"Filosofie","summary":"Psychiater Viktor Frankl beschrijft hoe hij de nazikampen overleefde en wat hij daar leerde over de mens. Zijn conclusie: wie een reden heeft om te leven, kan bijna alles verdragen.","ideas":[["Het leven in het kamp","Frankl beschrijft drie fasen bij gevangenen: de schok bij aankomst, daarna apathie en emotionele afstomping, en na de bevrijding vervreemding en soms verbittering. Hij schrijft niet om het lijden op te sommen, maar om te laten zien hoe gewone mensen innerlijk reageren op extreme omstandigheden.","Denk aan een moeilijke periode in je eigen leven. Wat heeft jou toen geholpen om door te gaan?"],["De laatste menselijke vrijheid","Alles kan je worden afgenomen, behalve één ding: de vrijheid om te kiezen hoe je je verhoudt tot je omstandigheden. Frankl zag in het kamp mensen die hun laatste stuk brood weggaven. Volgens hem bewijst dat dat er altijd een innerlijke ruimte is waarin je je houding bepaalt.","Kies bij de volgende ergernis bewust je houding. Vraag: hoe wil ik reageren, los van wat er gebeurt?"],["Een waarom maakt elk hoe draaglijk","Frankl citeert Nietzsche: wie een waarom heeft om voor te leven, verdraagt bijna elk hoe. Gevangenen die een doel hadden, zoals een kind dat op hen wachtte of een werk dat af moest, hielden het vaker vol. Wie die hoop verloor, gaf zich vaak snel op.","Schrijf je eigen waarom op: voor wie of wat sta je elke dag op? Leg het briefje ergens waar je het ziet."],["Drie bronnen van zin","Volgens Frankl vind je zin op drie manieren. Door iets te creëren of te doen. Door iets te ervaren of iemand lief te hebben. En door de houding die je kiest tegenover onvermijdelijk lijden. Die laatste bron blijft altijd beschikbaar, ook als de eerste twee wegvallen.","Bekijk deze week welke van de drie bronnen van zin in je leven het sterkst is: werk, liefde of houding."],["Liefde als houvast","Tijdens zware dwangarbeid in de kou dacht Frankl aan zijn vrouw. Hij wist niet of zij nog leefde, maar het innerlijke gesprek met haar gaf hem kracht. Daaruit concludeerde hij dat liefde het hoogste is waar een mens naar kan streven en dat zij voorbij de fysieke aanwezigheid van de ander reikt.","Denk aan iemand van wie je houdt en wat die persoon je geeft, ook als je hem of haar niet dagelijks ziet."],["De wil tot zin","Frankl ontwikkelde de logotherapie. Waar Freud plezier zag als drijfveer en Adler macht, zag Frankl het verlangen naar zin als de primaire menselijke motivatie. Psychische nood ontstaat volgens hem vaak niet door te weinig plezier, maar doordat iemand geen zin meer ziet in wat hij doet.","Vraag je bij je werk af: wat maakt dit zinvol, voor wie maak ik verschil?"],["Het existentiële vacuüm","Veel moderne mensen ervaren een innerlijke leegte. Frankl noemt het verveling en een gevoel van zinloosheid, en wijst op de 'zondagsneurose': de leegte die opkomt zodra de drukte van de werkweek wegvalt. Die leegte wordt vaak opgevuld met macht, geld of genot, zonder dat het echt helpt.","Merk je leegte op een rustige zondag? Plan iets wat zinvol voor je is, in plaats van het op te vullen met afleiding."],["Wat verwacht het leven van jou?","Frankl draait de vraag om. Vraag niet wat je van het leven verwacht, maar wat het leven van jou verwacht. Zin is niet iets algemeens dat je vindt, maar een concrete taak in een concrete situatie. Daarmee wordt zingeving een kwestie van verantwoordelijkheid nemen voor je antwoord.","Kijk naar een lastige situatie en vraag: wat verwacht het leven hier van mij, wat is mijn taak nu?"]]},{"id":"c-gtd","title":"Getting Things Done","titleNl":"Getting Things Done","author":"David Allen","year":2001,"topic":"Productiviteit","summary":"Allen beschrijft een methode om al je taken en verplichtingen uit je hoofd te halen en in een betrouwbaar systeem te zetten. Zo krijg je rust in je hoofd en focus op wat nu telt.","ideas":[["Je hoofd is om ideeën te hebben","Elke afspraak met jezelf die nog niet is vastgelegd, noemt Allen een open lus. Je hoofd blijft er onbewust mee bezig en herinnert je er op onhandige momenten aan. Dat kost aandacht en geeft stress. De oplossing is alles vastleggen buiten je hoofd, in een systeem dat je vertrouwt.","Doe vandaag een braindump: schrijf alles op wat in je hoofd rondspookt, groot en klein, in tien minuten."],["Stap 1: verzamel alles","Verzamel alles wat je aandacht vraagt in een paar vaste inboxen: een bakje, een notitie-app, je mail. Klein of groot, werk of privé. Het doel is dat niets meer alleen in je hoofd zit. Houd het aantal inboxen beperkt en leeg ze regelmatig, anders verliest het systeem je vertrouwen.","Tel je inboxen: mail, notities, papieren, apps. Breng ze terug tot een paar vaste plekken."],["Stap 2: verhelder per item","Vraag bij elk item: moet ik hier iets mee? Zo nee, dan gooi je het weg, bewaar je het als naslag of zet je het op een lijst voor ooit/misschien. Zo ja, wat is de eerstvolgende concrete fysieke actie? 'Rapport' is geen actie, 'Jan bellen over de cijfers' wel.","Herschrijf drie vage taken op je lijst tot concrete fysieke acties, zoals 'mail Piet over budget'."],["De twee-minutenregel","Kost de volgende actie minder dan twee minuten? Doe het dan meteen. Vastleggen en later terugkomen kost meer tijd dan het direct afhandelen. Duurt het langer, dan delegeer je het of zet je het op de juiste lijst.","Pas vandaag de twee-minutenregel toe bij het lezen van je mail: wat korter is, handel je direct af."],["Stap 3: organiseer in lijsten","Allen werkt met vaste lijsten: projecten (alles wat meer dan één stap vraagt), volgende acties per context zoals bellen of computer, wachten op anderen, en ooit/misschien. In je agenda komt alleen wat echt op een vast moment moet. Zo blijft je agenda betrouwbaar.","Maak een aparte lijst met al je projecten en zet bij elk project één volgende actie."],["Stap 4: de wekelijkse review","Eén keer per week loop je alles door: inboxen leeg, projecten nalopen, elke project een volgende actie, agenda vooruit en achteruit bekijken. Allen noemt dit de kritieke succesfactor. Zonder review raakt het systeem vervuild en ga je weer dingen in je hoofd bewaren.","Plan een vast moment in je agenda voor een wekelijkse review van dertig tot zestig minuten."],["Stap 5: kies wat je nu doet","Kies je volgende actie op basis van vier vragen: in welke context ben ik, hoeveel tijd heb ik, hoeveel energie heb ik en wat heeft prioriteit. Omdat alles vastligt, kun je die keuze met vertrouwen maken in plaats van te reageren op wat het hardst roept.","Bekijk je takenlijst vanuit context en energie: wat kun je doen met de tijd en energie die je nu hebt?"],["Een hoofd als water","Het doel van GTD is wat Allen 'mind like water' noemt: reageren in verhouding tot wat er gebeurt, niet meer en niet minder. Wanneer je hoofd niet meer vol zit met open lussen, ontstaat er ruimte voor creatief denken en echte aandacht voor wat je aan het doen bent.","Merk aan het eind van de dag op: hoeveel open lussen zitten nog in je hoofd? Schrijf ze op voor je gaat slapen."]]},{"id":"c-deep-work","title":"Deep Work","titleNl":"Diep werk","author":"Cal Newport","year":2016,"topic":"Productiviteit","summary":"Newport stelt dat het vermogen om lang geconcentreerd te werken steeds zeldzamer en waardevoller wordt. Hij geeft regels om diep werk te trainen en oppervlakkig werk terug te dringen.","ideas":[["Diep versus oppervlakkig werk","Diep werk is werk dat je in een staat van ongestoorde concentratie doet en dat je vermogens tot het uiterste benut. Het levert nieuwe waarde op en is moeilijk te kopiëren. Oppervlakkig werk is logistiek werk zoals mail en vergaderen, dat je ook met halve aandacht kunt doen.","Bekijk je agenda van vorige week. Hoeveel uur was diep werk en hoeveel was oppervlakkig?"],["Zeldzaam en daardoor waardevol","Newports hypothese: het vermogen tot diep werk wordt zeldzamer, precies op het moment dat het waardevoller wordt. Wie snel moeilijke dingen kan leren en op hoog niveau kan presteren, onderscheidt zich. Beide vragen diepe concentratie. Kwaliteit van werk is ongeveer tijd maal intensiteit van focus.","Kies één vaardigheid die je waardevoller maakt in je werk en plan er vaste uren voor in."],["Aandachtsresidu","Als je wisselt van taak, blijft een deel van je aandacht hangen bij de vorige. Onderzoeker Sophie Leroy noemt dat aandachtsresidu. Even je mail checken tijdens geconcentreerd werk lijkt onschuldig, maar verlaagt je prestaties daarna. Taken bundelen en lange blokken zonder onderbreking werken daarom beter.","Bundel je mail en berichten in twee of drie vaste blokken per dag in plaats van ze steeds te checken."],["Kies een stijl voor diep werk","Newport beschrijft vier aanpakken. Monastiek: oppervlakkig werk vrijwel helemaal schrappen. Bimodaal: hele dagen of weken diep werken, de rest normaal. Ritmisch: elke dag op een vast tijdstip. Journalistiek: diep werken wanneer het kan. Voor de meeste mensen werkt het ritmische model het best.","Kies je stijl: welk vast blok van één tot drie uur per dag kun je reserveren voor diep werk?"],["Rituelen en grote gebaren","Maak diep werk makkelijk met vaste rituelen: waar je werkt, hoe lang, welke regels gelden en wat je nodig hebt. Soms helpt een groot gebaar, zoals ergens anders gaan werken of een duur hotel boeken om een project af te maken. Dat verhoogt je inzet.","Stel een ritueel op: vaste plek, vaste tijd, telefoon weg, en een duidelijk doel voor het blok."],["Omarm verveling","Concentratie is een vaardigheid die je moet trainen. Wie bij elk moment van verveling naar zijn telefoon grijpt, leert zijn brein afleiding te zoeken. Newport adviseert geen focuspauzes, maar internetpauzes: plan wanneer je online gaat en blijf daarbuiten offline, ook in je vrije tijd.","Probeer eens tien minuten in een wachtrij te staan zonder je telefoon. Merk de drang op en laat hem gaan."],["Kritisch met sociale media","Gebruik een tool alleen als de positieve impact op je belangrijkste doelen groter is dan de negatieve. Newport noemt dit de benadering van de vakman. Hij stelt voor om een maand te stoppen met sociale media en daarna te kijken wat je echt mist. Vaak is dat minder dan gedacht.","Neem één social-media-app en stop er dertig dagen mee. Kijk aan het eind wat je echt hebt gemist."],["Droog het ondiepe uit","Plan elke minuut van je werkdag in blokken, zodat je bewust kiest. Spreek met je leidinggevende af hoeveel oppervlakkig werk acceptabel is. Stop op een vast tijdstip en sluit je dag af met een ritueel, waarbij je openstaande taken vastlegt. Zo kan je hoofd 's avonds echt herstellen.","Sluit morgen je werkdag af met een vast ritueel: lijst bijwerken, plan voor morgen, en dan echt stoppen."]]},{"id":"c-kahneman","title":"Thinking, Fast and Slow","titleNl":"Ons feilbare denken","author":"Daniel Kahneman","year":2011,"topic":"Psychologie","summary":"Nobelprijswinnaar Kahneman beschrijft twee systemen in ons denken: snel en intuïtief, en langzaam en bedachtzaam. Hij laat zien hoe ons snelle denken ons systematisch op het verkeerde been zet.","ideas":[["Systeem 1 en systeem 2","Systeem 1 werkt snel, automatisch en zonder moeite: je herkent een boos gezicht of rekent 2+2 uit. Systeem 2 is langzaam en kost inspanning: je vult een belastingformulier in of rekent 17 x 24 uit. We denken dat systeem 2 de baas is, maar meestal neemt systeem 1 de beslissingen.","Bij een belangrijk besluit: noteer je eerste ingeving en neem daarna bewust vijf minuten om die te controleren."],["Systeem 2 is lui","Een knuppel en een bal kosten samen 1,10 dollar, de knuppel kost 1 dollar meer dan de bal. Veel mensen zeggen meteen dat de bal 10 cent kost; het juiste antwoord is 5 cent. Systeem 2 controleert het intuïtieve antwoord vaak niet, omdat nadenken moeite kost.","Bij een snelle conclusie: vraag je af of je het antwoord echt hebt nagerekend, of alleen gevoeld."],["Wat je ziet is alles wat er is","Systeem 1 bouwt een samenhangend verhaal uit de informatie die beschikbaar is, en kijkt niet naar wat ontbreekt. Kahneman noemt dit WYSIATI. Daardoor trekken we snel en zelfverzekerd conclusies uit weinig gegevens. Hoe kloppender het verhaal, hoe zekerder we ons voelen, ook bij een dun fundament.","Vraag bij elke stellige conclusie: welke informatie ontbreekt hier, en wat zou die kunnen veranderen?"],["Ankers sturen je schatting","Een willekeurig getal beïnvloedt je inschatting, zelfs als je weet dat het willekeurig is. In experimenten gaven mensen die eerst een hoog getal zagen hogere schattingen dan mensen die eerst een laag getal zagen. In onderhandelingen en prijzen werkt het eerste getal daarom sterk door.","Bepaal in een onderhandeling of bij een aankoop vooraf je eigen getal, voordat je het eerste bod hoort."],["Wat makkelijk opkomt, lijkt vaak","We schatten hoe vaak iets voorkomt op basis van hoe makkelijk voorbeelden te bedenken zijn. Dat heet de beschikbaarheidsheuristiek. Na veel nieuws over vliegtuigongelukken lijkt vliegen gevaarlijker dan het is. Opvallende, recente gebeurtenissen wegen zwaarder dan de statistiek.","Zoek bij een angst of trend de werkelijke cijfers op in plaats van te vertrouwen op wat je in het nieuws ziet."],["Het Linda-probleem","Linda wordt beschreven als slim, uitgesproken en betrokken bij sociale rechtvaardigheid. Is zij waarschijnlijker bankmedewerker, of bankmedewerker én feministe? Veel mensen kiezen het tweede, terwijl dat logisch nooit waarschijnlijker kan zijn. Een passend verhaal wint het van de kansrekening.","Als een verhaal heel goed klinkt, vraag dan: hoe waarschijnlijk is dit eigenlijk, los van het verhaal?"],["Verlies weegt zwaarder dan winst","Uit de prospecttheorie van Kahneman en Tversky blijkt dat een verlies ongeveer twee keer zo zwaar voelt als een even grote winst. Daarom wijzen mensen een gok met 50 procent kans op winst vaak af als het mogelijke verlies even groot is. Verliesaversie verklaart veel ogenschijnlijk irrationeel gedrag.","Merk het bij jezelf op als je iets vasthoudt omdat je verlies vreest. Zou je het nu nog kopen?"],["De planningsdrogreden","We schatten tijd en kosten van projecten structureel te optimistisch, omdat we uitgaan van ons eigen plan en het beste scenario. Kahneman adviseert de buitenperspectief-methode: kijk hoe lang vergelijkbare projecten bij anderen duurden en gebruik dat als vertrekpunt.","Schat de tijd voor je volgende project en kijk dan hoe lang vergelijkbare projecten eerder duurden. Pas aan."],["Het ervarende en het herinnerende zelf","Ons ervarende zelf beleeft elk moment, het herinnerende zelf maakt er achteraf een verhaal van. Dat verhaal wordt vooral bepaald door het hoogtepunt en het einde, niet door de duur. Een pijnlijke ervaring die mild eindigt, wordt beter herinnerd dan een kortere die abrupt eindigt.","Plan het einde van een vakantie, uitje of gesprek bewust goed. Dat bepaalt hoe je het onthoudt."]]},{"id":"c-cialdini","title":"Influence: The Psychology of Persuasion","titleNl":"Invloed","author":"Robert B. Cialdini","year":1984,"topic":"Psychologie","summary":"Cialdini onderzocht hoe verkopers, fondsenwervers en anderen ons tot ja bewegen. Hij beschrijft zes principes die automatisch gedrag uitlokken, en hoe je je ertegen wapent.","ideas":[["Klik-zoem: automatisch gedrag","Mensen en dieren reageren vaak met vaste patronen op een bepaalde prikkel, alsof er een knop wordt ingedrukt. Die snelkoppelingen zijn meestal nuttig, want je kunt niet alles uitgebreid afwegen. Maar wie de knoppen kent, kan ze bewust indrukken om jou iets te laten doen.","Merk bij je volgende aankoop op welk automatisch signaal je overhaalt: korting, schaarste of populariteit."],["Het contrastprincipe","Hoe we iets beoordelen, hangt af van wat we er net voor zagen. Na een duur pak lijkt een dure trui ineens niet zo duur. Verkopers laten daarom eerst het dure product zien. Makelaars tonen soms eerst een slecht huis, zodat het volgende veel beter lijkt.","Vergelijk bij een aankoop bewust met een eigen referentiepunt, niet met de prijs die de verkoper eerst liet zien."],["Wederkerigheid","We voelen ons verplicht om iets terug te doen als we iets krijgen, ook als we er niet om vroegen. Een gratis proefmonster of een kleine attentie werkt daarom goed. Een variant: iemand vraagt eerst iets groots, en na jouw nee iets kleiners. Die concessie voelt als iets wat je moet beantwoorden.","Als je iets gratis krijgt van een verkoper, erken het, maar laat je beslissing er niet door bepalen."],["Commitment en consistentie","Als we eenmaal iets hebben gezegd of gedaan, willen we daarmee consistent blijven. Wie eerst instemt met een klein verzoek, zegt later makkelijker ja tegen een groter verzoek. Toezeggingen die actief, openbaar en met moeite gedaan zijn, werken het sterkst.","Merk op wanneer je ja zegt alleen omdat je eerder ja zei. Vraag: zou ik hier nu opnieuw voor kiezen?"],["Sociale bewijskracht","Bij twijfel kijken we naar wat anderen doen. Daarom gebruiken reclames 'meest verkocht' en worden tipschalen vooraf gevuld. Het verklaart ook waarom omstanders soms niet ingrijpen bij een noodgeval: iedereen kijkt naar elkaar en niemand doet iets.","Gebruik sociaal bewijs eerlijk: laat in je eigen werk zien wie al met je werkt of wat anderen zeggen."],["Sympathie","We zeggen eerder ja tegen mensen die we aardig vinden. Dat vergroten verkopers met complimenten, gelijkenis en samenwerking. Tupperware-feestjes werken omdat je koopt van een vriendin, niet van een verkoper. Merk je dat je iemand opvallend snel aardig vindt, kijk dan los daarvan naar het aanbod.","Vind je een verkoper opvallend aardig? Scheid in gedachten de persoon van het aanbod en beoordeel dat apart."],["Autoriteit","We gehoorzamen makkelijk aan wie autoriteit uitstraalt, via titels, kleding of uiterlijk. De experimenten van Milgram lieten zien hoe ver mensen gaan als een autoriteit het opdraagt. Vraag je af: is deze persoon echt deskundig op dit punt, en hoe eerlijk is hij hier?","Vraag bij een expert die je iets aanraadt: is hij echt deskundig hierin, en heeft hij er belang bij?"],["Schaarste","Wat schaars is, lijkt waardevoller. 'Op = op' en 'alleen vandaag' maken dat we sneller kopen. Schaarste werkt nog sterker als iets net schaars is geworden, of als anderen ook meedingen. Het advies van Cialdini: merk de opwinding op en vraag je af of je het product wilt hebben of alleen het bezitten.","Bij 'alleen vandaag': wacht een nacht. Wil je het morgen nog steeds, dan is het geen impuls."]]},{"id":"c-housel","title":"The Psychology of Money","titleNl":"De psychologie van geld","author":"Morgan Housel","year":2020,"topic":"Geld","summary":"Housel betoogt dat omgaan met geld minder over kennis gaat en meer over gedrag. Hij beschrijft in korte hoofdstukken hoe mensen echt met geld omgaan en wat werkt op de lange termijn.","ideas":[["Niemand is gek","Hoe je met geld omgaat, wordt sterk gevormd door wat je zelf hebt meegemaakt: in welke tijd je opgroeide, welke crises je zag. Iemand die opgroeide met hoge inflatie kijkt anders naar sparen dan iemand die opgroeide in een beursboom. Keuzes die anderen gek lijken, zijn vaak logisch vanuit hun ervaring.","Bedenk welke ervaring jouw kijk op geld het meest heeft gevormd. Welke gewoonte komt daaruit voort?"],["Geluk en risico","Succes en mislukking hangen meer af van geluk en risico dan we denken. Daardoor leren we vaak de verkeerde lessen van extreme voorbeelden. Housel adviseert: wees voorzichtig met wie je bewondert en wie je veroordeelt, en kijk naar brede patronen in plaats van naar individuele uitschieters.","Kijk bij een succesverhaal ook naar wie hetzelfde deed en faalde. Wat zegt dat over de rol van geluk?"],["Weet wanneer het genoeg is","Het moeilijkste in geldzaken is stoppen met de doelpaal verplaatsen. Housel beschrijft rijke mensen die alles op het spel zetten voor nog meer, en daarbij verloren wat ze al hadden. Genoeg hebben betekent accepteren dat je niet alles hoeft te pakken wat je kunt pakken.","Schrijf op wat voor jou 'genoeg' is: welk vermogen of inkomen geeft jou rust, niet status?"],["De kracht van rente op rente","Warren Buffett is vooral zo rijk omdat hij jong begon en tientallen jaren bleef beleggen; het grootste deel van zijn vermogen ontstond pas na zijn 65e. Groei over lange tijd is lastig te bevatten. Wie lang volhoudt met redelijke rendementen, wint het vaak van wie kort spectaculair scoort.","Reken uit wat een vast maandbedrag oplevert als je het dertig jaar laat groeien. Begin vandaag."],["Rijk worden versus rijk blijven","Rijk worden vraagt risico en optimisme. Rijk blijven vraagt het tegenovergestelde: bescheidenheid en angst dat het ook weer weg kan. Het belangrijkste is overleven, zodat rente op rente zijn werk kan doen. Vermijd dus beslissingen waarbij je alles kunt verliezen.","Zorg voor een buffer van een paar maanden uitgaven, zodat je nooit gedwongen bent te verkopen."],["Vrijheid is het hoogste rendement","Het grootste wat geld je kan geven, is controle over je tijd: kunnen doen wat je wilt, wanneer je wilt, met wie je wilt. Housel stelt dat die autonomie meer bijdraagt aan geluk dan een hoger inkomen of mooiere spullen.","Kijk naar een volgende loonsverhoging: kun je een deel inzetten om meer vrije tijd te kopen?"],["De paradox van de man in de auto","Als je iemand in een dure auto ziet, denk je zelden 'wat een coole man'. Je denkt 'als ik die auto had, zouden mensen mij cool vinden'. Mensen zijn minder onder de indruk van jouw spullen dan jij denkt. Respect krijg je eerder via vriendelijkheid dan via bezit.","Denk aan je volgende grote aankoop: koop je hem voor jezelf of om indruk te maken?"],["Rijkdom is wat je niet ziet","Wat je ziet zijn uitgaven: de auto, het huis, de vakantie. Rijkdom is het geld dat níet is uitgegeven. Daarom is het moeilijk om van anderen te leren hoe je vermogen opbouwt. Sparen begint met minder willen, niet met meer verdienen, en je hoeft geen specifiek doel te hebben om te sparen.","Bekijk je uitgaven van vorige maand. Welk deel had je kunnen laten staan zonder het te missen?"],["Redelijk is beter dan rationeel","Een financieel plan dat je volhoudt, is beter dan een theoretisch optimaal plan dat je loslaat bij de eerste daling. Housel kiest bewust voor keuzes waar hij goed bij slaapt. Bouw ook ruimte voor fouten in: buffers, lagere verwachtingen en geen afhankelijkheid van één scenario.","Kies een beleggingsplan dat je ook volhoudt bij een daling van dertig procent, ook als het niet 'optimaal' is."]]},{"id":"c-rich-dad","title":"Rich Dad Poor Dad","titleNl":"Rijke pa, arme pa","author":"Robert T. Kiyosaki","year":1997,"topic":"Geld","summary":"Kiyosaki vergelijkt de lessen over geld van zijn eigen vader met die van de vader van een vriend, een ondernemer. Het boek is invloedrijk maar omstreden; zie het als zijn persoonlijke visie, niet als financieel advies.","ideas":[["Twee vaders, twee visies","Kiyosaki's eigen vader was hoogopgeleid en werkte voor de overheid, maar had steeds geldzorgen. De vader van zijn vriend had weinig opleiding maar bouwde een vermogen op als ondernemer. De arme vader zei 'dat kan ik me niet veroorloven', de rijke vader vroeg 'hoe kan ik me dat veroorloven?'","Let op wanneer je zegt 'dat kan ik me niet veroorloven'. Vraag in plaats daarvan: hoe zou ik het kunnen?"],["Werk niet voor geld","Volgens Kiyosaki houden angst en begeerte de meeste mensen gevangen in de ratrace: een salaris verdienen, meer uitgeven als je meer verdient, en nooit vrij komen. De rijken laten volgens hem geld voor zich werken, in plaats van zelf voor geld te werken.","Kijk naar je laatste salarisverhoging: ging die naar uitgaven of naar iets wat geld oplevert?"],["Bezittingen en verplichtingen","Zijn kernregel: een bezitting brengt geld in je zak, een verplichting haalt geld uit je zak. Volgens die definitie is je eigen huis vaak geen bezitting, omdat het maandelijks geld kost. Deze stelling is omstreden, maar dwingt je wel om naar kasstromen te kijken in plaats van naar boekwaarde.","Maak een lijst van wat je bezit en kijk per item: levert het geld op of kost het maandelijks geld?"],["Bouw je eigen kolom","Kiyosaki onderscheidt je beroep van je zaak. Je beroep levert salaris op, je zaak is je kolom met bezittingen: beleggingen, vastgoed of bedrijven die inkomen opleveren. Hij adviseert je baan te houden, maar extra inkomen te gebruiken om bezittingen te kopen in plaats van luxe.","Bepaal één bezitting die je dit jaar wilt opbouwen, zoals een beleggingsrekening of extra inkomen."],["Financiële kennis als basis","Op school leer je volgens Kiyosaki niet hoe geld werkt. Hij noemt vier vaardigheden: boekhouding, beleggen, kennis van markten en kennis van wetgeving en belastingen. Wie die begrijpt, ziet kansen die anderen missen.","Kies één van de vier vaardigheden die je het minst beheerst en lees of leer er deze maand iets over."],["Werk om te leren","Kies werk niet alleen om het salaris, maar om wat je ervan leert. Kiyosaki noemt verkopen en communiceren als belangrijkste vaardigheden. Veel mensen zijn goed in één vak, maar verdienen weinig omdat ze niet kunnen verkopen of een bedrijf niet begrijpen.","Vraag je bij je volgende baan of project af: wat leer ik hiervan, los van het salaris?"],["Betaal jezelf eerst","Zet geld opzij voor investeringen voordat je rekeningen en uitgaven betaalt. Kiyosaki betoogt dat de druk om dan toch de rekeningen te betalen je creatief maakt in het vinden van extra inkomen. Dat advies is riskant als je geen buffer hebt; het principe van eerst sparen wordt wel breed gedeeld.","Zet een automatische overboeking op naar sparen of beleggen op de dag dat je salaris binnenkomt."]]},{"id":"c-why-we-sleep","title":"Why We Sleep","titleNl":"Slaap","author":"Matthew Walker","year":2017,"topic":"Gezondheid","summary":"Slaaponderzoeker Matthew Walker legt uit wat slaap doet voor brein en lichaam, en wat er misgaat als we te weinig slapen. Let op: sommige stellingen in het boek zijn door andere wetenschappers bekritiseerd als overdreven.","ideas":[["Twee krachten bepalen je slaap","Je slaap wordt gestuurd door je biologische klok, het circadiane ritme, en door slaapdruk. Slaapdruk ontstaat doordat de stof adenosine zich gedurende de dag ophoopt in je hersenen. Hoe langer je wakker bent, hoe meer adenosine en hoe slaperiger je wordt.","Kies een vaste opstaattijd voor de komende twee weken, ook in het weekend, en houd die vast."],["Cafeïne verbergt je vermoeidheid","Cafeïne blokkeert de receptoren voor adenosine, waardoor je de slaapdruk niet voelt. De adenosine blijft er wel. Cafeïne werkt lang na: uren na je laatste kop zit nog een flink deel in je lichaam. Een middagkoffie kan je nachtslaap daardoor verstoren, ook als je wel in slaap valt.","Drink je laatste cafeïne vóór het begin van de middag en merk op of je slaap verandert."],["Non-REM en REM hebben elk een taak","Diepe non-REM-slaap helpt om herinneringen van de dag vast te leggen en het brein op te ruimen. REM-slaap, waarin je droomt, helpt bij het verwerken van emoties en het leggen van creatieve verbanden. Omdat beide fasen in een vast patroon door de nacht lopen, mis je iets als je korter slaapt.","Plan na een leerdag geen korte nacht. Geef je brein de nacht om het geleerde vast te leggen."],["Slaap voor en na het leren","Slaap vooraf maakt je brein klaar om nieuwe informatie op te nemen. Slaap achteraf zorgt dat het geleerde blijft hangen. Een nacht doorhalen voor een examen is daarom contraproductief: je leert slechter en vergeet meer.","Leer of oefen iets belangrijks liever op de dag voor een goede nacht slaap, niet de avond voor een deadline."],["Ochtend- en avondmensen","Of je een ochtend- of avondmens bent, is voor een groot deel aangeboren. Avondmensen hebben het zwaar in een maatschappij die vroeg begint. Bij tieners verschuift het ritme tijdelijk naar later, waardoor vroege schooltijden volgens Walker slecht voor ze uitpakken.","Bepaal je chronotype: wanneer word je wakker zonder wekker? Plan je zwaarste werk op je beste tijd."],["Te weinig slaap kost gezondheid","Walker koppelt structureel te weinig slaap aan een zwakkere afweer, hart- en vaatziekten, schommelingen in eetlust en een hoger risico op hersenziekten. Hij adviseert volwassenen zeven tot negen uur. Critici vinden sommige verbanden en cijfers in het boek te sterk aangezet, maar dat slaap belangrijk is, staat niet ter discussie.","Houd een week bij hoeveel uur je echt slaapt. Zit je structureel onder de zeven uur, maak het dan een prioriteit."],["Praktische slaaptips","Ga elke dag op hetzelfde tijdstip naar bed en sta op hetzelfde tijdstip op, ook in het weekend. Houd je slaapkamer koel en donker. Vermijd fel licht en schermen vlak voor het slapengaan. Alcohol helpt je misschien in slaap, maar verstoort de slaap verderop in de nacht, vooral de REM-slaap.","Maak je slaapkamer koeler en donkerder en leg je telefoon buiten de slaapkamer."],["Slaappillen zijn geen echte slaap","Volgens Walker geven veel slaapmiddelen een verdoving die niet gelijk is aan natuurlijke slaap. Voor chronische slapeloosheid noemt hij cognitieve gedragstherapie voor insomnie (CGT-I) als eerste keus. Daarin leer je onder meer je slaapgewoonten en gedachten rond slapen aanpassen.","Slaap je al maanden slecht? Bespreek met je huisarts of cognitieve gedragstherapie voor insomnie iets voor je is."]]},{"id":"c-outlive","title":"Outlive","titleNl":"Outlive","author":"Peter Attia","year":2023,"topic":"Gezondheid","summary":"Arts Peter Attia wil niet alleen langer leven, maar vooral langer gezond leven. Hij beschrijft een proactieve aanpak tegen de grote chronische ziekten, met beweging als belangrijkste middel.","ideas":[["Van Medicine 2.0 naar 3.0","De huidige geneeskunde, die Attia Medicine 2.0 noemt, is goed in acute problemen maar grijpt bij chronische ziekten vaak te laat in. Hij pleit voor Medicine 3.0: preventief, gericht op het individu, en jaren vóór de diagnose al bezig met risico's terugdringen.","Kijk naar je gezondheid over twintig jaar. Welke kleine maatregel nu verkleint een groot risico later?"],["De vier ruiters","De meeste mensen sterven uiteindelijk aan een van vier chronische ziekten: hart- en vaatziekten, kanker, neurodegeneratieve ziekten zoals alzheimer, en stofwisselingsziekten zoals diabetes type 2. Ze ontwikkelen zich over tientallen jaren, dus is er lang de tijd om ze te vertragen.","Vraag bij een volgend gesprek met je huisarts naar je risico op hart- en vaatziekten en diabetes."],["Levensduur en gezondheidsduur","Attia maakt onderscheid tussen hoe lang je leeft en hoe lang je gezond en vitaal leeft. Hij wil vooral het laatste verlengen. Het 'marginale decennium', je laatste tien levensjaren, verloopt voor veel mensen in slechte gezondheid. Dat wil hij verbeteren.","Vraag je af hoe je je laatste tien levensjaren wilt doorbrengen. Wat moet je daarvoor nu doen?"],["De tienkamp voor honderdjarigen","Bedenk welke dingen je op je negentigste nog wilt kunnen: kleinkinderen optillen, trappen lopen, een koffer in het bagagevak tillen. Reken terug wat je daarvoor nu moet trainen, want kracht en conditie nemen met de jaren flink af. Attia noemt dit de Centenarian Decathlon.","Maak een lijstje van vijf dingen die je op je tachtigste nog wilt kunnen, en welke training daarbij hoort."],["Beweging is het sterkste medicijn","Volgens Attia is er geen middel dat zoveel doet voor een lang gezond leven als beweging. Hij noemt vier pijlers: duurtraining in zone 2 (rustig maar stevig), training van je VO2max (maximale zuurstofopname), krachttraining en stabiliteit. Een hoge VO2max hangt sterk samen met een lager sterfterisico.","Plan deze week drie keer bewegen: twee keer rustig duurwerk en één keer krachttraining."],["Kijk naar apoB","Voor hart- en vaatziekten vindt Attia apoB een betere maat dan het gewone cholesterolgetal. ApoB telt het aantal deeltjes dat cholesterol in de vaatwand kan brengen. Omdat aderverkalking tientallen jaren duurt, adviseert hij dit risico al vroeg en stevig te verlagen.","Vraag bij een bloedonderzoek of je apoB of je cholesterolwaarden kunt laten meten en bespreek ze."],["Voeding zonder dogma","Attia gelooft niet in één ideaal dieet. Hij spreekt liever van voedingsbiochemie: kijken wat voor jouw lichaam werkt. Wel benadrukt hij genoeg eiwit, vooral bij het ouder worden, om spiermassa te behouden. Te veel calorieën en een slechte bloedsuikerregulatie ziet hij als grote risico's.","Kijk naar je eiwitinname en spiermassa. Eet je voldoende eiwit, vooral naarmate je ouder wordt?"],["Emotionele gezondheid telt mee","Attia beschrijft eerlijk zijn eigen crisis en hoe hij werkte aan zijn emotionele gezondheid. Een lang leven heeft weinig waarde als je ongelukkig bent of je relaties schaadt. Hij rekent emotioneel welzijn daarom tot de kern van gezond ouder worden, naast beweging, voeding en slaap.","Plan tijd voor relaties en emotionele gezondheid, net zo serieus als voor training of voeding."]]},{"id":"c-full-engagement","title":"The Power of Full Engagement","titleNl":"De kracht van volledige betrokkenheid","author":"Jim Loehr & Tony Schwartz","year":2003,"topic":"Energie","summary":"Loehr en Schwartz stellen dat niet tijd maar energie onze belangrijkste hulpbron is. Op basis van hun werk met topsporters laten ze zien hoe je energie opbouwt en herstelt.","ideas":[["Beheer energie, niet tijd","De hoeveelheid uren op een dag ligt vast, de hoeveelheid energie niet. Prestaties, gezondheid en geluk hangen af van hoe goed je je energie beheert. Volgens de auteurs is volledige betrokkenheid het doel: met volle energie aanwezig zijn bij wat je doet.","Kijk naar je agenda: wanneer had je deze week de meeste energie, en wat deed je toen?"],["Vier bronnen van energie","Energie heeft vier dimensies: fysiek, emotioneel, mentaal en spiritueel. Fysieke energie is de basis, via slaap, voeding en beweging. Emotionele energie bepaalt de kwaliteit, mentale energie de focus en spirituele energie, je gevoel van zin, geeft de kracht om door te gaan.","Geef jezelf een cijfer voor je fysieke, emotionele, mentale en spirituele energie. Welke bron is het zwakst?"],["Wisselen tussen inspanning en herstel","Topsporters presteren goed omdat ze inspanning en herstel afwisselen. Wie continu doorgaat zonder herstel, raakt opgebrand. Wie te weinig inspanning levert, takelt af. Ons lichaam werkt in cycli van ongeveer anderhalf tot twee uur; plan daarna een kort moment van herstel.","Zet na elke anderhalf uur werk een korte pauze in: even lopen, water halen, naar buiten kijken."],["Groei door over je grens te gaan","Spieren worden sterker door ze iets meer te belasten dan normaal en ze daarna te laten herstellen. Dat geldt ook voor emotionele en mentale capaciteit. Train dus bewust buiten je comfortzone, maar bouw ook daar de rust in die nodig is om sterker terug te komen.","Kies één gebied waarin je jezelf net iets verder pusht, en plan er bewust herstel na."],["Rituelen in plaats van wilskracht","Wilskracht is beperkt. Positieve rituelen, vaste gewoonten op vaste momenten, kosten na verloop van tijd nauwelijks energie meer. Denk aan een vast tijdstip van eten, bewegen of afsluiten van de werkdag. De auteurs adviseren om klein te beginnen en rituelen heel precies te omschrijven.","Kies één positief ritueel en beschrijf het precies: wat, wanneer, waar. Houd het dertig dagen vol."],["Zin geeft de meeste energie","De sterkste bron van energie is een doel dat groter is dan jezelf. Wie weet waarvoor hij werkt en leeft, kan meer aan en herstelt sneller. Stel jezelf de vraag wat echt belangrijk is en of de manier waarop je je energie besteedt daarbij past.","Schrijf in één zin op waarvoor je je energie wilt inzetten. Toets je week daaraan."],["Drie stappen tot verandering","De auteurs beschrijven een veranderproces in drie stappen. Definieer je doel en waarden. Kijk eerlijk naar de werkelijkheid: hoe besteed je je energie nu echt? En kom in actie met concrete rituelen om het gat tussen die twee te dichten.","Doe de drie stappen voor één verandering: wat wil je, hoe staat het nu, en welk ritueel overbrugt het verschil?"]]},{"id":"c-breath","title":"Breath: The New Science of a Lost Art","titleNl":"Adem","author":"James Nestor","year":2020,"topic":"Energie","summary":"Journalist James Nestor onderzoekt hoe we ademen en wat er misgaat. Hij combineert eigen experimenten, wetenschap en oude ademtechnieken tot een pleidooi voor bewuster en rustiger ademen.","ideas":[["De meeste mensen ademen verkeerd","Nestor stelt dat veel mensen te snel, te veel en door de mond ademen. Dat heeft gevolgen voor slaap, energie en gezondheid. Ademhaling gebeurt automatisch, maar je kunt haar ook bewust sturen, en daarmee beïnvloed je je lichaam meer dan je denkt.","Let de komende dag op hoe je ademt: door je neus of je mond, snel of rustig, hoog of laag?"],["Het neusexperiment","Nestor deed mee aan een experiment op Stanford waarbij hij tien dagen met afgeplakte neus alleen door zijn mond ademde. Hij ging snurken, sliep slechter, zijn bloeddruk steeg en hij voelde zich beroerd. Toen hij weer door zijn neus ademde, verbeterde dat snel.","Probeer bij een wandeling alleen door je neus te ademen. Merk op wat er gebeurt."],["Adem door je neus","De neus filtert, verwarmt en bevochtigt de lucht en produceert stikstofmonoxide, wat de bloedvaten helpt verwijden. Neusademhaling zorgt volgens Nestor voor een efficiëntere opname van zuurstof. Sommige mensen plakken 's nachts hun mond licht af om door de neus te blijven ademen.","Adem bij het sporten, slapen en werken zoveel mogelijk door je neus. Begin met rustige inspanning."],["Adem minder","Veel mensen ademen meer dan nodig. Dat verlaagt het koolzuur in je bloed, terwijl je dat juist nodig hebt om zuurstof goed aan je weefsels af te geven. Methoden zoals die van Buteyko leren je rustiger en minder te ademen en meer koolzuur te verdragen.","Oefen een paar keer per dag rustig uitademen en daarna even pauzeren voordat je weer inademt."],["Langzaam ademen in een rustig ritme","Nestor beschrijft een ritme van ongeveer vijf à zes seconden in en vijf à zes seconden uit. Dat komt neer op een kleine zes ademhalingen per minuut. Zo'n langzaam ritme brengt het lichaam in een kalmere, efficiëntere toestand en wordt al eeuwenlang in gebed en meditatie gebruikt.","Oefen vijf minuten per dag: vijf à zes seconden in, vijf à zes seconden uit, door je neus."],["Kauwen vormt je luchtwegen","Volgens onderzoek dat Nestor aanhaalt, zijn menselijke kaken en gezichten kleiner geworden sinds we zachter bewerkt voedsel eten. Minder kauwen betekent minder ontwikkeling van kaak en luchtwegen. Dat kan bijdragen aan scheve tanden, snurken en ademhalingsproblemen.","Kies vaker voeding die je goed moet kauwen, zoals rauwe groenten en noten."],["Soms juist harder ademen","Er zijn ook technieken waarbij je bewust snel en diep ademt, zoals Tummo en de methode van Wim Hof. Die zetten het lichaam kort onder stress, wat de stressreactie kan trainen. Nestor beschrijft ze als krachtig, maar niet bedoeld om de hele dag zo te ademen.","Wil je intensieve ademtechnieken proberen? Doe dat zittend of liggend, nooit in of bij water, en bouw het rustig op."]]},{"id":"c-start-with-why","title":"Start with Why","titleNl":"Begin met het waarom","author":"Simon Sinek","year":2009,"topic":"Leiderschap","summary":"Sinek stelt dat inspirerende leiders en organisaties communiceren vanuit hun waarom: hun doel en overtuiging. Pas daarna komt hoe ze het doen en wat ze maken.","ideas":[["De Gouden Cirkel","Sinek tekent drie cirkels: in het midden het waarom, daaromheen het hoe, buiten het wat. Elke organisatie weet wat ze doet, sommige weten hoe, maar weinig weten waarom. De meeste communiceren van buiten naar binnen. Inspirerende leiders beginnen in het midden.","Schrijf voor je werk of project op: waarom doe ik dit, hoe doe ik het, en wat lever ik?"],["Mensen kopen waarom je het doet","Sineks voorbeeld is Apple. Het zei niet 'wij maken goede computers', maar communiceerde eerst een overtuiging: het bestaande uitdagen en anders denken. Pas daarna kwamen de producten. Volgens Sinek kopen mensen niet wat je doet, maar waarom je het doet.","Begin je volgende presentatie of pitch met waarom het ertoe doet, voordat je uitlegt wat je aanbiedt."],["De biologie achter het waarom","De Gouden Cirkel past volgens Sinek bij hoe onze hersenen werken. Het deel dat gevoelens en beslissingen stuurt, kan niet goed met taal omgaan. Daarom voelt een besluit soms goed zonder dat je kunt uitleggen waarom. Een helder waarom spreekt dat deel van het brein direct aan.","Vraag je bij een product dat je trouw koopt af: wat is de overtuiging erachter die mij aanspreekt?"],["Manipuleren of inspireren","Je kunt gedrag beïnvloeden met prijsverlagingen, acties, angst of nieuwigheid. Dat werkt op korte termijn, maar bouwt geen loyaliteit op. Wie inspireert vanuit een overtuiging, krijgt mensen die terugkomen omdat ze erin geloven, ook als het alternatief goedkoper is.","Kijk naar je eigen marketing of verkoop: hoeveel draait om korting en angst, en hoeveel om overtuiging?"],["Vroege volgers maken het verschil","Sinek gebruikt de wet van diffusie van innovaties. Het eerste kleine deel van de markt koopt vanwege een gedeelde overtuiging. Pas als je die groep hebt, volgt de massa. Wie zich direct op de massa richt zonder de vroege gelovigen, komt zelden voorbij het kantelpunt.","Zoek de eerste tien mensen die echt geloven in wat je doet. Richt je eerst op hen, niet op de massa."],["Helderheid, discipline en consistentie","Een helder waarom is niet genoeg. Je hebt ook de discipline nodig om je hoe, je werkwijze en waarden, daarop af te stemmen. En je wat, alles wat je zegt en maakt, moet consistent zijn met je overtuiging. Pas dan geloven mensen je.","Toets een recente beslissing: past die bij je waarom, je waarden en wat je naar buiten brengt?"],["De gebroeders Wright","Samuel Langley had geld, contacten en aandacht om als eerste te vliegen. De gebroeders Wright hadden dat niet, maar wel een diep geloof in waarom vliegen belangrijk was. Zij slaagden. Langley stopte toen hij werd verslagen; hij zocht roem, geen doel.","Vraag je bij een doel af: zou ik dit ook doen als niemand het zag of als ik er geen erkenning voor kreeg?"],["Als het waarom vervaagt","Naarmate organisaties groeien, raakt het waarom vaak op de achtergrond. Sinek noemt Walmart na het vertrek van oprichter Sam Walton als voorbeeld: de focus verschoof naar wat en hoe. Bewaak daarom bewust het oorspronkelijke doel, juist in tijden van groei en opvolging.","Als je team groeit: hoe zorg je dat nieuwe mensen het waarom net zo goed snappen als de eerste mensen?"]]},{"id":"c-extreme-ownership","title":"Extreme Ownership","titleNl":"Extreme Ownership","author":"Jocko Willink & Leif Babin","year":2015,"topic":"Leiderschap","summary":"Twee voormalige Navy SEAL-officieren vertalen hun gevechtservaring in Irak naar leiderschap in organisaties. Kernboodschap: een leider neemt volledige verantwoordelijkheid voor alles in zijn wereld.","ideas":[["Neem extreem eigenaarschap","Een leider is verantwoordelijk voor alles wat er in zijn team gebeurt. Willink beschrijft een incident in Ramadi waarbij Amerikaanse eenheden per ongeluk op elkaar schoten. In de evaluatie nam hij de volledige schuld op zich. Juist dat bracht vertrouwen en zorgde dat het team leerde.","Kies een recent probleem in je team. Schrijf op wat jouw aandeel was, ook als anderen fouten maakten."],["Er zijn geen slechte teams","Tijdens de SEAL-opleiding werden de leiders van het beste en het slechtste bootteam omgewisseld. Het slechtste team begon direct te winnen. De les van Willink en Babin: er zijn geen slechte teams, alleen slechte leiders. Wat een leider tolereert, wordt de norm.","Kijk naar een terugkerend probleem in je team: welke norm heb je zelf, misschien ongemerkt, getolereerd?"],["Geloof in de missie","Een leider moet zelf geloven in de opdracht om anderen te overtuigen. Begrijp je een besluit van hogerop niet, vraag dan door tot je het waarom snapt. Pas als je de redenering kunt uitleggen, kun je je mensen meekrijgen.","Begrijp je een besluit van hogerop niet? Vraag door tot je het kunt uitleggen aan je eigen mensen."],["Zet je ego opzij","Ego staat goede samenwerking, feedback en eerlijke evaluaties in de weg. Wie zijn gelijk wil halen of anderen de schuld geeft, leert niets. Willink en Babin zien zelfvertrouwen als nodig, maar het moet ondergeschikt blijven aan de missie.","Merk op wanneer je je gelijk wilt halen in een overleg. Vraag jezelf: wat dient het doel hier het meest?"],["Dekken en bewegen","In gevechten beweegt de ene eenheid terwijl de andere dekking geeft. Dat principe geldt ook in organisaties: afdelingen en teams moeten elkaar ondersteunen in plaats van tegen elkaar te concurreren. Uiteindelijk wint of verliest het hele team samen.","Spreek met een andere afdeling af hoe jullie elkaar kunnen helpen in plaats van elkaar te beconcurreren."],["Houd het simpel","Plannen en opdrachten moeten zo eenvoudig zijn dat iedereen ze begrijpt. Als het misgaat, wordt complexiteit gevaarlijk. Check of je mensen het plan in eigen woorden kunnen uitleggen; zo niet, dan is het te ingewikkeld.","Laat iemand je plan in eigen woorden navertellen. Lukt dat niet, maak het dan eenvoudiger."],["Prioriteer en voer uit","Als alles tegelijk op je afkomt, blijf rustig en kies het belangrijkste probleem. Los dat op met volle aandacht, ga dan naar het volgende. Willink noemt het belangrijk om afstand te nemen en het overzicht te bewaren, in plaats van je in alle details te laten meesleuren.","Bij drukte: stap even terug, kies het belangrijkste probleem en richt al je aandacht daarop."],["Gedecentraliseerd leiderschap","Een leider kan niet alles zelf aansturen. Teams van vier tot vijf mensen met een eigen leider werken het best, mits iedereen de bedoeling van de opdracht begrijpt. Dan kunnen mensen op lager niveau zelf beslissen als de situatie verandert.","Zorg dat je team de bedoeling achter de opdracht kent, zodat ze zelf kunnen beslissen als het verandert."],["Discipline is vrijheid","Willink staat elke ochtend vroeg op om te trainen. Discipline in gewoonten en voorbereiding geeft volgens hem juist vrijheid: wie strakke procedures heeft, kan in onverwachte situaties sneller en flexibeler handelen.","Kies één gewoonte, zoals vaste opstaattijd of voorbereiding, die je meer vrijheid geeft op andere momenten."]]},{"id":"c-carnegie","title":"How to Win Friends and Influence People","titleNl":"Hoe u vrienden kunt winnen","author":"Dale Carnegie","year":1936,"topic":"Relaties","summary":"Een van de bekendste boeken over omgang met mensen. Carnegie geeft eenvoudige principes om sympathie te winnen, anderen te overtuigen en kritiek te geven zonder te kwetsen.","ideas":[["Bekritiseer niet","Kritiek maakt mensen defensief en levert zelden verandering op. Mensen rechtvaardigen hun gedrag, ook als het fout was. Carnegie adviseert: veroordeel, bekritiseer en klaag niet. Probeer te begrijpen waarom iemand doet wat hij doet; dat levert meer op dan een verwijt.","Houd een dag lang bij hoe vaak je klaagt of kritiek geeft. Vervang één keer kritiek door een vraag."],["Geef oprechte waardering","Mensen verlangen ernaar zich belangrijk en gewaardeerd te voelen. Geef daarom eerlijke en gemeende waardering, geen vleierij. Vleien is onoprecht en wordt doorzien. Oprechte waardering laat zien dat je iemand werkelijk ziet.","Geef vandaag iemand een specifieke, oprechte waardering voor iets wat hij of zij deed."],["Begin bij wat de ander wil","Als je iemand wilt overtuigen, praat dan over wat hij wil, niet over wat jij wilt. Carnegie: wie anderen iets wil laten doen, moet eerst in hen een sterk verlangen opwekken. Vraag jezelf af hoe je de ander kunt laten wíllen wat jij voorstelt.","Bereid je volgende verzoek voor vanuit het belang van de ander: wat levert het hem of haar op?"],["Wees oprecht geïnteresseerd","Je maakt meer vrienden in twee maanden door oprecht geïnteresseerd te zijn in anderen dan in twee jaar door hen in jou geïnteresseerd te maken. Glimlach, onthoud namen, luister goed en praat over wat de ander bezighoudt. Mensen voelen zich dan gezien.","Stel in je volgende gesprek drie open vragen over de ander en onthoud de naam."],["Win geen discussies","Een discussie win je nooit: verlies je, dan heb je verloren, en win je, dan voelt de ander zich gekrenkt. Toon respect voor andermans mening en zeg nooit botweg 'je hebt ongelijk'. Heb je zelf ongelijk
