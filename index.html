function findBook(id){return ALL.find(b=>b.id===id)||S.books.find(b=>b.id===id)||(gen&&gen.book.id===id?gen.book:null)}
const prog=b=>Math.min(S.prof.progress[b.id]||0,b.ideas.length);
const finished=b=>!b.live&&b.ideas.length>0&&prog(b)>=b.ideas.length;

/* ---------- aanbevelingen ---------- */
/* Profiel (doelen en onderwerpen) plus wat je echt leest: begonnen boeken tellen mee, uitgelezen boeken dubbel */
function topicWeights(){const w={};for(const t of S.prof.topics||[])w[t]=(w[t]||0)+3;
  for(const g of S.prof.goals||[]){const G=GOALS.find(x=>x.id===g);if(G)G.topics.forEach((t,i)=>w[t]=(w[t]||0)+(i===0?2:1))}
  /* wat je leest telt mee, maar per onderwerp hooguit 1,5 punt: zo trekt veel lezen in één onderwerp niet alles naar zich toe */
  const h={};for(const [id,n] of Object.entries(S.prof.progress||{})){if(!n)continue;const b=findBook(id);if(b&&b.topic)h[b.topic]=(h[b.topic]||0)+(finished(b)?1:0.5)}
  for(const t in h)w[t]=(w[t]||0)+Math.min(1.5,h[t]);
  return w}
/* Verwante onderwerpen, voor "Omdat je … las" */
const RELATED={Ondernemen:["Leiderschap","Economie","Productiviteit"],Leiderschap:["Communicatie","Ondernemen","Psychologie"],Productiviteit:["Gewoontes","Energie","Mindset"],Psychologie:["Relaties","Mindset","Communicatie"],Geld:["Economie","Ondernemen","Mindset"],Gezondheid:["Energie","Gewoontes","Wetenschap"],Energie:["Gezondheid","Productiviteit","Gewoontes"],Mindset:["Filosofie","Psychologie","Gewoontes"],Relaties:["Psychologie","Communicatie","Filosofie"],Filosofie:["Mindset","Geschiedenis","Psychologie"],Communicatie:["Leiderschap","Relaties","Psychologie"],Gewoontes:["Productiviteit","Gezondheid","Mindset"],Wetenschap:["Natuur","Technologie","Geschiedenis"],Natuur:["Wetenschap","Geschiedenis","Gezondheid"],Geschiedenis:["Politiek","Economie","Filosofie"],Politiek:["Geschiedenis","Economie","Filosofie"],Economie:["Geld","Politiek","Geschiedenis"],Technologie:["Wetenschap","Economie","Ondernemen"]};
/* Om de beurt één boek per onderwerp, zwaarste onderwerp eerst */
function roundRobin(topics,lists,limit){const out=[];
  while(out.length<limit){let added=false;for(const t of topics){const L=lists[t];if(L&&L.length&&out.length<limit){out.push(L.shift());added=true}}if(!added)break}
  return out}
function whyFor(b){const gs=(S.prof.goals||[]).map(g=>GOALS.find(x=>x.id===g)).filter(G=>G&&G.topics.includes(b.topic));
  if(gs.length)return T("Voor: ","For: ","Für: ")+gs[0].label.toLowerCase();
  if((S.prof.topics||[]).includes(b.topic))return T("Jij volgt ","You follow ","Du folgst ")+tn(b.topic);return ""}
const dayRnd=id=>{let h=2166136261;for(const c of dayKey()+id)h=Math.imul(h^c.charCodeAt(0),16777619);return (h>>>0)/4294967296};
/* Aanbevelingen: om de beurt een boek uit elk van je onderwerpen, zodat één onderwerp de rij niet overneemt */
const fresh=(b,read)=>!read.has(b.id)&&prog(b)===0&&!b.unknown;
const pickScore=b=>(b.lazy?0:0.6)+dayRnd(b.id)*0.9;
function recommended(limit){const w=topicWeights(),read=new Set(S.prof.read||[]);
  const topics=Object.keys(w).filter(t=>w[t]>0).sort((a,b)=>w[b]-w[a]);
  if(!topics.length)return ALL.filter(b=>fresh(b,read)).sort((a,b)=>pickScore(b)-pickScore(a)).slice(0,limit);
  const lists={};for(const b of ALL)if(w[b.topic]&&fresh(b,read))(lists[b.topic]||(lists[b.topic]=[])).push(b);
  for(const t in lists)lists[t].sort((a,b)=>pickScore(b)-pickScore(a));
  return roundRobin(topics,lists,limit)}
/* Het laatste boek waar je echt in las (minstens 3 ideeën) */
function lastRead(){const t=S.prof.touched||{};
  return Object.keys(S.prof.progress||{}).filter(id=>(S.prof.progress[id]||0)>=3).map(findBook).filter(b=>b&&b.topic&&!b.kind).sort((a,b)=>(t[b.id]||0)-(t[a.id]||0))[0]||null}
/* "Omdat je X las": twee boeken uit hetzelfde onderwerp, de rest uit verwante onderwerpen */
function becauseRead(limit,skip=[]){const from=lastRead();if(!from)return null;const read=new Set([...(S.prof.read||[]),...skip,from.id]);
  const topics=[from.topic,...(RELATED[from.topic]||[])],lists={};
  for(const t of topics)lists[t]=ALL.filter(b=>b.topic===t&&fresh(b,read)).sort((a,b)=>dayRnd(a.id)-dayRnd(b.id));
  const same=lists[from.topic].splice(0,2);
  const books=[...same,...roundRobin(topics.slice(1),lists,limit-same.length)].slice(0,limit);
  return books.length?{from,books}:null}

/* ---------- dagdoel en reeks ---------- */
function rollDay(){const t=dayKey();if(S.prof.day!==t){const y=dayKey(new Date(Date.now()-864e5));
  if(S.prof.last!==y&&S.prof.last!==t)S.prof.streak=0;S.prof.day=t;S.prof.count=0}}
function countRead(){rollDay();S.prof.count++;const t=dayKey();
  if(S.prof.count===S.prof.goal&&S.prof.last!==t){const y=dayKey(new Date(Date.now()-864e5));S.prof.streak=(S.prof.last===y?S.prof.streak:0)+1;S.prof.last=t;setTimeout(scheduleReminders,0);toast(T("Dagdoel gehaald. ","Daily goal reached. ","Tagesziel erreicht. ")+streakTxt(S.prof.streak))}
  profChanged()}

    <button class="mrow" id="m-prof">${IC.user}<span>${T("Profiel aanpassen","Edit profile","Profil bearbeiten")}</span></button>

    <div class="setrow"><b>${T("Taal","Language","Sprache")}</b>${seg("lang",LANG,[["nl","Nederlands"],["en","English"],["de","Deutsch"]])}</div>
    <div class="setrow"><b>${T("Weergave","Appearance","Darstellung")}</b>${seg("theme",S.prof.theme||"light",[["light",T("Licht","Light","Hell")],["dark",T("Donker","Dark","Dunkel")],["system",T("Als telefoon","Like phone","Wie Handy")]])}</div>
    <div class="setrow"><b>${T("Back-up","Backup","Backup")}</b><small>${T("Je voortgang staat op dit toestel. Met een back-up zet je hem over naar een ander toestel.","Your progress is stored on this device. A backup lets you move it to another device.","Dein Fortschritt ist auf diesem Gerät gespeichert. Mit einem Backup überträgst du ihn auf ein anderes Gerät.")}</small>
      <div class="row"><button class="btn ghost" id="bk-save">${T("Opslaan","Save","Speichern")}</button><button class="btn ghost" id="bk-load">${T("Terugzetten","Restore","Wiederherstellen")}</button><input type="file" id="bk-file" accept="application/json,.json" hidden></div></div>
    <div class="mlegal"><a href="${SITE}/voorwaarden.html" target="_blank" rel="noopener">${T("Voorwaarden","Terms","Bedingungen")}</a><a href="${SITE}/privacy.html" target="_blank" rel="noopener">${T("Privacy","Privacy","Datenschutz")}</a></div>
  </div>`;
  MENU.onclick=e=>{if(e.target===MENU)closeMenu()};
  document.getElementById("m-prof").onclick=()=>{closeMenu();openOnboarding(true)};
  document.getElementById("m-intro").onclick=()=>{closeMenu();openIntro()};
  MENU.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
  MENU.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{S.prof.theme=b.dataset.theme;document.documentElement.dataset.theme=S.prof.theme;profChanged();renderMenu()});
  document.getElementById("bk-save").onclick=()=>{saveBackup();closeMenu()};
  document.getElementById("bk-load").onclick=()=>document.getElementById("bk-file").click();
  document.getElementById("bk-file").onchange=e=>{closeMenu();loadBackup(e)};
}

function renderSaved(){
  const list=[...S.saved].sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
  main.innerHTML=`<h2>${T("Bewaarde ideeën","Saved ideas","Gespeicherte Ideen")}</h2>
  ${list.length?`<div class="saved">${list.map(s=>`<article class="sv" style="--tc:${topicColor(s.topic)}">
    <h3>${esc(s.title)}</h3><p>${esc(s.body)}</p>${s.apply?`<div class="ap"><b>${T("Toepassen:","Apply:","Anwenden:")}</b> ${esc(s.apply)}</div>`:""}
    <footer><span>${esc(s.bookTitle)}</span><span><button data-go="${esc(s.bookId)}|${s.idx}">${T("Open","Open","Öffnen")}</button><button data-del="${esc(s.id)}">${T("Verwijder","Remove","Entfernen")}</button></span></footer></article>`).join("")}</div>`
  :`<div class="empty">${T("Nog niets bewaard. Tik tijdens het lezen op <b>Bewaar</b> om een idee hier te verzamelen.","Nothing saved yet. Tap <b>Save</b> while reading to collect an idea here.","Noch nichts gespeichert. Tippe beim Lesen auf <b>Speichern</b>, um eine Idee hier zu sammeln.")}</div>`}`;
  main.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>delSaved(b.dataset.del).catch(()=>toast(T("Verwijderen lukte niet","Couldn't remove","Entfernen fehlgeschlagen"))));
  main.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const[id,i]=b.dataset.go.split("|");if(findBook(id))openReader(id,+i+1);else toast(T("Dit boek staat niet meer in je bibliotheek","This book is no longer in your library","Dieses Buch ist nicht mehr in deiner Bibliothek"))});
}

const deriveTopics=goals=>[...new Set(goals.flatMap(g=>GOALS.find(x=>x.id===g)?.topics||[]))];
/* Alleen het welkom: voor wie al een profiel heeft (na een update, of via het menu) */

  obDraft={goals:[...(S.prof.goals||[])],topics:[...(S.prof.topics||[])],custom:!!S.prof.topicsCustom,goal:S.prof.goal||5,read:[...(S.prof.read||[])],reminder:{...(S.prof.reminder||{on:true,time:"08:00"})}};
  OB.hidden=false;renderOb()}

        T("Gezonder leven en slimmer met geld","Healthier living, smarter with money","Gesünder leben, klüger mit Geld"),
        T("De wereld, wetenschap en geschiedenis beter begrijpen","A better grasp of the world, science and history","Welt, Wissenschaft und Geschichte besser verstehen")])}
      ${gain("brief",T("Zakelijk","At work","Beruflich"),[

        T("Overtuigender communiceren en onderhandelen","Communicate and negotiate more persuasively","Überzeugender kommunizieren und verhandeln"),
        T("Scherper over strategie, ondernemen en verandering","Sharper on strategy, business and change","Schärfer bei Strategie, Unternehmertum und Wandel"),

      <p>${T("Winnaars en verliezers hebben vaak dezelfde doelen. Het verschil zit in je systeem: de kleine, dagelijkse gewoontes die je resultaat bepalen.","Winners and losers often share the same goals. The difference is your system: the small daily habits that shape your results.","Gewinner und Verlierer haben oft dieselben Ziele. Der Unterschied liegt im System: den kleinen täglichen Gewohnheiten, die dein Ergebnis bestimmen.")}</p>

    <ul class="feat">
      ${feat("spark",T("Meteen bruikbaar","Useful straight away","Sofort nutzbar"),T("Bij elk idee een concrete actie of een vraag om over na te denken.","Every idea comes with a concrete action or a question to think about.","Zu jeder Idee gibt es eine konkrete Aktion oder eine Frage zum Nachdenken."))}
      ${feat("layers",T("Dieper waar jij wilt","Deeper where you want","Tiefer, wo du willst"),T("Bewaar wat je raakt en lees een verdieping bij ideeën waar je meer van wilt weten.","Save what resonates and read a deep dive on ideas you want to know more about.","Speichere, was dich berührt, und lies eine Vertiefung zu Ideen, die dich interessieren."))}

    </ul>`;
  else body=`<h1>${T("Waarom het werkt","Why it works","Warum es funktioniert")}</h1>
    <ul class="feat">
      ${feat("clock",T("Klein en vaak houd je vol","Small and often sticks","Klein und oft hält man durch"),T("Een paar minuten per dag is makkelijker vol te houden dan af en toe een uur. Zo wordt lezen een gewoonte in plaats van een voornemen.","A few minutes a day is easier to keep up than an hour now and then. Reading becomes a habit instead of a resolution.","Ein paar Minuten am Tag hält man leichter durch als ab und zu eine Stunde. So wird Lesen zur Gewohnheit statt zum Vorsatz."))}

  OB.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

    if(last){obIntro=-1;obStep=0;S.prof.introSeen=true;lsSet()}else obIntro++;OB.querySelector(".ob-in").scrollTop=0;renderOb()};
}
function renderOb(){
  if(obIntro>=0)return renderIntro();
  const N=4,d=obDraft;let body="",foot="",ok=true;
  if(!d.custom)d.topics=deriveTopics(d.goals);
  if(obStep===0){
    body=`<h1>${T("Wat wil je bereiken?","What do you want to achieve?","Was möchtest du erreichen?")}</h1>
    <p class="lede">${T("Kies wat je aanspreekt, zoveel als je wilt. Daarop kiezen we de boeken voor je uit.","Pick whatever appeals to you, as many as you like. We'll choose books to match.","Wähle, was dich anspricht, so viel du willst. Danach suchen wir die Bücher für dich aus.")}</p>
    <div class="opts">${GOALS.map(g=>`<button class="opt" data-g="${g.id}" aria-pressed="${d.goals.includes(g.id)}"><b>${esc(g.label)}</b><small>${esc(g.sub)}</small></button>`).join("")}</div>`;
    ok=d.goals.length>0;foot=ok?T(`${d.goals.length} gekozen`,`${d.goals.length} selected`,`${d.goals.length} ausgewählt`):T("Kies er minstens één","Pick at least one","Wähle mindestens eins");
  }else if(obStep===1){
    const times=["07:30","08:00","12:30","18:00","20:00","21:30"];
    body=`<h1>${T("Jouw leesritme","Your reading rhythm","Dein Leserhythmus")}</h1>
    <p class="lede">${T("Hoeveel nieuwe ideeën per dag? Haal je je dagdoel, dan groeit je reeks.","How many new ideas a day? Hit your daily goal and your streak grows.","Wie viele neue Ideen pro Tag? Erreichst du dein Tagesziel, wächst deine Serie.")}</p>
    <div class="opts one">${PACES.map(p=>`<button class="opt row2" data-p="${p.n}" aria-pressed="${d.goal===p.n}"><span><b>${p.label}</b><small style="display:block">${paceSub(p)}</small></span><b>${nIdeas(p.n)}</b></button>`).join("")}</div>
    <h2>${T("Wanneer wil je een herinnering?","When would you like a reminder?","Wann möchtest du erinnert werden?")}</h2>
    <p class="lede">${T("Met het idee van de dag, of een boek dat past bij wat je leest.","With the idea of the day, or a book that fits what you're reading.","Mit der Idee des Tages oder einem Buch, das zu deiner Lektüre passt.")}</p>
    <div class="chips">${times.map(t=>`<button class="chip" data-tm="${t}" aria-pressed="${d.reminder.on&&d.reminder.time===t}">${t}</button>`).join("")}
      <button class="chip" data-tm="off" aria-pressed="${!d.reminder.on}">${T("Geen herinnering","No reminder","Keine Erinnerung")}</button></div>
    ${NATIVE?"":`<p class="note">${T("Herinneringen werken in de app op je telefoon.","Reminders work in the app on your phone.","Erinnerungen funktionieren in der App auf deinem Handy.")}</p>`}`;
    foot=nIdeas(d.goal)+T(" per dag"," a day"," pro Tag")+" · "+(d.reminder.on?T("herinnering om ","reminder at ","Erinnerung um ")+d.reminder.time:T("geen herinnering","no reminder","keine Erinnerung"));
  }else if(obStep===2){
    const w={};d.topics.forEach(t=>w[t]=3);d.goals.forEach(g=>GOALS.find(x=>x.id===g)?.topics.forEach(t=>w[t]=(w[t]||0)+1));
    const rel=ALL.filter(b=>w[b.topic]).sort((a,b)=>(w[b.topic]||0)-(w[a.topic]||0)||(a.catalog?0:1)-(b.catalog?0:1)).slice(0,40);
    body=`<h1>${T("Welke boeken heb je al gelezen?","Which books have you already read?","Welche Bücher hast du schon gelesen?")}</h1>
    <p class="lede">${T("Die slaan we over bij je aanbevelingen. Je kunt ze later altijd nog openen.","We'll skip those in your recommendations. You can still open them any time.","Die überspringen wir bei deinen Empfehlungen. Öffnen kannst du sie trotzdem jederzeit.")}</p>
    <div class="opts one">${rel.map(b=>`<button class="opt row2" data-r="${b.id}" aria-pressed="${d.read.includes(b.id)}"><span><b>${esc(b.titleNl||b.title)}</b><small style="display:block">${esc(b.author)}</small></span><small>${d.read.includes(b.id)?T("Gelezen","Read","Gelesen"):""}</small></button>`).join("")}</div>`;
    foot=d.read.length?T(`${d.read.length} gelezen`,`${d.read.length} read`,`${d.read.length} gelesen`):T("Overslaan mag ook","You can skip this","Überspringen geht auch");
  }else{
    const gl=d.goals.map(g=>GOALS.find(x=>x.id===g)?.label).filter(Boolean);
    const pace=PACES.find(p=>p.n===d.goal);
    const tmp={...S.prof,...d};const keep=S.prof;S.prof=tmp;const first=recommended(3);S.prof=keep;
    body=`<h1>${obEdit?T("Je profiel","Your profile","Dein Profil"):T("Je profiel staat klaar","Your profile is ready","Dein Profil ist fertig")}</h1>
    <p class="lede">${T("Hierop stemmen we Voor jou af. Wat je leest, telt daarna ook mee.","This shapes For you. What you read counts too.","Darauf stimmen wir Für dich ab. Was du liest, zählt danach mit.")}</p>
    <dl class="prof"><div><dt>${T("Doelen","Goals","Ziele")}</dt><dd>${esc(gl.join(", "))}</dd></div>
      <div><dt>${T("Dagdoel","Daily goal","Tagesziel")}</dt><dd>${pace?esc(pace.label)+", ":""}${nIdeas(d.goal)}${T(" per dag"," a day"," pro Tag")}</dd></div>
      <div><dt>${T("Herinnering","Reminder","Erinnerung")}</dt><dd>${d.reminder.on?T("Elke dag om ","Every day at ","Jeden Tag um ")+d.reminder.time:T("Uit","Off","Aus")}</dd></div>
      ${first.length?`<div><dt>${T("Om mee te beginnen","To start with","Zum Einstieg")}</dt><dd>${first.map(b=>esc(b.titleNl||b.title)).join(" · ")}</dd></div>`:""}</dl>
    <h2>${T("Je onderwerpen","Your topics","Deine Themen")}</h2>
    <p class="lede">${T("Afgeleid van je doelen. Tik om er een toe te voegen of weg te halen.","Based on your goals. Tap to add or remove one.","Abgeleitet von deinen Zielen. Tippe, um eins hinzuzufügen oder zu entfernen.")}</p>
    <div class="chips">${TOPICS.map(t=>`<button class="chip" data-t="${t}" aria-pressed="${d.topics.includes(t)}">${esc(tn(t))}</button>`).join("")}</div>`;
    ok=d.topics.length>0;foot=ok?"&nbsp;":T("Kies minstens één onderwerp","Pick at least one topic","Wähle mindestens ein Thema");
  }
  const last=obStep===N-1;
  const backBtn=obStep>0||!obEdit&&!S.prof.onboarded?`<button id="obback">${T("← Terug","← Back","← Zurück")}</button>`:obEdit?`<button id="obclose">${T("Sluiten","Close","Schließen")}</button>`:"";
  OB.innerHTML=`<div class="ob-in"><div class="ob-top">${backBtn}
    <div class="steps">${Array.from({length:N},(_,i)=>`<i class="${i<=obStep?"on":""}"></i>`).join("")}</div></div>${body}</div>
    <div class="ob-foot"><button class="btn wide" id="obnext" ${ok?"":"disabled"}>${last?(obEdit?T("Profiel opslaan","Save profile","Profil speichern"):T("Begin met lezen","Start reading","Los geht's")):T("Volgende","Next","Weiter")}</button><small>${foot}</small></div>`;
  OB.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const g=b.dataset.g;d.goals=d.goals.includes(g)?d.goals.filter(x=>x!==g):[...d.goals,g];renderOb()});
  OB.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const t=b.dataset.t;d.custom=true;d.topics=d.topics.includes(t)?d.topics.filter(x=>x!==t):[...d.topics,t];renderOb()});
  OB.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{d.goal=+b.dataset.p;renderOb()});
  OB.querySelectorAll("[data-tm]").forEach(b=>b.onclick=()=>{const t=b.dataset.tm;d.reminder=t==="off"?{...d.reminder,on:false}:{on:true,time:t};renderOb()});
  OB.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const r=b.dataset.r;d.read=d.read.includes(r)?d.read.filter(x=>x!==r):[...d.read,r];renderOb()});
  const back=document.getElementById("obback");if(back)back.onclick=()=>{if(obStep>0)obStep--;else obIntro=2;renderOb()};
  const cl=document.getElementById("obclose");if(cl)cl.onclick=()=>{OB.hidden=true};
  document.getElementById("obnext").onclick=()=>{if(!last){obStep++;OB.querySelector(".ob-in").scrollTop=0;renderOb();return}
    const first=!obEdit;
    Object.assign(S.prof,{goals:d.goals,topics:d.topics,topicsCustom:d.custom,goal:d.goal,read:d.read,reminder:d.reminder,onboarded:true,introSeen:true});aiRecs=null;
    profChanged(true);OB.hidden=true;tab="home";render();main.scrollTop=0;scheduleReminders();
    if(first&&GATED&&!isPremium())openPaywall("onboarding");else toast(obEdit?T("Profiel opgeslagen","Profile saved","Profil gespeichert"):T("Veel leesplezier","Happy reading","Viel Spaß beim Lesen"))};

function getCode(){try{return (localStorage.getItem("ideely-code")||localStorage.getItem("ideeenstash-code"))||""}catch{return ""}}
function setCode(c){try{localStorage.setItem("ideely-code",c)}catch{}}
let codeAsk=null;
function askCode(wrong){
  if(codeAsk)return codeAsk;
  codeAsk=new Promise(res=>{
    const d=document.getElementById("codebox");
    d.innerHTML=`<div class="cb-in"><h2>Toegangscode</h2><p class="lede">${wrong?"Deze code klopt niet. Probeer het opnieuw.":"Voor de AI-functies is je toegangscode nodig. Je vult hem één keer in op dit toestel."}</p>

    d.hidden=false;const inp=document.getElementById("cb-code");inp.value=getCode();setTimeout(()=>inp.focus(),50);
    const done=v=>{d.hidden=true;d.innerHTML="";codeAsk=null;res(v)};
    document.getElementById("cb-ok").onclick=()=>{const v=inp.value.trim();if(!v)return;setCode(v);done(v)};
    document.getElementById("cb-no").onclick=()=>done(null);

}
function aiErr(code,message,text){const e={code,message};if(text)e.text=text;return e}
async function aiCall(input,opts={},retried){
  if(opts.signal?.aborted)throw aiErr("cancelled","");
  const code=getCode();
  let res;
  try{res=await fetch(API+"/api/ai",{method:"POST",headers:{"content-type":"application/json","x-app-code":code},body:JSON.stringify({prompt:input,tier:opts.modelTier||"default",maxTokens:opts.maxTokens||2500}),signal:opts.signal})}
  catch(e){throw aiErr(opts.signal?.aborted?"cancelled":"offline","")}
  if(res.status===401){if(retried)throw aiErr("no_code","");const c=await askCode(true);if(!c)throw aiErr("no_code","");return aiCall(input,opts,true)}
  if(!res.ok){let j={};try{j=await res.json()}catch{}throw aiErr(j.error||("http_"+res.status),j.message||"")}
  const reader=res.body.getReader(),dec=new TextDecoder();let text="",tail="";
  try{
    for(;;){const {done,value}=await reader.read();if(done)break;
      text+=dec.decode(value,{stream:true});
      const m=text.indexOf("\u0000");if(m>=0){tail=text.slice(m+1);text=text.slice(0,m)}
      if(text&&opts.onText)try{opts.onText({text,delta:""})}catch{}}
    text+=dec.decode();
  }catch(e){throw aiErr(opts.signal?.aborted?"cancelled":"upstream_error","",text)}
  if(tail.startsWith("ERR:"))throw aiErr("upstream_error",tail.slice(4),text);
  if(!text.trim())throw aiErr("empty_completion","");

}

async function runGen(prompt,label,extra){
  const sample=await getSample();if(!sample){setStatus(errMsg({code:"upstream_error"}),true);return}
  const id=(extra.kind==="tekst"?"t-":"b-")+Date.now().toString(36);
  gen={book:{id,live:true,kind:extra.kind,source:extra.source||"",title:extra.guess||T("Bezig…","Working…","Einen Moment…"),author:"",topic:extra.topicHint||"Mindset",summary:"",ideas:[],createdAt:Date.now()},ctl:new AbortController(),done:false,meta:false};

  const handle=line=>{line=line.trim().replace(/^```(json)?|```$/g,"").trim();if(!line)return;let o;try{o=JSON.parse(line)}catch{return}
    if(!g.meta&&"known" in o){g.meta=true;if(!o.known){g.reject=o.reason||NOSUM;return}
      Object.assign(g.book,{title:String(o.title||g.book.title),titleNl:o.titleNl&&o.titleNl!=="null"?String(o.titleNl):null,author:o.author&&o.author!=="null"?String(o.author):"",year:o.year||null,topic:TOPICS.includes(o.topic)?o.topic:g.book.topic,summary:String(o.summary||"")});
      if(!R.hidden&&rBook===g.book)liveMeta();return}
    if(g.meta&&!g.reject&&o.title&&o.body){g.book.ideas.push({title:String(o.title),body:String(o.body),apply:o.apply?String(o.apply):""});
      if(g.book.ideas.length===1){setStatus(T("Eerste ideeën staan klaar.","First ideas are ready.","Die ersten Ideen sind fertig."));if(tab==="ontdek"||extra.auto)openReader(g.book.id)}
      else if(!R.hidden&&rBook===g.book)liveAdd(g.book.ideas.length-1);}};
  try{
    await sample(prompt,{modelTier:"default",maxTokens:4000,signal:g.ctl.signal,onText:({text})=>{const parts=text.split("\n");pending=parts.pop();parts.slice(gen_seen).forEach(handle);gen_seen=parts.length}});
    handle(pending);
  }catch(e){handle(pending);if(e?.code!=="cancelled"||!g.book.ideas.length){g.done=true;if(gen===g)gen=null;setStatus(errMsg(e),e?.code!=="cancelled");closeIfLive(g);return}}
  g.done=true;g.book.live=false;
  if(g.reject){if(gen===g)gen=null;setStatus(T("Geen samenvatting gemaakt: ","No summary made: ","Keine Zusammenfassung erstellt: ")+g.reject,true);closeIfLive(g);toast(T("Geen samenvatting gemaakt","No summary made","Keine Zusammenfassung erstellt"));return}
  if(g.book.ideas.length<2){if(gen===g)gen=null;setStatus(T("Het antwoord bevatte te weinig ideeën. Probeer het opnieuw.","The answer had too few ideas. Please try again.","Die Antwort enthielt zu wenige Ideen. Bitte versuch es erneut."),true);closeIfLive(g);return}

  catch(e){setStatus(e?.code==="quota_exceeded"?T("Je opslag is vol. Verwijder eerst een paar eigen samenvattingen.","Your storage is full. Remove a few of your own summaries first.","Dein Speicher ist voll. Entferne zuerst ein paar eigene Zusammenfassungen."):T("Opslaan lukte niet. Probeer het opnieuw.","Saving failed. Please try again.","Speichern fehlgeschlagen. Bitte versuch es erneut."),true)}
  if(gen===g)gen=null;render();
}

const cutToSentence=t=>{const m=[...String(t).matchAll(/[.!?…]["”’)]?(?=\s|$)/g)].pop();return m?t.slice(0,m.index+m[0].length).trim():String(t).trim()};

Titel: ${it.title}
Tekst: ${it.body}

Schrijf in ${LANG_IN} een verdieping van 200 tot 300 woorden (nooit meer dan 300), in 3 of 4 korte alinea's:

async function toggleDeep(b,i,btn){

  if(!box.hidden){box.hidden=true;btn.setAttribute("aria-expanded","false");lab.textContent=L_SHOWDEEP;return}
  box.hidden=false;btn.setAttribute("aria-expanded","true");lab.textContent=T("Verberg verdieping","Hide deep dive","Vertiefung ausblenden");

  if(b.live){box.innerHTML=`<div class="dk">${L_DEEP}</div><p>${L_WAIT}.</p>`;return}

      :await SAMPLE_FN(deepPrompt(b,b.ideas[i]),{modelTier:"default",maxTokens:4000,onText:({text})=>{if(!box.isConnected)return;renderDeep(box,text)}});
    if(r.json)throw aiErr("upstream_error","");

  finally{deepBusy=null}
}
/* Gedeelde samenvatting ophalen of één keer laten schrijven */
async function streamGet(url,onText){
  let res;try{res=await fetch(url)}catch{throw aiErr("offline","")}
  const ct=res.headers.get("content-type")||"";
  if(ct.includes("application/json")){let j={};try{j=await res.json()}catch{}if(!res.ok)throw aiErr(j.error||("http_"+res.status),j.message||"");return {json:j}}
  if(!res.ok)throw aiErr("http_"+res.status,"");
  const reader=res.body.getReader(),dec=new TextDecoder();let text="",tail="";
  try{for(;;){const {done,value}=await reader.read();if(done)break;text+=dec.decode(value,{stream:true});
    const m=text.indexOf("\u0000");if(m>=0){tail=text.slice(m+1);text=text.slice(0,m)}onText&&onText(text)}}
  catch{throw aiErr("upstream_error","",text)}
  if(tail.startsWith("ERR:"))throw aiErr("upstream_error",tail.slice(4),text);
  return {text,truncated:tail.startsWith("TRUNC")};
}
/* Aanbevolen boeken alvast op de achtergrond klaarzetten */
const PREF={};let prefRunning=0;const prefQueue=[];
function prefetch(books){
  for(const b of books){if(!b.lazy||b.ideas.length||b.unknown||PREF[b.id]||prefQueue.includes(b))continue;prefQueue.push(b)}
  pumpPrefetch();
}
function pumpPrefetch(){
  while(prefRunning<2&&prefQueue.length){const b=prefQueue.shift();if(b.ideas.length||PREF[b.id])continue;prefRunning++;
    PREF[b.id]=fetch(API+"/api/book?warm=1&id="+encodeURIComponent(b.id)+LQ).then(r=>r.ok?r.json():null).then(j=>{
      if(j&&j.data&&!b.ideas.length&&!b.live){S.shared={...S.shared,[SK(b.id)]:j.data};lsSet();applyShared(b,j.data)}
    }).catch(()=>{}).finally(()=>{prefRunning--;delete PREF[b.id];pumpPrefetch()});}
}
let prefTimer=null;
function schedulePrefetch(books){clearTimeout(prefTimer);prefTimer=setTimeout(()=>prefetch(books.filter(b=>b.lazy&&!b.ideas.length&&!b.unknown).slice(0,4)),1500)}
async function loadShared(b){
  if(PREF[b.id]){b.live=true;openReader(b.id,0);await PREF[b.id];b.live=false;
    if(b.ideas.length){if(!R.hidden&&rBook===b)openReader(b.id,0);return}
    if(b.unknown){if(!R.hidden&&rBook===b)closeReader();toast(NOSUM);return}
    if(!R.hidden&&rBook===b)closeReader()}
  if(gen&&!gen.done){toast(T("Er wordt al een samenvatting gemaakt. Even geduld.","A summary is already being made. One moment.","Es wird bereits eine Zusammenfassung erstellt. Einen Moment."));return}
  b.live=true;b.ideas=[];b.summary="";
  const g=gen={book:b,done:false};
  openReader(b.id,0);
  let seen=0,meta=false;
  const handle=line=>{line=line.trim();if(!line)return;let o;try{o=JSON.parse(line)}catch{return}
    if(!meta&&"known" in o){meta=true;if(o.known===false){g.reject=o.reason||"";return}
      b.titleNl=o.titleNl&&o.titleNl!=="null"?String(o.titleNl):null;b.summary=String(o.summary||"");if(!R.hidden&&rBook===b)liveMeta();return}
    if(meta&&!g.reject&&o.title&&o.body){b.ideas.push({title:String(o.title),body:String(o.body),apply:o.apply?String(o.apply):""});if(!R.hidden&&rBook===b)liveAdd(b.ideas.length-1)}};
  const fail=msg=>{b.live=false;b.ideas=[];g.done=true;if(gen===g)gen=null;if(!R.hidden&&rBook===b)closeReader();toast(msg)};
  try{
    const r=await streamGet(API+"/api/book?id="+encodeURIComponent(b.id)+LQ,text=>{const parts=text.split("\n");parts.pop();parts.slice(seen).forEach(handle);seen=parts.length});
    if(r.json){b.live=false;g.done=true;if(gen===g)gen=null;const d=r.json.data;S.shared={...S.shared,[SK(b.id)]:d};lsSet();applyShared(b,d);
      if(b.unknown){if(!R.hidden&&rBook===b)closeReader();toast(NOSUM);return}
      if(!R.hidden&&rBook===b)openReader(b.id,Math.min(prog(b),b.ideas.length));return}
    const parts=r.text.split("\n");parts.slice(seen).forEach(handle);
  }catch(e){return fail(errMsg(e))}
  if(g.reject!==undefined){b.unknown=true;S.shared={...S.shared,[SK(b.id)]:{known:false}};lsSet();return fail(NOSUM)}
  if(b.ideas.length<5)return fail(T("Het maken van deze samenvatting lukte niet. Probeer het later opnieuw.","Creating this summary didn't work. Please try again later.","Diese Zusammenfassung konnte nicht erstellt werden. Bitte versuch es später erneut."));
  b.live=false;g.done=true;if(gen===g)gen=null;
  S.shared={...S.shared,[SK(b.id)]:{known:true,titleNl:b.titleNl||null,summary:b.summary,ideas:b.ideas}};lsSet();
  if(!R.hidden&&rBook===b)liveDone();render();
}

  const check='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
  const gj=goals.join(T(" en "," and "," und "));
  PW.innerHTML=`<div class="ob-in"><div class="ob-top"><span class="prem-tag">Premium</span><span style="flex:1"></span><button id="pwclose">${T("Nu niet","Not now","Nicht jetzt")}</button></div>
    ${PWR[reason]?`<p class="lede" style="margin-bottom:4px">${PWR[reason]}</p>`:""}
    <h1>${goals.length?esc(T(`Werk elke dag aan ${gj}`,`Work on ${gj} every day`,`Jeden Tag ein Schritt: ${gj}`)):T("Haal alles uit Ideely","Get the most out of Ideely","Hol alles aus Ideely heraus")}</h1>
    <ul class="pw-ben">
      <li>${check}<span>${T(`<b>Onbeperkt lezen</b> uit ${ALL.length} boeken, in 18 onderwerpen`,`<b>Unlimited reading</b> from ${ALL.length} books across 18 topics`,`<b>Unbegrenzt lesen</b> aus ${ALL.length} Büchern in 18 Themen`)}</span></li>
      <li>${check}<span>${T("<b>Verdieping bij elk idee</b>: de redenering, voorbeelden en kanttekeningen","<b>A deep dive on every idea</b>: the reasoning, examples and caveats","<b>Vertiefung zu jeder Idee</b>: Begründung, Beispiele und Einwände")}</span></li>
      <li>${check}<span>${T("<b>Elk boek of artikel toevoegen</b> en er direct een samenvatting van maken","<b>Add any book or article</b> and get a summary straight away","<b>Jedes Buch oder jeden Artikel hinzufügen</b> und sofort zusammenfassen lassen")}</span></li>
      <li>${check}<span>${T("Dagdoel, reeks, herinnering en widget blijven ook gratis","Daily goal, streak, reminder and widget stay free","Tagesziel, Serie, Erinnerung und Widget bleiben kostenlos")}</span></li>
    </ul>
    <div class="plans">
      <button class="plan" data-plan="ANNUAL" aria-pressed="${pwPick==="ANNUAL"}"><span><b>${T("Jaar","Year","Jahr")}</b>${trial?`<span class="badge">${T("7 dagen gratis","7 days free","7 Tage gratis")}</span>`:`<span class="badge">${T("Beste keus","Best value","Beste Wahl")}</span>`}</span><span class="pr">${yr?esc(yr.product.priceString):"–"}</span><small>${perMonth?T(`Omgerekend ${perMonth} per maand`,`Works out at ${perMonth} a month`,`Umgerechnet ${perMonth} pro Monat`):T("Per jaar","Per year","Pro Jahr")}</small></button>
      <button class="plan" data-plan="MONTHLY" aria-pressed="${pwPick==="MONTHLY"}"><span><b>${T("Maand","Month","Monat")}</b></span><span class="pr">${mo?esc(mo.product.priceString):"–"}</span><small>${T("Maandelijks opzegbaar","Cancel any month","Monatlich kündbar")}</small></button>
    </div></div>
    <div class="ob-foot">
      <button class="btn wide" id="pwbuy" ${avail&&sel&&!pwBusy?"":"disabled"}>${pwBusy?T("Bezig…","Working…","Einen Moment…"):!avail?T("Abonnementen zijn nog niet beschikbaar","Subscriptions aren't available yet","Abos sind noch nicht verfügbar"):pwPick==="ANNUAL"&&trial?T("Probeer 7 dagen gratis","Try 7 days free","7 Tage gratis testen"):T("Abonneer voor ","Subscribe for ","Abonnieren für ")+esc(sel?.product?.priceString||"")}</button>
      <small>${pwPick==="ANNUAL"&&trial?T("Daarna ","Then ","Danach ")+esc(yr?.product?.priceString||"")+T(" per jaar. "," a year. "," pro Jahr. "):""}${T(`Opzeggen kan altijd via je ${store}-account.`,`Cancel any time in your ${store} account.`,`Kündigen jederzeit über dein ${store}-Konto.`)}</small>
      <div class="pw-legal"><button id="pwrestore">${T("Aankoop herstellen","Restore purchase","Kauf wiederherstellen")}</button><a href="${SITE}/voorwaarden.html" target="_blank" rel="noopener">${T("Voorwaarden","Terms","Bedingungen")}</a><a href="${SITE}/privacy.html" target="_blank" rel="noopener">${T("Privacy","Privacy","Datenschutz")}</a></div>
    </div>`;
  document.getElementById("pwclose").onclick=closePaywall;
  PW.querySelectorAll("[data-plan]").forEach(b=>b.onclick=()=>{pwPick=b.dataset.plan;renderPaywall(reason)});
  document.getElementById("pwbuy").onclick=()=>buy(reason);
  document.getElementById("pwrestore").onclick=restore;
}
function closePaywall(){PW.hidden=true;PW.innerHTML="";pwAfter=null}
async function buy(reason){
  const P=PLUG("Purchases"),p=pkg(pwPick);if(!P||!p)return;
  pwBusy=true;renderPaywall(reason);
  try{const r=await P.purchasePackage({aPackage:p});const ok=!!r?.customerInfo?.entitlements?.active?.[RC_ENTITLEMENT];setPremium(ok);
    pwBusy=false;if(ok){const b=pwAfter;closePaywall();toast(T("Welkom bij Premium","Welcome to Premium","Willkommen bei Premium"));if(b)openReader(b.id)}else renderPaywall(reason)}
  catch(e){pwBusy=false;renderPaywall(reason);if(!e?.userCancelled&&e?.code!=="1")toast(T("De aankoop is niet gelukt. Probeer het opnieuw.","The purchase didn't go through. Please try again.","Der Kauf hat nicht geklappt. Bitte versuch es erneut."))}
}
async function restore(){
  const P=PLUG("Purchases");if(!P)return;
  try{const r=await P.restorePurchases();const ok=!!r?.customerInfo?.entitlements?.active?.[RC_ENTITLEMENT];setPremium(ok);
    toast(ok?T("Je Premium-abonnement is hersteld","Your Premium subscription has been restored","Dein Premium-Abo wurde wiederhergestellt"):T("Geen actief abonnement gevonden","No active subscription found","Kein aktives Abo gefunden"));if(ok)closePaywall()}catch{toast(T("Herstellen lukte niet","Couldn't restore","Wiederherstellen fehlgeschlagen"))}
}

/* Idee van de dag: voor widget en herinnering */
function ideaOfDay(){
  const t=dayKey();let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;
  const busy=[...ALL,...S.books].find(b=>{const p=prog(b);return b.ideas.length&&p>0&&p<b.ideas.length});
  if(busy){const it=busy.ideas[prog(busy)];return {title:it.title,body:it.body,book:busy.titleNl||busy.title,id:busy.id,i:prog(busy),topic:busy.topic}}
  const recs=recommended(8).filter(b=>b.ideas.length);const pool=recs.length?recs:ALL.filter(b=>b.ideas.length);
  if(!pool.length)return {title:T("Je ideeën van vandaag staan klaar","Today's ideas are ready","Deine Ideen für heute sind bereit"),body:T("Open Ideely en lees een paar kernideeën.","Open Ideely and read a few key ideas.","Öffne Ideely und lies ein paar Kernideen."),book:"Ideely",id:null};
  const b=pool[h%pool.length],it=b.ideas[0];return {title:it.title,body:it.body,book:b.titleNl||b.title,id:b.id,i:0,topic:b.topic};
}
async function updateWidget(){
  if(!NATIVE)return;const Pref=PLUG("Preferences");if(!Pref)return;
  const i=ideaOfDay();rollDay();
  const data={title:i.title,body:i.body.length>220?i.body.slice(0,217).replace(/\s+\S*$/,"")+"…":i.body,book:i.book,day:dayKey(),
    goal:`${Math.min(S.prof.count,S.prof.goal)}/${S.prof.goal}`+T(" vandaag"," today"," heute"),streak:S.prof.streak||0};
  try{await Pref.set({key:"widget",value:JSON.stringify(data)});await PLUG("WidgetBridge")?.update()}catch{}
}
const REMINDER_TEXTS=T(["Je dagelijkse ideeën staan klaar","Vijf minuten voor een nieuw inzicht?","Houd je reeks vast","Tijd voor een paar kernideeën","Vandaag al iets nieuws geleerd?"],
  ["Your daily ideas are ready","Five minutes for a new insight?","Keep your streak going","Time for a few key ideas","Learned something new today?"],
  ["Deine täglichen Ideen sind bereit","Fünf Minuten für eine neue Erkenntnis?","Halte deine Serie","Zeit für ein paar Kernideen","Heute schon etwas Neues gelernt?"]);
/* Herinneringen voor 14 dagen vooruit. Elke derde dag het idee van de dag, de dag erna een boek dat past bij wat je leest. */
function bookTip(k){
  const bc=becauseRead(6);
  if(bc){const b=bc.books[k%bc.books.length],f=bc.from.titleNl||bc.from.title;
    return {title:T(`Omdat je ${f} las`,`Because you read ${f}`,`Weil du ${f} gelesen hast`),body:T(`Probeer ${b.titleNl||b.title} van ${b.author}: de kernideeën in vijf minuten.`,`Try ${b.titleNl||b.title} by ${b.author}: the key ideas in five minutes.`,`Probier ${b.titleNl||b.title} von ${b.author}: die Kernideen in fünf Minuten.`),id:b.id}}
  const r=recommended(6);if(!r.length)return null;const b=r[k%r.length];
  return {title:T("Een boek voor jou","A book for you","Ein Buch für dich"),body:`${b.titleNl||b.title} · ${b.author}`+(whyFor(b)?` · ${whyFor(b)}`:""),id:b.id}}
async function scheduleReminders(){
  if(!NATIVE)return;const L=PLUG("LocalNotifications");if(!L)return;
  try{
    const pend=await L.getPending();const ids=(pend?.notifications||[]).map(n=>({id:n.id})).filter(n=>n.id>=100&&n.id<200);
    if(ids.length)await L.cancel({notifications:ids});
    const r=S.prof.reminder;if(!r||!r.on)return;
    const perm=await L.checkPermissions();if(perm.display!=="granted"){const q=await L.requestPermissions();if(q.display!=="granted")return}
    const [hh,mm]=r.time.split(":").map(Number);rollDay();const i=ideaOfDay();
    const list=[];for(let k=0;k<14;k++){const at=new Date();at.setDate(at.getDate()+k);at.setHours(hh,mm,0,0);
      if(at<=new Date())continue;if(k===0&&S.prof.count>=S.prof.goal)continue;
      let n;
      if(k%3===0)n={title:i.title,body:T("Idee van de dag uit ","Idea of the day from ","Idee des Tages aus ")+i.book,id:i.id};
      else if(k%3===1)n=bookTip(k);
      if(!n)n={title:REMINDER_TEXTS[k%REMINDER_TEXTS.length],body:S.prof.streak?streakTxt(S.prof.streak)+".":T("Open de app voor je ideeën van vandaag.","Open the app for today's ideas.","Öffne die App für deine Ideen von heute."),id:null};
      list.push({id:100+k,title:n.title,body:n.body,extra:n.id?{open:n.id}:{},schedule:{at,allowWhileIdle:true}})}
    if(list.length)await L.schedule({notifications:list});
  }catch(e){}
}
function initNative(){
  if(!NATIVE)return;
  rcInit();scheduleReminders();updateWidget();
  const A=PLUG("App");
  A?.addListener("backButton",()=>{
    if(!MENU.hidden){closeMenu();return}
    if(!PW.hidden){closePaywall();return}
    if(!R.hidden){closeReader();return}
    if(!OB.hidden&&S.prof.onboarded){OB.hidden=true;return}
    if(!OB.hidden&&obIntro>0){obIntro--;renderOb();return}
    if(tab!=="home"){tab="home";render();return}
    A.exitApp?.();
  });
  A?.addListener("appStateChange",st=>{if(st.isActive){render();updateWidget()}else{updateWidget();scheduleReminders()}});
  /* Tik op een melding: open het boek waar de melding over gaat */
  PLUG("LocalNotifications")?.addListener?.("localNotificationActionPerformed",e=>{tab="home";render();
    const id=e?.notification?.extra?.open;if(id&&findBook(id)&&S.prof.onboarded)setTimeout(()=>{if(R.hidden)openReader(id)},350)});
}

let toastT;function toast(m){const el=document.getElementById("toast");el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}

render();initStore();initNative();
if(!NATIVE&&"serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script>
