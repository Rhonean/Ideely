ie. Wat kun je in plaats daarvan doen?"],["Ken elkaars wereld","Succesvolle stellen weten veel over elkaars leven: zorgen, dromen, vrienden, stress. Gottman noemt dat een gedetailleerde liefdeskaart. Wie die kaart bijhoudt, kan beter omgaan met veranderingen en tegenslagen.","Vraag je partner deze week naar iets wat hem of haar bezighoudt, en luister echt."],["Bewondering en genegenheid","Stellen die elkaar waarderen en dat laten merken, hebben een buffer tegen moeilijke momenten. Gottman adviseert om bewust te letten op wat je waardeert aan je partner, en dat uit te spreken.","Zeg vandaag één ding dat je bewondert of waardeert aan je partner."],["Toenaderen in plaats van afwenden","In het dagelijks leven doen partners kleine pogingen tot contact, bijvoorbeeld een opmerking over iets op straat. Gottman noemt dat bids. Stellen die op die pogingen ingaan in plaats van ze te negeren, bouwen een voorraad goodwill op.","Merk de kleine pogingen tot contact van je partner op, en ga erop in."],["Oplosbare en eeuwige problemen","Gottman ontdekte dat de meeste conflicten in relaties nooit opgelost worden; ze komen voort uit verschillen in persoonlijkheid of waarden. Succesvolle stellen leren daarmee te leven en erover in gesprek te blijven. Voor oplosbare problemen adviseert hij een zachte start en compromissen.","Kies een terugkerend conflict en bespreek het met nieuwsgierigheid in plaats van met de wil om te winnen."],["Laat je beïnvloeden","Relaties zijn stabieler als beide partners zich laten beïnvloeden door de ander. Gottman vond dat vooral relaties onder druk stonden als een partner weigerde macht te delen. Samen beslissen en openstaan voor elkaars standpunten is een kern van een goede relatie.","Laat je bij je volgende meningsverschil echt beïnvloeden door het standpunt van je partner."]]},{"id":"c-hold-me-tight","title":"Hold Me Tight","titleNl":"Houd me vast","author":"Sue Johnson","year":2008,"topic":"Relaties","summary":"Sue Johnson, grondlegger van emotionally focused therapy, beschrijft liefde als een hechtingsband. Ze geeft zeven gesprekken waarmee stellen weer verbinding kunnen maken.","ideas":[["Liefde is hechting","Johnson baseert haar werk op de hechtingstheorie. Volwassenen hebben net als kinderen behoefte aan een veilige band met iemand die er voor ze is. Een relatieconflict gaat volgens haar vaak over de vraag: ben je er voor me als ik je nodig heb?","Vraag je af: waar gaan onze ruzies eigenlijk over? Is het de vraag of de ander er voor je is?"],["Duivelse dialogen","Johnson beschrijft negatieve patronen waarin stellen vast komen te zitten. Bijvoorbeeld de protestpolka: de een eist en bekritiseert, de ander trekt zich terug. Hoe meer de een eist, hoe meer de ander wegloopt. Het patroon is de vijand, niet de partner.","Herken je een patroon waarin een van jullie eist en de ander zich terugtrekt? Bespreek het samen."],["Ruwe plekken","Iedereen heeft gevoelige plekken, vaak ontstaan door eerdere ervaringen. Als een partner daaraan raakt, reageer je sterk. Johnson helpt stellen om die ruwe plekken te herkennen en te benoemen, zodat de ander begrijpt wat er onder de reactie zit.","Schrijf op welke opmerkingen van je partner je het meest raken. Wat zit daaronder?"],["Terug naar een moeilijk moment","Een van de gesprekken is het samen terugkijken op een recente ruzie, vanuit rust. Wat gebeurde er, wat voelde ieder, en hoe raakte dat de band? Zo leer je het patroon herkennen en kun je er een volgende keer eerder uitstappen.","Bespreek een recente ruzie op een rustig moment: wat gebeurde er, en wat voelden jullie elk?"],["Houd me vast","Het kerngesprek gaat over de diepere behoeften achter de conflicten. Partners spreken hun angsten en behoeften uit en reageren met openheid en zorg. Johnson noemt dit een moment waarop de band echt wordt hersteld; het creëert nieuwe veiligheid.","Deel één diepere angst of behoefte met je partner, en vraag wat hij of zij nodig heeft."],["Vergeven van kwetsuren","Soms is er een diepe kwetsuur in de relatie, zoals verraad of een moment waarop je partner er niet was. Johnson beschrijft hoe je die kunt helen: de gekwetste partner vertelt wat het betekende, de ander toont echt begrip en neemt verantwoordelijkheid.","Is er een oude kwetsuur? Vertel wat het voor je betekende, of luister echt als de ander dat doet."],["Liefde levend houden","Johnson adviseert om bewust rituelen te creëren die de band versterken, zoals vaste momenten van contact bij vertrek en thuiskomst. Een veilige band is niet iets wat je eenmalig opbouwt; je moet hem onderhouden.","Maak een vast ritueel voor afscheid nemen en thuiskomen, zodat er dagelijks contact is."]]},{"id":"c-mating-in-captivity","title":"Mating in Captivity","titleNl":"Erotische intelligentie","author":"Esther Perel","year":2006,"topic":"Relaties","summary":"Relatietherapeut Esther Perel onderzoekt waarom verlangen in lange relaties vaak afneemt. Ze stelt dat veiligheid en verlangen verschillende dingen vragen, en dat je bewust ruimte moet maken voor beide.","ideas":[["Veiligheid en avontuur","Mensen willen in een relatie zekerheid en geborgenheid, maar ook nieuwigheid en avontuur. Perel stelt dat die twee behoeften met elkaar in spanning staan. Wat een relatie stabiel maakt, kan het verlangen doen afnemen. Die spanning moet je erkennen.","Wat geeft jou zekerheid in je relatie, en waar mis je avontuur?"],["Verlangen heeft afstand nodig","Intimiteit gaat over dichtbij komen. Verlangen gaat juist over afstand: de ander zien als een apart, mysterieus persoon. Volgens Perel verdwijnt het verlangen als partners volledig in elkaar opgaan en alles van elkaar weten.","Plan iets waarbij jullie elkaar weer als aparte personen zien, zoals elk een eigen hobby."],["Zie je partner opnieuw","Perel merkt op dat mensen hun partner vaak het meest aantrekkelijk vinden als ze hem of haar in zijn element zien: op een feest, op het werk, iets doen waar hij goed in is. Juist dan zie je de ander weer als zelfstandig persoon.","Ga mee naar iets waar je partner in zijn element is, en kijk met andere ogen."],["Te veel gelijkheid","Moderne relaties streven terecht naar gelijkwaardigheid en eerlijkheid. Perel stelt dat erotiek soms een ander domein is, met eigen regels, waar spel en verbeelding een rol spelen. Wat in het dagelijks leven werkt, werkt niet per se in de slaapkamer.","Bespreek samen of jullie dagelijkse rolverdeling ruimte laat voor spel en verlangen."],["Ouderschap en verlangen","Na de komst van kinderen verschuift veel aandacht naar het gezin. Partners worden vooral ouders en teamgenoten. Perel adviseert om ook ruimte te houden voor de relatie als partners, met tijd en aandacht die niet over de kinderen gaat.","Plan tijd samen die niet over de kinderen of het huishouden gaat."],["Verbeelding","Verlangen speelt zich voor een groot deel af in de verbeelding. Perel moedigt aan om bewust tijd te maken voor spel, nieuwsgierigheid en nieuwe ervaringen samen. Spontaniteit in lange relaties vraagt paradoxaal genoeg vaak planning.","Probeer samen iets nieuws, iets wat jullie nog nooit samen deden."],["Verantwoordelijkheid voor je eigen verlangen","Wacht niet tot je partner het verlangen aanwakkert. Perel stelt dat iedereen verantwoordelijk is voor zijn eigen erotische leven: wat geeft jou energie, waar voel je je levend? Wie zich zelf levendig voelt, brengt dat mee in de relatie.","Vraag je af: wat maakt mij levendig, los van mijn relatie? Investeer daar meer in."]]},{"id":"c-art-of-loving","title":"The Art of Loving","titleNl":"De kunst van het liefhebben","author":"Erich Fromm","year":1956,"topic":"Relaties","summary":"Psychoanalyticus en filosoof Erich Fromm stelt dat liefde geen gevoel is waarin je valt, maar een kunst die je moet leren. Het vraagt kennis, inzet en oefening.","ideas":[["Liefde is een kunst","De meeste mensen denken dat liefde vooral gaat om de juiste persoon vinden. Fromm stelt dat het probleem eerder zit in ons vermogen om lief te hebben. Liefde is een kunst, zoals muziek of schilderen, die theorie en oefening vraagt.","Zie liefde deze week als een vaardigheid: wat kun je oefenen?"],["Afgescheidenheid","Fromm ziet het besef dat we afgescheiden zijn als de diepste menselijke bron van angst. Mensen proberen die afgescheidenheid op te heffen via werk, conformisme of roes. Alleen liefde biedt volgens hem een echte oplossing, omdat je verbonden raakt zonder jezelf te verliezen.","Merk op hoe je soms afgescheidenheid probeert op te heffen met werk, schermen of conformisme."],["Geven, niet ontvangen","Liefde is volgens Fromm een activiteit, vooral geven. Niet geven als opoffering, maar als uiting van je levenskracht. Wie geeft van zichzelf, zijn vreugde, interesse en begrip, ervaart zichzelf als rijk.","Geef vandaag iets van jezelf: je tijd, je aandacht of je interesse, zonder iets terug te verwachten."],["Vier elementen","Liefde bevat vier elementen: zorg, verantwoordelijkheid, respect en kennis. Zorg betekent actief betrokken zijn bij het leven van de ander. Respect betekent de ander zien zoals hij is, en hem laten groeien op zijn eigen manier, niet zoals jij dat wilt.","Kies één element, zoals zorg of respect, en oefen het bewust in je relaties."],["Vormen van liefde","Fromm beschrijft verschillende vormen: broederlijke liefde voor alle mensen, moederlijke liefde, erotische liefde, eigenliefde en liefde voor God. Eigenliefde is geen egoïsme; wie zichzelf niet kan liefhebben, kan ook anderen moeilijk liefhebben.","Wees deze week mild voor jezelf. Wat zou je zeggen tegen een vriend in jouw situatie?"],["Liefde in een consumptiecultuur","Fromm bekritiseert een maatschappij waarin relaties worden gezien als een ruil op een markt. Mensen zoeken de beste partner die ze kunnen krijgen voor hun eigen marktwaarde. Volgens hem ondermijnt dat echte liefde.","Merk op wanneer je een relatie ziet als ruil. Wat verandert er als je dat loslaat?"],["Oefenen","Liefhebben vraagt discipline, concentratie, geduld en de bereidheid om er veel belang aan te hechten. Fromm adviseert om alleen te kunnen zijn, aandachtig te leven en echt te luisteren. Zo ontwikkel je het vermogen om lief te hebben.","Oefen een kwartier per dag om alleen en aandachtig te zijn, zonder afleiding."]]},{"id":"c-seneca","title":"Letters from a Stoic","titleNl":"Brieven aan Lucilius","author":"Seneca","year":65,"topic":"Filosofie","summary":"De Romeinse filosoof Seneca schreef op latere leeftijd brieven aan zijn vriend Lucilius over hoe je goed leeft. Ze gaan over tijd, vriendschap, angst, rijkdom en de dood.","ideas":[["Je tijd is je bezit","Seneca opent met een oproep om zuinig te zijn op je tijd. We verspillen haar aan onbelangrijke dingen, alsof ze onbeperkt is. Hij adviseert om elke dag bewust te leven en je tijd te zien als het enige wat echt van jou is.","Houd een dag bij waar je tijd naartoe gaat. Welk uur had je liever anders gebruikt?"],["Lees diep, niet breed","Seneca waarschuwt tegen het van boek naar boek springen. Wie overal een beetje van leest, krijgt nergens echt houvast. Lees liever een paar goede schrijvers grondig en neem elke dag één gedachte mee om over na te denken.","Kies één boek dat je echt goed wilt lezen en neem elke dag één gedachte mee."],["Oefen armoede","Seneca adviseert om af en toe een paar dagen bewust sober te leven, met eenvoudig eten en ruwe kleding. Zo ontdek je dat wat je vreest, minder erg is dan gedacht. Wie weet dat hij met weinig kan leven, is vrijer.","Leef deze week één dag bewust sober: eenvoudig eten, geen aankopen."],["Angst is vaak erger dan het gebeuren","We lijden vaker in onze verbeelding dan in werkelijkheid. Seneca stelt dat veel van wat we vrezen nooit gebeurt. Bekijk dus wat er echt aan de hand is, in plaats van je mee te laten slepen door mogelijke rampen.","Schrijf bij een angst op hoe waarschijnlijk het is, en wat je zou doen als het gebeurt."],["Echte vriendschap","Kies je vrienden zorgvuldig en vertrouw ze daarna volledig. Seneca stelt dat je een vriend moet maken om iemand te hebben voor wie je kunt sterven, niet om er voordeel van te hebben. Omring je met mensen die je beter maken.","Kijk naar je vriendschappen: wie maakt je beter, en aan wie wil je meer tijd geven?"],["De menigte vermijden","Drukte en publiek vermaak kunnen je karakter aantasten, omdat je ongemerkt slechte gewoonten en meningen overneemt. Seneca adviseert om je terug te trekken in jezelf en om te gaan met mensen die je kunnen helpen groeien, en die jij kunt helpen.","Kies bewust waar je je tijd en aandacht aan geeft, ook online."],["Leven en sterven","Seneca schrijft vaak over de dood, niet om somber te zijn, maar om goed te leven. Wie de dood niet vreest, is vrij. Een leven is lang genoeg als je het goed gebruikt; het gaat niet om de lengte, maar om de kwaliteit.","Vraag je af: als dit mijn laatste jaar was, wat zou ik dan anders doen?"]]},{"id":"c-epictetus","title":"Enchiridion","titleNl":"Handboekje","author":"Epictetus","year":125,"topic":"Filosofie","summary":"Een kort handboek met de kernlessen van de stoïcijnse filosoof Epictetus, opgetekend door zijn leerling Arrianus. Centraal staat het onderscheid tussen wat wel en niet in je macht ligt.","ideas":[["Wat in je macht ligt","Het handboekje begint met het belangrijkste onderscheid: sommige dingen liggen in onze macht, andere niet. In onze macht liggen onze oordelen, wensen en handelingen. Niet in onze macht liggen ons lichaam, bezit, reputatie en wat anderen doen. Rust begint bij dit onderscheid.","Maak twee kolommen van een zorg: wat ligt in mijn macht, en wat niet?"],["Oordelen veroorzaken onrust","Niet de dingen zelf verontrusten mensen, maar hun oordelen erover. De dood is niet verschrikkelijk; het oordeel dat de dood verschrikkelijk is, maakt het verschrikkelijk. Wie zich ergert, kan daarom het best bij zijn eigen oordeel beginnen.","Bij een ergernis: vraag je af welk oordeel je hebt, en of het ook anders kan."],["Verwacht niet wat niet kan","Wil niet dat de dingen gaan zoals jij wilt, maar wil ze zoals ze gaan. Dan gaat het je goed. Epictetus vergelijkt het met een bad nemen: er wordt gespat, geduwd en gescholden. Wie dat verwacht, raakt er niet door uit evenwicht.","Verwacht bij een drukke dag dat dingen misgaan. Kijk of je dan rustiger reageert."],["Alles is te leen","Zeg nooit over iets dat je het verloren hebt, maar dat je het hebt teruggegeven. Een kind, een partner of bezit is je gegeven voor een tijd. Epictetus vraagt je ermee om te gaan zoals een reiziger met een herberg: dankbaar gebruiken, zonder het als eigendom te zien.","Kijk naar iets wat je dierbaar is en bedenk dat het je gegeven is voor een tijd."],["Speel je rol goed","Epictetus vergelijkt het leven met een toneelstuk. Je kiest niet zelf welke rol je krijgt, maar wel hoe goed je die speelt. Of je nu een kleine of grote rol hebt, je taak is om hem met waardigheid te vervullen.","Kijk naar je rol van dit moment: hoe kun je die zo goed mogelijk spelen?"],["Bescheidenheid in vooruitgang","Wie vooruitgang boekt, hoeft niet te pochen of zichzelf te prijzen. Epictetus adviseert om stil te leren en je filosofie te tonen in daden in plaats van woorden. Geef eerder het goede voorbeeld dan dat je anderen de les leest.","Laat zien wat je hebt geleerd door je gedrag, in plaats van erover te praten."],["Begin bij kleine dingen","Train jezelf door te beginnen met kleine ongemakken. Als er wat olie gemorst wordt of wijn gestolen, zeg dan: dit is de prijs van gemoedsrust. Zo oefen je met kleine verliezen, zodat je grotere beter kunt dragen.","Oefen bij kleine ergernissen met de gedachte: dit is de prijs van gemoedsrust."]]},{"id":"c-tao-te-ching","title":"Tao Te Ching","titleNl":"Tao Te Tjing","author":"Laozi","year":null,"topic":"Filosofie","summary":"Een klassieke Chinese tekst die wordt toegeschreven aan Laozi, met 81 korte hoofdstukken over de Tao, de weg. Het boek gaat over eenvoud, bescheidenheid en handelen zonder te forceren.","ideas":[["De Tao is niet te benoemen","De tekst opent met het idee dat de Tao die je kunt benoemen, niet de eeuwige Tao is. De Tao is de onderliggende orde van alles, die je niet volledig in woorden kunt vangen. Je kunt haar alleen benaderen door ervaring en aandacht.","Neem een paar minuten stilte zonder iets te willen begrijpen of oplossen."],["Wu wei: niet-forceren","Een kernbegrip is wu wei, vaak vertaald als niet-doen of moeiteloos handelen. Het betekent niet passief zijn, maar handelen in harmonie met de natuurlijke loop der dingen, zonder te forceren. Wie te hard duwt, krijgt weerstand.","Merk op waar je iets probeert te forceren. Wat gebeurt er als je meegaat met de situatie?"],["De kracht van water","Laozi gebruikt water vaak als voorbeeld. Water is zacht en meegaand, maar kan de hardste steen uitslijpen. Het stroomt naar de laagste plaats, die mensen vermijden. Zachtheid en bescheidenheid overwinnen uiteindelijk hardheid en kracht.","Reageer bij een conflict eens zachter dan je gewend bent, en kijk wat er gebeurt."],["Tegenstellingen horen bij elkaar","Lang en kort, hoog en laag, moeilijk en makkelijk bestaan alleen in relatie tot elkaar. Wie het een wil, krijgt het ander erbij. Die gedachte, vergelijkbaar met yin en yang, nodigt uit om niet krampachtig naar één kant te streven.","Kijk naar iets waar je hard naar streeft. Welke tegenkant krijg je daarbij?"],["Leiden door je terug te trekken","De beste leider is volgens de tekst iemand van wie het volk nauwelijks weet dat hij er is. Als het werk gedaan is, zeggen mensen: we hebben het zelf gedaan. Laozi pleit voor een bescheiden bestuur met weinig regels en weinig ingrijpen.","Als leider: welk probleem kun je je team zelf laten oplossen?"],["Genoeg hebben","Wie weet dat hij genoeg heeft, is rijk. Hebzucht en het verlangen naar meer brengen onrust. De tekst roept op tot eenvoud en tevredenheid, en waarschuwt dat wie te veel vasthoudt, uiteindelijk veel verliest.","Schrijf op wat je hebt dat genoeg is."],["Leegte is nuttig","Een kom is bruikbaar door de lege ruimte erin, een huis door de open ruimte voor deuren en ramen. Laozi wijst erop dat wat er niet is, net zo belangrijk is als wat er wel is. Ruimte en stilte geven betekenis.","Laat bewust ruimte in je agenda of huis leeg, en merk het effect op."]]},{"id":"c-sapiens","title":"Sapiens: A Brief History of Humankind","titleNl":"Sapiens: een kleine geschiedenis van de mensheid","author":"Yuval Noah Harari","year":2011,"topic":"Filosofie","summary":"Historicus Yuval Noah Harari vertelt de geschiedenis van de mensheid in vogelvlucht, aan de hand van drie revoluties. Hij stelt dat gedeelde verhalen de sleutel zijn tot onze dominantie. Sommige stellingen zijn onder historici omstreden.","ideas":[["Een dier zonder belang","Zo'n zeventigduizend jaar geleden was Homo sapiens volgens Harari een onopvallend dier, een van meerdere mensensoorten. Toch werden wij de dominante soort op aarde. Harari zoekt naar wat ons onderscheidde van andere mensachtigen en dieren.","Bedenk een gedeeld verhaal waar jij in gelooft, zoals geld of een bedrijf. Hoe zou het zonder dat geloof werken?"],["De cognitieve revolutie","Harari stelt dat een verandering in ons denken het mogelijk maakte om te praten over dingen die niet bestaan: goden, naties, geld. Die gedeelde verhalen, die hij fictie noemt, maken samenwerking tussen grote aantallen vreemden mogelijk. Daarin onderscheiden we ons.","Kijk naar je eigen werk: welk deel bestaat alleen omdat mensen er samen in geloven?"],["De landbouwrevolutie als valkuil","Landbouw zorgde voor meer voedsel en grotere bevolkingen, maar volgens Harari niet voor gelukkiger mensen. Boeren werkten harder, aten eenzijdiger en kregen meer ziekten dan jager-verzamelaars. Hij noemt de landbouwrevolutie daarom provocerend het grootste bedrog uit de geschiedenis.","Vraag je af of een vooruitgang in je leven je echt gelukkiger heeft gemaakt."],["Ingebeelde ordes","Grote samenlevingen draaien op ingebeelde ordes: gedeelde overtuigingen over wetten, rechten en hiërarchieën. Ze bestaan alleen omdat mensen erin geloven. Dat maakt ze niet minder echt in hun gevolgen, maar wel veranderbaar.","Welke regel of gewoonte in je omgeving lijkt vanzelfsprekend, maar is eigenlijk een afspraak?"],["Geld, rijken en religies","Volgens Harari brachten drie krachten de mensheid samen: geld, imperiums en universele religies. Geld is het meest universele systeem van wederzijds vertrouwen ooit. Imperiums verspreidden culturen, en religies gaven gedeelde waarden aan grote groepen.","Denk na over hoe geld vertrouwen tussen vreemden mogelijk maakt, ook in jouw dagelijks leven."],["De wetenschappelijke revolutie","Een grote verandering was het besef dat we veel niet weten. Die erkenning van onwetendheid zette onderzoek en ontdekkingen in gang. Gecombineerd met kapitalisme en imperialisme gaf dat Europa grote macht in de afgelopen eeuwen.","Erken waar je onwetend bent, en kies één onderwerp om meer over te leren."],["Zijn we gelukkiger?","Harari vraagt zich af of al die vooruitgang ons gelukkiger heeft gemaakt. Hij concludeert dat geluk sterk afhangt van verwachtingen en biochemie, en dat het onduidelijk is of we gelukkiger zijn dan onze voorouders. Hij eindigt met de vraag wat we willen worden, nu technologie ons kan veranderen.","Vraag je af wat jij echt wilt, los van wat je omgeving van je verwacht."]]},{"id":"c-ikigai","title":"Ikigai","titleNl":"Ikigai","author":"Héctor García & Francesc Miralles","year":2016,"topic":"Filosofie","summary":"Twee Spaanse auteurs bezochten Ogimi op Okinawa, een dorp met veel honderdjarigen. Ze beschrijven het Japanse begrip ikigai, een reden om te leven, en de gewoonten van de ouderen daar.","ideas":[["Een reden om op te staan","Ikigai betekent ruwweg je reden van bestaan: datgene waarvoor je 's ochtends opstaat. Volgens de auteurs heeft iedereen een ikigai, maar moeten veel mensen hem nog ontdekken. Wie hem gevonden heeft, leeft met meer richting en voldoening.","Schrijf op wat je graag doet, waar je goed in bent, wat de wereld nodig heeft en waar je voor betaald kunt worden."],["Niet met pensioen gaan","In Okinawa bestaat geen woord voor met pensioen gaan in de zin van stoppen met alles. Ouderen blijven actief in hun tuin, gemeenschap of ambacht. Bezig blijven met iets dat ertoe doet, houdt volgens de auteurs lichaam en geest jong.","Denk na over wat je wilt blijven doen als je stopt met werken."],["Eet tot je bijna vol bent","De auteurs beschrijven het principe hara hachi bu: stoppen met eten als je voor tachtig procent vol bent. De ouderen eten gevarieerd, met veel groenten, tofu en vis, en kleine porties. Dat zou bijdragen aan hun gezondheid op hoge leeftijd.","Stop met eten als je voor tachtig procent vol bent."],["Flow in het dagelijks leven","De auteurs verbinden ikigai met het begrip flow: zo opgaan in een activiteit dat je de tijd vergeet. Ambachtslieden en kunstenaars die zich toeleggen op één ding, vinden daar voldoening in. Kies activiteiten die je volledig opnemen.","Kies een activiteit die je volledig opneemt en plan er wekelijks tijd voor."],["Gemeenschap en vriendschap","In Ogimi steunen mensen elkaar in groepen, moai genoemd. Ze vieren samen, helpen bij problemen en delen hun leven. Sociale verbondenheid geeft volgens de auteurs veerkracht en levensvreugde.","Plan een vast moment met een groep vrienden, zoals een maandelijks etentje."],["Rustig bewegen","De ouderen sporten niet intensief, maar bewegen de hele dag door: in de tuin, lopend, met oefeningen zoals radio taiso. De auteurs geven ook voorbeelden van zachte bewegingsvormen uit Oost-Azië, zoals tai chi en qigong.","Probeer een rustige bewegingsvorm zoals tai chi, yoga of een dagelijkse wandeling."],["Veerkracht en eenvoud","De auteurs koppelen ikigai aan veerkracht: kalm blijven bij tegenslag en focussen op wat je kunt beïnvloeden. Ze noemen ook het Japanse wabi-sabi, schoonheid zien in imperfectie en vergankelijkheid. Leef eenvoudig, glimlach en wees dankbaar.","Zie de schoonheid in iets wat niet perfect is, en wees dankbaar voor iets kleins."]]},{"id":"c-art-of-happiness","title":"The Art of Happiness","titleNl":"De kunst van het geluk","author":"Dalai Lama & Howard C. Cutler","year":1998,"topic":"Filosofie","summary":"Psychiater Howard Cutler sprak uitgebreid met de Dalai Lama over geluk. Het boek combineert boeddhistische inzichten met westerse psychologie en stelt dat geluk te trainen is.","ideas":[["Het doel van het leven","De Dalai Lama stelt dat het doel van het leven is om gelukkig te zijn. Hij bedoelt geen kortstondig plezier, maar een duurzame innerlijke tevredenheid. Die kun je volgens hem bereiken door je geest te trainen.","Schrijf op wat duurzaam geluk voor jou betekent, los van kortstondig plezier."],["Geluk komt van binnen","Uiterlijke omstandigheden zoals geld of status bepalen ons geluk minder dan we denken. Na een tijd went de mens aan veranderingen. Onze houding en manier van kijken bepalen veel meer hoe gelukkig we ons voelen.","Denk aan iets wat je dacht nodig te hebben om gelukkig te zijn. Maakte het je blijvend gelukkiger?"],["Train je geest","De Dalai Lama beschrijft het trainen van de geest als een systematisch proces: negatieve gedachten en emoties herkennen en ze vervangen door positieve. Net als een vaardigheid vraagt dit oefening, discipline en geduld.","Merk een negatieve gedachte op en vervang hem bewust door een vriendelijkere."],["Mededogen","Mededogen staat centraal. Wie anderen warmte en begrip toont, voelt zich zelf ook beter. De Dalai Lama stelt dat het verbinden met anderen eenzaamheid en angst vermindert. Mededogen begint bij inzien dat iedereen geluk wil en lijden wil vermijden.","Doe vandaag iets vriendelijks voor iemand die het moeilijk heeft."],["Omgaan met lijden","Lijden hoort bij het leven. Wie dat accepteert, lijdt minder onder tegenslag. De Dalai Lama stelt dat je moeilijke ervaringen kunt gebruiken om te groeien, bijvoorbeeld in geduld en begrip voor anderen.","Kijk naar een tegenslag: wat heeft die je geleerd over geduld of begrip?"],["Woede en haat","Woede ontstaat vaak uit angst en frustratie, en maakt ons ongelukkig. De Dalai Lama adviseert om de oorzaken van woede te begrijpen en geduld en verdraagzaamheid te oefenen. Een vijand kan dan zelfs een leraar zijn, omdat hij je kansen geeft om geduld te oefenen.","Bij woede: wat is de angst of frustratie eronder?"],["Vanuit perspectief kijken","Een veranderend perspectief helpt bij tegenslag: zien dat elke situatie meerdere kanten heeft. Cutler beschrijft hoe de Dalai Lama zelf, ondanks verlies van zijn land, opgewekt bleef door te kijken naar wat er ook aan goeds in zijn situatie zat.","Zoek in een moeilijke situatie bewust naar een andere kant."]]},{"id":"c-nvc","title":"Nonviolent Communication","titleNl":"Geweldloze communicatie","author":"Marshall B. Rosenberg","year":1999,"topic":"Communicatie","summary":"Psycholoog Marshall Rosenberg ontwikkelde een manier van communiceren die gericht is op verbinding in plaats van oordelen. Het model bestaat uit vier stappen: waarnemen, voelen, behoeften en verzoeken.","ideas":[["Taal die vervreemdt","Rosenberg stelt dat veel van onze alledaagse taal geweld bevat: oordelen, vergelijken, eisen en verantwoordelijkheid ontkennen. Zulke taal maakt mensen defensief. Hij ontwikkelde een manier van spreken die verbinding mogelijk maakt.","Let een dag op oordelen in je taal: 'altijd', 'nooit', 'je bent...'. Probeer ze te vervangen."],["1. Waarneming zonder oordeel","De eerste stap is beschrijven wat je ziet of hoort, zonder te oordelen. Niet 'je bent altijd te laat', maar 'je kwam vandaag twintig minuten na de afgesproken tijd'. Rosenberg noemt het onderscheid tussen waarnemen en evalueren een van de moeilijkste vaardigheden.","Beschrijf iets wat je stoort in neutrale feiten, zoals een camera het zou zien."],["2. Gevoelens benoemen","Benoem daarna wat je voelt, zoals teleurgesteld, ongerust of blij. Pas op voor woorden die eigenlijk interpretaties zijn, zoals 'ik voel me genegeerd'. Daarin zit een oordeel over de ander. Echte gevoelswoorden gaan over jezelf.","Benoem bij je volgende ergernis wat je voelt, zonder iets over de ander te zeggen."],["3. Behoeften achter gevoelens","Gevoelens komen voort uit behoeften die wel of niet vervuld zijn: behoefte aan respect, veiligheid, rust of erkenning. Rosenberg stelt dat niet de ander je gevoelens veroorzaakt, maar jouw behoeften. Dat haalt de schuld uit het gesprek.","Vraag je bij een sterk gevoel af: welke behoefte van mij wordt hier niet vervuld?"],["4. Een helder verzoek","Doe een concreet, positief en uitvoerbaar verzoek. Niet 'ik wil dat je me meer respecteert', maar 'zou je me willen laten weten als je later komt?'. Een verzoek is pas echt een verzoek als de ander nee mag zeggen; anders is het een eis.","Doe een concreet verzoek: wie, wat, wanneer. Accepteer een nee als antwoord."],["Empathisch luisteren","De vier stappen gebruik je ook om te luisteren. Zoek achter wat de ander zegt naar zijn gevoelens en behoeften, ook als hij boos of beschuldigend klinkt. Rosenberg noemt dat de woorden van de ander horen als uitdrukking van behoeften, niet als aanval.","Luister bij een verwijt naar het gevoel en de behoefte erachter, en benoem die."],["Ook voor jezelf","Je kunt dezelfde aanpak op jezelf toepassen. In plaats van jezelf te veroordelen voor een fout, kijk je welke behoefte je wilde vervullen en welke niet vervuld is. Zo leer je van fouten zonder schuldgevoel en schaamte.","Vraag je bij een eigen fout af welke behoefte je wilde vervullen, in plaats van jezelf te veroordelen."]]},{"id":"c-getting-to-yes","title":"Getting to Yes","titleNl":"Excellent onderhandelen","author":"Roger Fisher & William Ury","year":1981,"topic":"Communicatie","summary":"Fisher en Ury van het Harvard Negotiation Project beschrijven principieel onderhandelen: een methode om tot goede afspraken te komen zonder het tot een machtsstrijd te laten komen.","ideas":[["Onderhandel niet over posities","Bij een traditionele onderhandeling nemen partijen een positie in en schuiven ze langzaam naar elkaar toe. Dat kost tijd, levert vaak slechte afspraken op en schaadt de relatie. De auteurs stellen een andere methode voor: principieel onderhandelen.","Denk aan je volgende onderhandeling. Wat is jouw positie, en wat is het belang erachter?"],["Scheid de mens van het probleem","Mensen zijn geen computers; emoties, percepties en communicatie spelen mee. Wees zacht voor de mensen en hard voor het probleem. Probeer de situatie te zien vanuit de ander, benoem emoties en zorg dat de relatie niet lijdt onder het meningsverschil.","Benoem in een lastig gesprek de emoties, en houd de inhoud apart van de persoon."],["Richt je op belangen","Achter een positie zit een belang. De auteurs geven een voorbeeld van twee mensen in een bibliotheek die ruzie maken over een raam: de een wil frisse lucht, de ander geen tocht. De bibliothecaris opent een raam in een andere kamer. Kijk dus naar het waarom.","Vraag de ander in je volgende onderhandeling: waarom is dat belangrijk voor je?"],["Bedenk opties voor wederzijds voordeel","Wacht met beslissen en bedenk eerst veel mogelijke oplossingen. Vaak zijn er opties die voor beide partijen beter zijn dan het eerste idee. Brainstorm samen, zonder direct te oordelen, en zoek naar gedeelde belangen.","Bedenk vooraf minstens drie oplossingen die voor beide partijen voordeel opleveren."],["Gebruik objectieve criteria","Als belangen botsen, zoek dan naar eerlijke maatstaven: marktwaarde, precedenten, deskundig oordeel of wetgeving. Zo hoeft niemand toe te geven aan de wil van de ander, maar buigen beide partijen voor een redelijk principe.","Zoek een objectieve maatstaf, zoals een marktprijs of precedent, om een discussie te beslechten."],["Ken je BATNA","Weet wat je doet als de onderhandeling mislukt: je beste alternatief voor een onderhandelde overeenkomst, afgekort BATNA. Hoe beter je alternatief, hoe sterker je staat. Accepteer geen afspraak die slechter is dan je BATNA.","Bepaal voor je volgende onderhandeling je BATNA: wat doe je als het niet lukt?"],["Als de ander niet meewerkt","Als de ander hard speelt of trucs gebruikt, reageer dan niet met dezelfde munt. Benoem de tactiek en stel voor om over de spelregels te praten. De auteurs noemen dit onderhandelingsjiujitsu: aanvallen niet terugslaan, maar ombuigen naar het probleem.","Als de ander hard speelt: benoem het rustig en stel voor om samen naar het probleem te kijken."]]},{"id":"c-difficult-conversations","title":"Difficult Conversations","titleNl":"Moeilijke gesprekken","author":"Douglas Stone, Bruce Patton & Sheila Heen","year":1999,"topic":"Communicatie","summary":"Drie onderzoekers van het Harvard Negotiation Project laten zien dat elk moeilijk gesprek eigenlijk drie gesprekken tegelijk is. Wie dat begrijpt, kan lastige onderwerpen beter bespreken.","ideas":[["Drie gesprekken in één","Elk moeilijk gesprek bestaat volgens de auteurs uit drie lagen. Het wat-is-er-gebeurd-gesprek, over feiten en schuld. Het gevoelsgesprek, over emoties. En het identiteitsgesprek, over wat het zegt over wie je bent. Wie alleen de eerste laag ziet, mist veel.","Denk aan een lastig gesprek. Wat speelt er op feitelijk niveau, wat voel je, en wat raakt het aan je identiteit?"],["Stop met discussiëren over gelijk","We denken vaak dat we gelijk hebben en de ander niet. Maar iedereen kijkt vanuit eigen informatie en interpretaties. De auteurs adviseren om nieuwsgierig te worden naar het verhaal van de ander in plaats van te bewijzen dat jouw verhaal klopt.","Vraag in een conflict nieuwsgierig: hoe zie jij dit, en waar komt dat vandaan?"],["Bedoeling en impact scheiden","We beoordelen anderen op de impact van hun gedrag, en onszelf op onze bedoelingen. Dat leidt tot misverstanden. Zeg wat het effect op jou was, zonder aan te nemen dat de ander het zo bedoeld had.","Zeg wat het effect op jou was, zonder te stellen dat de ander het zo bedoelde."],["Bijdrage in plaats van schuld","Schuld zoeken kijkt terug en maakt mensen defensief. De auteurs stellen voor om te kijken naar ieders bijdrage aan de situatie, ook die van jezelf. Dat is gericht op begrijpen en verbeteren, niet op straffen.","Schrijf op wat jouw aandeel was in een recent conflict, ook als het klein is."],["Gevoelens doen ertoe","Gevoelens zijn vaak de kern van het probleem. Wie ze buiten het gesprek houdt, lost het probleem niet op. Benoem je gevoelens zonder ze als oordeel te presenteren, en erken die van de ander.","Benoem in je volgende moeilijke gesprek ook je gevoel, niet alleen de feiten."],["Je identiteit staat op het spel","Moeilijke gesprekken raken aan hoe we onszelf zien: ben ik een goed persoon, competent, liefdevol? Als dat beeld wankelt, raken we uit balans. Het helpt om te accepteren dat je fouten maakt en dat dat niet betekent dat je slecht bent.","Merk op wanneer een gesprek je zelfbeeld raakt. Wat zou je zeggen als je wist dat je niet perfect hoeft te zijn?"],["Begin vanuit het derde verhaal","Open een gesprek niet vanuit je eigen versie, maar vanuit het verhaal dat een neutrale waarnemer zou vertellen. Nodig de ander uit om samen te kijken wat er speelt. Luister daarna echt, deel je eigen perspectief en zoek samen naar een oplossing.","Begin een lastig gesprek met een neutrale beschrijving die beide partijen kunnen onderschrijven."]]},{"id":"c-made-to-stick","title":"Made to Stick","titleNl":"Made to Stick","author":"Chip Heath & Dan Heath","year":2007,"topic":"Communicatie","summary":"De broers Heath onderzochten waarom sommige ideeën blijven hangen en andere direct vergeten worden. Ze vonden zes kenmerken die ze samenvatten als SUCCES.","ideas":[["De vloek van kennis","Als je iets weet, kun je je moeilijk voorstellen hoe het is om het niet te weten. Daardoor praten experts abstract en vaag. De auteurs beschrijven een experiment waarin mensen een liedje op tafel tikten en dachten dat luisteraars het zouden raden; dat lukte bijna nooit.","Leg je idee uit aan iemand die er niets van weet. Waar haakt hij af?"],["Eenvoudig","Zoek de kern van je boodschap en schrap de rest. Eenvoudig betekent niet simpel, maar essentieel. De auteurs noemen het voorbeeld van een legerprincipe: commander's intent, de bedoeling achter een opdracht, zodat mensen zelf kunnen handelen als plannen mislukken.","Vat je boodschap samen in één zin. Wat is de kern?"],["Onverwacht","Om aandacht te krijgen, moet je verwachtingen doorbreken. Om aandacht vast te houden, moet je nieuwsgierigheid wekken door een kennisgat te openen. Stel een vraag of mysterie dat mensen beantwoord willen zien.","Begin je volgende presentatie met een vraag of feit dat verrast."],["Concreet","Abstracte ideeën vergeten we snel; concrete beelden blijven hangen. Gebruik voorbeelden die je kunt zien, horen of voelen. De auteurs noemen fabels zoals de vos en de druiven: een concreet verhaal maakt een abstract idee onvergetelijk.","Vervang een abstracte uitleg door een concreet voorbeeld dat mensen kunnen voorstellen."],["Geloofwaardig","Mensen moeten je idee geloven. Dat kan met autoriteit, maar ook met levendige details of statistieken die je naar menselijke maat vertaalt. Een sterk middel is de test die mensen zelf kunnen doen: probeer het en zie zelf.","Geef bewijs dat mensen zelf kunnen controleren of ervaren."],["Emotioneel","Mensen geven om mensen, niet om cijfers. Een verhaal over één persoon die hulp nodig heeft, zet meer in beweging dan statistieken over miljoenen. Laat zien waarom je idee belangrijk is voor de ander.","Vertel over één persoon voor wie jouw idee verschil maakt, in plaats van alleen cijfers."],["Verhalen","Verhalen werken als mentale oefening: ze laten mensen zien hoe ze in een situatie kunnen handelen. Ze inspireren ook. Volgens de auteurs is het vinden van goede verhalen vaak belangrijker dan het bedenken ervan; ze liggen al om je heen.","Zoek een echt verhaal uit je werk dat je boodschap laat zien."]]},{"id":"c-talk-like-ted","title":"Talk Like TED","titleNl":"Talk Like TED","author":"Carmine Gallo","year":2014,"topic":"Communicatie","summary":"Communicatiecoach Carmine Gallo analyseerde honderden TED-talks. Hij beschrijft negen geheimen van sprekers die publiek weten te raken.","ideas":[["Laat je passie zien","De beste sprekers praten over iets waar ze echt van houden. Passie is besmettelijk en maakt je overtuigender. Gallo adviseert om je af te vragen wat je hart sneller doet kloppen, en daarover te spreken, niet alleen over wat je weet.","Kies voor je volgende presentatie een onderwerp of invalshoek waar je echt enthousiast over bent."],["Vertel verhalen","Verhalen raken mensen meer dan feiten. Gallo noemt drie soorten: persoonlijke verhalen, verhalen over anderen en verhalen over succes en falen van merken of organisaties. Een goed verhaal verbindt de spreker met het publiek.","Begin je volgende presentatie met een persoonlijk verhaal."],["Spreek als in een gesprek","Goede sprekers klinken natuurlijk, alsof ze met een vriend praten. Dat vraagt juist veel oefening. Gallo raadt aan om je talk zo vaak te oefenen dat je hem beheerst, zodat je je kunt richten op het contact met je publiek.","Oefen je presentatie hardop tot je hem bijna los kunt vertellen."],["Leer ze iets nieuws","Het brein houdt van nieuwe informatie. Breng iets wat je publiek nog niet wist, of kijk op een nieuwe manier naar iets bekends. Gallo noemt het voorbeeld van sprekers die met een verrassend gegeven openen.","Breng één feit of inzicht dat je publiek nog niet kent."],["Wow-momenten","Een sterk moment blijft hangen: een schokkende statistiek, een opvallende demonstratie of een emotioneel moment. Gallo beschrijft hoe Bill Gates muggen losliet in de zaal tijdens een talk over malaria. Zulke momenten worden onthouden en gedeeld.","Bedenk één moment in je presentatie dat mensen zullen onthouden."],["Houd het kort","TED-talks duren maximaal achttien minuten. Volgens Gallo is dat lang genoeg om iets belangrijks te zeggen en kort genoeg om de aandacht vast te houden. Te veel informatie overbelast het publiek. Gebruik de regel van drie: drie kernboodschappen.","Beperk je volgende presentatie tot drie kernboodschappen."],["Spreek alle zintuigen aan","Gebruik beelden, verhalen en soms objecten om je boodschap te ondersteunen. Dia's met weinig tekst en sterke beelden werken beter dan volle opsommingen. Wees ook jezelf: authenticiteit en kwetsbaarheid maken een spreker geloofwaardig.","Vervang een dia vol tekst door één sterk beeld."]]},{"id":"c-thanks-feedback","title":"Thanks for the Feedback","titleNl":"Bedankt voor de feedback","author":"Douglas Stone & Sheila Heen","year":2014,"topic":"Communicatie","summary":"Stone en Heen draaien het perspectief om: niet het geven, maar het ontvangen van feedback is de echte vaardigheid. Ze beschrijven waarom feedback ons raakt en hoe je er meer van leert.","ideas":[["De ontvanger heeft de macht","Organisaties trainen mensen in het geven van feedback, maar uiteindelijk bepaalt de ontvanger wat ermee gebeurt. De auteurs stellen dat leren ontvangen meer oplevert. Wie goed kan ontvangen, leert van elke feedback, ook als die slecht gebracht wordt.","Zie de volgende feedback als iets waar jij de waarde uit kunt halen, ook als hij slecht gebracht is."],["Drie soorten feedback","Feedback is waardering, coaching of beoordeling. Waardering laat je voelen dat je gezien wordt, coaching helpt je verbeteren en beoordeling vertelt waar je staat. Problemen ontstaan als de een coaching wil en de ander een beoordeling geeft.","Vraag bij feedback: is dit waardering, coaching of een beoordeling?"],["Drie triggers","Feedback roept vaak weerstand op. De auteurs noemen drie triggers: waarheidstriggers, als je vindt dat de feedback niet klopt; relatietriggers, als het om wie de feedback geeft gaat; en identiteitstriggers, als de feedback je zelfbeeld raakt.","Merk op welke trigger een feedback bij je oproept: waarheid, relatie of identiteit."],["Begrijp eerst","Voordat je oordeelt over feedback, probeer eerst te begrijpen wat de ander bedoelt. Feedback is vaak vaag, zoals 'wees meer proactief'. Vraag door: waar komt het vandaan en waar gaat het naartoe? Wat zag de ander, en wat stelt hij voor?","Vraag door bij vage feedback: wat zag je precies, en wat stel je voor?"],["Je blinde vlekken","Anderen zien dingen van ons die wij niet zien, zoals onze toon, gezichtsuitdrukking of effect op anderen. Daarom voelt feedback soms onterecht. De auteurs adviseren om te vragen: wat zie je dat ik niet zie?","Vraag een collega: wat zie je bij mij dat ik zelf niet zie?"],["Ken je eigen reactie","Mensen verschillen sterk in hoe ze reageren op feedback. Sommigen herstellen snel, anderen blijven er lang mee bezig. Dat heeft deels met aanleg te maken. Wie zijn eigen patroon kent, kan er beter mee omgaan en zijn reactie relativeren.","Merk je reactie op feedback op. Hoe lang ben je er gewoonlijk mee bezig?"],["Grenzen stellen mag","Niet alle feedback hoef je aan te nemen. Je mag feedback afwijzen of zelfs grenzen stellen als iemand je steeds onheus behandelt. Maar doe dat bewust, nadat je hebt begrepen wat er bedoeld werd. Vraag ook zelf actief om één ding dat je kunt verbeteren.","Vraag deze week om één concreet punt dat je kunt verbeteren."]]},{"id":"c-7-habits","title":"The 7 Habits of Highly Effective People","titleNl":"De zeven eigenschappen van effectief leiderschap","author":"Stephen R. Covey","year":1989,"topic":"Gewoontes","summary":"Covey beschrijft zeven gewoonten die mensen effectief maken, gebaseerd op karakter en principes. Ze leiden van afhankelijkheid via zelfstandigheid naar wederzijdse samenwerking.","ideas":[["Karakter boven trucjes","Covey stelt dat veel succesliteratuur zich richt op technieken en imago. Hij noemt dat de persoonlijkheidsethiek. Hij pleit voor de karakterethiek: duurzaam succes komt uit principes zoals integriteit, eerlijkheid en geduld. Gewoonten verbinden kennis, vaardigheid en motivatie.","Kijk naar een recent succes: kwam het voort uit karakter of uit een trucje?"],["1. Wees proactief","Tussen prikkel en reactie zit ruimte waarin je kiest. Proactieve mensen nemen verantwoordelijkheid voor hun reacties in plaats van omstandigheden de schuld te geven. Covey adviseert te focussen op je cirkel van invloed, de dingen die je kunt beïnvloeden, in plaats van je cirkel van betrokkenheid.","Maak twee lijstjes: waar ben ik bezorgd over, en wat kan ik daarvan beïnvloeden? Richt je op het tweede."],["2. Begin met het einde voor ogen","Bedenk wat je wilt dat mensen bij je afscheid over je zeggen. Dat helpt je te bepalen wat echt belangrijk is. Covey adviseert een persoonlijk missiestatement te schrijven met je waarden en doelen, als kompas voor dagelijkse keuzes.","Schrijf een korte persoonlijke missie: wat wil ik betekenen, en voor wie?"],["3. Belangrijke zaken eerst","Covey verdeelt taken naar urgentie en belang. De meeste mensen leven in het kwadrant van urgent en belangrijk, of in urgente maar onbelangrijke zaken. Effectieve mensen besteden meer tijd aan belangrijke maar niet urgente zaken, zoals planning, relaties en gezondheid.","Plan deze week twee uur voor iets belangrijks dat niet urgent is."],["4. Denk win-win","In relaties en onderhandelingen zoek je naar oplossingen waar beide partijen beter van worden. Covey ziet het leven als samenwerking, niet als wedstrijd. Lukt win-win niet, dan kies je liever geen deal dan een slechte deal.","Zoek in je volgende onderhandeling naar een oplossing waar beide partijen beter van worden."],["5. Eerst begrijpen, dan begrepen worden","De meeste mensen luisteren met de bedoeling te antwoorden. Covey pleit voor empathisch luisteren: echt proberen de ander te begrijpen voordat je je eigen standpunt geeft. Dat bouwt vertrouwen en leidt tot betere oplossingen.","Vat bij je volgende gesprek eerst samen wat de ander zei, voordat je je eigen mening geeft."],["6 en 7. Synergie en de zaag slijpen","Synergie betekent dat het geheel meer is dan de som der delen: door verschillen te waarderen kom je samen tot betere oplossingen. De zevende gewoonte, de zaag slijpen, gaat over onderhoud van jezelf: lichamelijk, mentaal, sociaal-emotioneel en spiritueel. Zonder die vernieuwing raak je bot.","Plan deze week tijd voor elk van de vier gebieden: lichaam, geest, relaties en zingeving."]]},{"id":"c-tiny-habits","title":"Tiny Habits","titleNl":"Tiny Habits","author":"BJ Fogg","year":2019,"topic":"Gewoontes","summary":"Gedragswetenschapper BJ Fogg van Stanford beschrijft een methode om gewoonten te veranderen door heel klein te beginnen. Je verankert een mini-gewoonte aan iets wat je al doet en viert direct succes.","ideas":[["Het gedragsmodel","Fogg vat gedrag samen in een eenvoudige formule: gedrag ontstaat als motivatie, vermogen en een prompt op hetzelfde moment samenkomen. Als iets niet gebeurt, ontbreekt een van die drie. Meestal is het slimmer om het vermogen te vergroten, dus het makkelijker te maken, dan op motivatie te vertrouwen.","Kies een gewoonte die niet lukt. Ontbreekt het aan motivatie, vermogen of een prompt?"],["Motivatie is onbetrouwbaar","Motivatie schommelt voortdurend. Wie op motivatie bouwt, valt terug zodra die zakt. Fogg adviseert gedrag zo klein te maken dat je het zelfs op een slechte dag doet. Dan heb je nauwelijks motivatie nodig.","Vertrouw niet op motivatie: hoe kun je je gewoonte zo makkelijk maken dat je hem ook op een slechte dag doet?"],["Maak het klein","Een nieuwe gewoonte moet belachelijk klein beginnen: één tand flossen, twee push-ups, één zin schrijven. Het doel is de gewoonte te laten wortelen. Groeien gaat later vanzelf, omdat je vaak meer doet dan het minimum.","Maak je nieuwe gewoonte zo klein dat het bijna belachelijk is."],["Een vast ankermoment","Koppel je nieuwe gewoonte aan iets wat je al dagelijks doet. Fogg gebruikt het recept: na ik [bestaande gewoonte], zal ik [nieuwe mini-gewoonte]. Bijvoorbeeld: nadat ik koffie heb gezet, doe ik twee push-ups. Het anker is je prompt.","Kies een anker: na welke bestaande gewoonte doe je je nieuwe?"],["Vier direct","Direct na de nieuwe gewoonte vier je je succes, bijvoorbeeld met een vuistje of door te zeggen 'goed zo'. Volgens Fogg zorgt die positieve emotie ervoor dat het brein de gewoonte koppelt aan een goed gevoel. Emotie, niet herhaling, maakt gewoonten volgens hem sterk.","Vier direct na je nieuwe gewoonte je succes, bijvoorbeeld met een 'goed zo'."],["Gewoonten afleren","Om een ongewenste gewoonte af te leren, kun je de prompt wegnemen, het gedrag moeilijker maken of de motivatie verlagen. Fogg adviseert om eerst nieuwe gewoonten te bouwen; dat geeft vaardigheid en zelfvertrouwen om daarna moeilijke gewoonten aan te pakken.","Kies een ongewenste gewoonte en zoek de makkelijkste manier om de prompt weg te nemen."],["Wees vriendelijk voor jezelf","Fogg stelt dat je mensen, ook jezelf, niet verandert door schuld of schaamte. Je verandert door je goed te voelen over kleine successen. Zie het als een experiment: lukt iets niet, pas het recept aan in plaats van jezelf de schuld te geven.","Lukt iets niet? Pas het recept aan, in plaats van jezelf de schuld te geven."]]},{"id":"c-switch","title":"Switch","titleNl":"Switch","author":"Chip Heath & Dan Heath","year":2010,"topic":"Gewoontes","summary":"De broers Heath leggen uit waarom verandering moeilijk is en hoe je haar makkelijker maakt. Ze gebruiken het beeld van een berijder, een olifant en een pad.","ideas":[["De berijder en de olifant","De auteurs gebruiken een beeld van psycholoog Jonathan Haidt. Ons verstand is een berijder op een olifant, die onze emoties voorstelt. De berijder kan sturen, maar als de olifant iets anders wil, wint de olifant. Verandering lukt alleen als je beide aanspreekt.","Bij een verandering: spreek je alleen het verstand aan, of ook het gevoel?"],["Stuur de berijder: vind de lichtpuntjes","De berijder raakt verlamd door problemen en analyse. Zoek in plaats daarvan naar wat al werkt en doe daar meer van. De auteurs vertellen over een hulpverlener in Vietnam die ondervoeding aanpakte door te kijken naar arme gezinnen waarvan de kinderen wel goed gevoed waren.","Zoek één plek waar het al goed gaat, en kijk wat daar anders gebeurt."],["Beschrijf de kritieke stappen","Vage doelen zoals gezonder eten werken niet. Geef concreet gedrag aan: koop magere melk in plaats van volle. Zo weet de berijder precies wat hij moet doen, zonder dat hij eindeloos hoeft na te denken.","Maak een vaag doel concreet: welke eerste stap kun je morgen zetten?"],["Wijs de bestemming aan","Geef een heldere, aantrekkelijke bestemming, zoals een ansichtkaart van de toekomst. Dan weet de berijder waar hij naartoe stuurt. Die bestemming moet zowel richting geven als de olifant motiveren.","Beschrijf je doel als een aantrekkelijke ansichtkaart van de toekomst."],["Motiveer de olifant","De olifant reageert op gevoel, niet op analyse. Laat mensen voelen waarom verandering nodig is, bijvoorbeeld door iets zichtbaar te maken. Maak de verandering ook kleiner, zodat de olifant niet afschrikt. Laat mensen zich identificeren met de nieuwe rol.","Laat voelen waarom verandering nodig is, en maak de eerste stap klein."],["Effen het pad","Soms ligt het probleem niet bij de mens, maar bij de situatie. Pas de omgeving aan zodat het gewenste gedrag makkelijker wordt. Een kleiner bord eten zorgt dat mensen minder eten, zonder dat ze daar wilskracht voor nodig hebben.","Pas je omgeving aan zodat het gewenste gedrag vanzelf makkelijker wordt."],["Bouw gewoonten en zoek steun","Gewoonten zorgen dat gedrag automatisch gaat. Gebruik ook de groep: mensen kijken naar anderen om te zien wat normaal is. Als de nieuwe manier van doen zichtbaar wordt, gaan meer mensen meedoen.","Maak nieuw gedrag zichtbaar, zodat anderen het zien en meedoen."]]},{"id":"c-compound-effect","title":"The Compound Effect","titleNl":"Het samengestelde effect","author":"Darren Hardy","year":2010,"topic":"Gewoontes","summary":"Darren Hardy, voormalig uitgever van het tijdschrift Success, stelt dat succes niet voortkomt uit grote doorbraken, maar uit kleine, slimme keuzes die je consequent herhaalt.","ideas":[["Kleine keuzes, grote gevolgen","Hardy vergelijkt drie vrienden die bijna hetzelfde leven leiden. De een maakt kleine positieve keuzes, zoals minder calorieën en wat lezen; de ander kleine negatieve keuzes. Na een paar jaar zijn de verschillen enorm, ook al waren de dagelijkse keuzes nauwelijks zichtbaar.","Kies één kleine positieve keuze die je elke dag gaat maken, en houd die een jaar vol."],["Je bent verantwoordelijk","Hardy stelt dat je honderd procent verantwoordelijk bent voor je leven. Ook als iets niet je schuld is, bepaal jij hoe je reageert. Wie de verantwoordelijkheid neemt, krijgt de macht terug om te veranderen.","Denk aan een probleem: wat is jouw verantwoordelijkheid, ook als het niet jouw schuld is?"],["Houd bij wat je doet","Om te veranderen, moet je weten wat je nu doet. Hardy adviseert om een paar weken nauwkeurig bij te houden waar je tijd, geld en eten naartoe gaan. Bewustwording maakt het makkelijker om bij te sturen.","Houd een week nauwkeurig bij waar je tijd, geld of eten naartoe gaat."],["Gewoonten bouwen en breken","Gewoonten bepalen het grootste deel van ons gedrag. Hardy adviseert om je triggers te herkennen, slechte gewoonten te vervangen door goede en je omgeving aan te passen. Begin klein en richt je op een paar gewoonten tegelijk.","Zoek het signaal achter een slechte gewoonte en pas je omgeving aan."],["Momentum","Als nieuwe gewoonten eenmaal lopen, ontstaat momentum: alles gaat makkelijker. Hardy vergelijkt het met een draaimolen die je eerst moeilijk aan het draaien krijgt. Ritme en routine houden het momentum vast. Wie stopt, verliest het snel.","Kies een vast moment voor een nieuwe gewoonte, zodat het een ritme wordt."],["Invloeden van buiten","Wat je consumeert, beïnvloedt wat je denkt. Hardy adviseert om bewust te kiezen welke informatie je opneemt, met wie je omgaat en in welke omgeving je je bevindt. Omring je met mensen die je helpen groeien.","Kijk naar wat je consumeert: nieuws, social media, gesprekken. Wat helpt je groeien?"],["Doe net iets meer","Hardy beschrijft het verschil tussen goed en uitzonderlijk als het extra stapje: net iets meer doen dan verwacht. Bijvoorbeeld een extra telefoontje, een extra herhaling in de sportschool. Die kleine extra's stapelen zich op tot grote resultaten.","Doe vandaag bij één taak net iets meer dan verwacht."]]},{"id":"c-willpower","title":"Willpower","titleNl":"Wilskracht","author":"Roy F. Baumeister & John Tierney","year":2011,"topic":"Gewoontes","summary":"Psycholoog Roy Baumeister en journalist John Tierney beschrijven onderzoek naar zelfbeheersing. Het centrale idee, dat wilskracht als een spier vermoeid raakt, is later in replicatieonderzoek ter discussie gesteld.","ideas":[["Wilskracht is beperkt","Baumeister deed experimenten waarin mensen die eerst zelfbeheersing moesten tonen, bijvoorbeeld door koekjes te laten staan, daarna sneller opgaven bij een moeilijke puzzel. Hij concludeerde dat wilskracht een beperkte bron is die opraakt. Let op: later onderzoek kon dit effect vaak niet herhalen.","Weet dat de wetenschap hierover verdeeld is. Kijk vooral naar wat bij jou werkt."],["Eén voorraad voor alles","Volgens de auteurs gebruik je dezelfde wilskracht voor heel verschillende dingen: verleidingen weerstaan, emoties beheersen, beslissingen nemen en doorzetten. Een dag vol beslissingen kan je daardoor kwetsbaarder maken voor verleidingen 's avonds.","Merk op wanneer je na een lange dag sneller toegeeft aan verleiding."],["Beslissingsmoeheid","Na veel beslissingen gaan mensen makkelijker kiezen voor de standaardoptie of het makkelijkste. De auteurs noemen voorbeelden van mensen die aan het eind van een lange dag slechtere keuzes maken. Plan belangrijke beslissingen daarom bij voorkeur als je fris bent.","Plan belangrijke beslissingen op een moment dat je fris bent."],["Glucose en energie","De auteurs beschreven een verband tussen wilskracht en de beschikbare energie in het lichaam. Regelmatig eten zou helpen. Ook dit deel van hun theorie is later bekritiseerd; het advies om niet met een lege maag moeilijke beslissingen te nemen, is wel praktisch.","Neem geen belangrijke beslissing met een lege maag."],["Train je zelfbeheersing","Zelfbeheersing kan volgens de auteurs groeien door oefening, bijvoorbeeld door kleine dingen bewust anders te doen, zoals je houding verbeteren of met je andere hand eten. Dat zou ook helpen op andere gebieden.","Kies een kleine dagelijkse oefening in zelfbeheersing, zoals rechtop zitten."],["Slimmer dan wilskracht","Mensen met veel zelfbeheersing gebruiken hun wilskracht juist weinig. Ze richten hun leven zo in dat ze minder verleid worden en vertrouwen op gewoonten. Vermijd verleidingen in plaats van ze steeds te weerstaan.","Haal een verleiding uit je omgeving in plaats van hem steeds te weerstaan."],["Houd het bij","Zelfbeheersing wordt makkelijker als je je gedrag bijhoudt. Wie bijhoudt wat hij eet, uitgeeft of doet, merkt sneller als hij afwijkt van zijn doel. Concrete, haalbare doelen en duidelijke plannen helpen daarbij.","Houd één gewoonte bij in een simpele tracker."]]},{"id":"c-e-myth","title":"The E-Myth Revisited","titleNl":"De E-mythe","author":"Michael E. Gerber","year":1995,"topic":"Ondernemen","summary":"Gerber legt uit waarom veel kleine bedrijven mislukken. Volgens hem starten vakmensen een bedrijf zonder te begrijpen hoe je een bedrijf bouwt. Werk aan je bedrijf, niet alleen in je bedrijf.","ideas":[["De ondernemersmythe","Volgens Gerber is het een mythe dat de meeste bedrijven worden gestart door ondernemers. Meestal begint een vakman, zoals een bakker of loodgieter, die denkt: als ik het vak begrijp, begrijp ik ook het bedrijf. Dat blijkt een vergissing.","Kijk naar je eigen werk: ben je vooral vakman, manager of ondernemer?"],["Drie persoonlijkheden","In elke ondernemer zitten drie rollen. De ondernemer, die visie en toekomst ziet. De manager, die orde en planning wil. En de vakman, die het werk wil doen. Bij veel kleine ondernemers domineert de vakman, waardoor het bedrijf blijft hangen.","Welke van de drie rollen krijgt bij jou te weinig aandacht?"],["Fases van een bedrijf","Gerber beschrijft de kinderschoenen, waarin de eigenaar alles zelf doet; de adolescentie, waarin hulp wordt ingehuurd maar chaos ontstaat; en volwassenheid, waarin het bedrijf vanaf het begin is opgezet als een systeem dat kan groeien.","In welke fase zit jouw bedrijf of project, en wat is de volgende stap?"],["Het franchise-prototype","Gerber adviseert om je bedrijf op te zetten alsof je het als franchise zou verkopen. Dat betekent dat alles zo is vastgelegd in systemen, dat iemand anders het met dezelfde kwaliteit kan uitvoeren. Het bedrijf moet werken zonder dat jij er steeds bij bent.","Beschrijf één proces zo dat iemand anders het zonder jou kan uitvoeren."],["Werk aan, niet in je bedrijf","Veel ondernemers zijn zo druk met het dagelijkse werk dat ze geen tijd hebben om het bedrijf te verbeteren. Gerber stelt dat je juist tijd moet maken om aan je bedrijf te werken: processen ontwerpen, systemen bouwen, strategie bepalen.","Plan wekelijks een uur om aan je bedrijf te werken in plaats van erin."],["Systemen en handboeken","Leg vast hoe dingen gedaan worden, van de telefoon opnemen tot een product maken. Zo wordt kwaliteit voorspelbaar. Gerber noemt het voorbeeld van fastfoodketens, waar elk proces nauwkeurig is beschreven.","Leg een terugkerende taak vast in een korte handleiding of checklist."],["Je bedrijf dient je leven","Begin met de vraag wat voor leven je wilt leiden. Het bedrijf is een middel om dat leven mogelijk te maken, niet andersom. Gerber adviseert om een primair doel te formuleren en het bedrijf daarop te bouwen.","Schrijf op wat voor leven je wilt, en kijk of je bedrijf daaraan bijdraagt."]]},{"id":"c-rework","title":"Rework","titleNl":"Rework","author":"Jason Fried & David Heinemeier Hansson","year":2010,"topic":"Ondernemen","summary":"De oprichters van softwarebedrijf 37signals, later Basecamp, gooien veel gangbare ideeën over ondernemen overboord. Ze pleiten voor klein blijven, minder plannen en sneller iets lanceren.","ideas":[["Negeer de echte wereld","Mensen zeggen vaak dat iets in de echte wereld niet werkt. De auteurs stellen dat die echte wereld vaak een excuus is om niets nieuws te proberen. Begin gewoon, ook als anderen zeggen dat het niet kan.","Welk idee houd je tegen met het argument dat het 'in de echte wereld' niet werkt?"],["Plannen zijn gokken","Lange-termijnplannen zijn volgens de auteurs eigenlijk raden. Je weet niet genoeg over de toekomst. Neem liever beslissingen vlak voordat je iets doet, als je de meeste informatie hebt. Plan voor de komende weken, niet voor de komende jaren.","Plan voor de komende weken in plaats van voor het komende jaar."],["Klein is prima","Groeien is niet automatisch beter. Een klein bedrijf is flexibel, wendbaar en heeft minder overhead. De auteurs vragen zich af waarom elk bedrijf moet streven naar zoveel mogelijk medewerkers en omzet.","Vraag je af of groei echt nodig is, of dat klein blijven beter bij je past."],["Begin met de kern","Maak eerst het belangrijkste deel van je product goed en lanceer dat. Laat de rest weg. Bouw liever een half product dan een halfslachtig product: beter weinig goed dan veel half.","Wat is de kern van je product of project? Lanceer die eerst."],["Workaholics zijn niet heldhaftig","Lange werkdagen leveren niet meer op, maar maken mensen moe en geven slecht werk. De auteurs stellen dat werken als een gek geen teken van toewijding is, maar van slechte organisatie. Ga gewoon naar huis.","Stop morgen op tijd met werken en kijk of je de dag erna productiever bent."],["Vergaderingen zijn giftig","Vergaderingen kosten veel tijd van veel mensen en leveren vaak weinig op. Als je moet vergaderen: houd het kort, met weinig mensen en een duidelijk probleem. Onderbrekingen zijn de vijand van productiviteit.","Schrap één vaste vergadering en vervang hem door een kort schriftelijk overzicht."],["Bouw een publiek","Grote bedrijven geven veel uit aan reclame. Kleine bedrijven kunnen beter een publiek opbouwen door te delen wat ze weten: blogs, lessen, kijkjes achter de schermen. De auteurs noemen dat outteachen: mensen iets leren in plaats van ze iets te verkopen.","Deel iets wat je weet met je publiek, zonder iets te verkopen."]]},{"id":"c-hard-thing","title":"The Hard Thing About Hard Things","titleNl":"Het moeilijke van moeilijke dingen","author":"Ben Horowitz","year":2014,"topic":"Ondernemen","summary":"Ondernemer en investeerder Ben Horowitz vertelt eerlijk over de zware momenten bij het leiden van zijn bedrijf. Hij geeft advies over situaties waar geen handboek voor bestaat.","ideas":[["Er is geen recept","Managementboeken geven vaak recepten, maar de moeilijkste situaties hebben geen recept. Horowitz beschrijft hoe hij bij Loudcloud en later Opsware meerdere keren op de rand van het faillissement stond. Leiderschap betekent beslissen zonder dat er een goed antwoord is.","Is er een situatie waarvoor geen recept bestaat? Wat is de beste beslissing met wat je nu weet?"],["De worsteling","Horowitz noemt de periodes waarin alles misgaat the struggle. Je twijfelt aan alles, slaapt slecht en voelt je eenzaam. Hij stelt dat elke ondernemer dit meemaakt, en dat de enige uitweg is om door te gaan en te blijven zoeken naar oplossingen.","Erken dat de moeilijke momenten erbij horen, en zoek steun bij iemand die het herkent."],["Vertel de waarheid","Wees eerlijk tegen je medewerkers over slecht nieuws. Horowitz stelt dat een leider die alleen positief nieuws deelt, het vertrouwen verliest. Hoe meer mensen de problemen kennen, hoe meer mensen kunnen meehelpen ze op te lossen.","Deel slecht nieuws open met je team, en vraag om hulp bij de oplossing."],["Ontslag op de goede manier","Als je mensen moet ontslaan, doe het dan snel, eerlijk en persoonlijk. Laat leidinggevenden het zelf doen bij hun eigen mensen. Horowitz beschrijft dat de manier waarop je ontslaat bepaalt hoe de achterblijvers het bedrijf blijven vertrouwen.","Als je iemand slecht nieuws moet brengen: doe het snel, eerlijk en persoonlijk."],["Zorg eerst voor je mensen","Horowitz' leidraad: zorg eerst voor je mensen, dan voor de producten, dan voor de winst. Een goede werkplek is een plek waar mensen zich kunnen richten op hun werk, en waar goede mensen willen blijven.","Kijk naar je prioriteiten als leider: komen je mensen eerst?"],["Oorlogstijd en vredestijd","Horowitz onderscheidt een CEO in vredestijd, die zich richt op uitbreiden en verbeteren, en een CEO in oorlogstijd, die vecht voor het voortbestaan van het bedrijf. Beide vragen een andere stijl. Een goede leider weet in welke situatie hij zit.","Zit je bedrijf in oorlogstijd of vredestijd, en past je stijl daarbij?"],["Focus op wat je kunt doen","In moeilijke tijden is het verleidelijk om te piekeren over alles wat mis kan gaan. Horowitz adviseert om te focussen op wat je kunt doen en niet op wat je niet kunt beïnvloeden. Er is bijna altijd wel een zet die je nog kunt doen.","Schrijf bij een tegenslag op welke stap je nog kunt zetten."]]},{"id":"c-blue-ocean","title":"Blue Ocean Strategy","titleNl":"Blue Ocean Strategy","author":"W. Chan Kim & Renée Mauborgne","year":2005,"topic":"Ondernemen","summary":"Kim en Mauborgne van INSEAD stellen dat bedrijven beter nieuwe markten kunnen creëren dan vechten in bestaande markten. Ze geven instrumenten om zo'n blauwe oceaan te vinden.","ideas":[["Rode en blauwe oceanen","Rode oceanen zijn bestaande markten waar concurrenten vechten om dezelfde klanten, waardoor marges dalen. Blauwe oceanen zijn nieuwe markten zonder directe concurrentie. De auteurs stellen dat duurzame groei vooral uit blauwe oceanen komt.","Concurreer je vooral op dezelfde punten als anderen? Waar kun je een eigen markt creëren?"],["Waarde-innovatie","De kern is waarde-innovatie: tegelijk meer waarde bieden aan klanten en kosten verlagen. Dat lijkt tegenstrijdig, maar kan door keuzes te maken over wat je wel en niet aanbiedt. Je concurreert niet beter, je maakt de concurrentie irrelevant.","Welke kosten kun je schrappen terwijl je meer waarde biedt?"],["Cirque du Soleil","Het bekendste voorbeeld is Cirque du Soleil. Het circus liet dure elementen zoals dierenacts en sterartiesten vallen, en voegde theater, muziek en verhaal toe. Zo ontstond een nieuw soort voorstelling voor een nieuw publiek, dat bereid was meer te betalen.","Welk element uit je branche kun je weglaten, en wat kun je toevoegen dat nieuw is?"],["Vier acties","De auteurs geven vier vragen. Welke factoren die de branche vanzelfsprekend vindt, kun je elimineren? Welke kun je ver onder de standaard reduceren? Welke kun je ver boven de standaard verhogen? En welke nieuwe factoren kun je creëren?","Doe de vier acties voor je eigen aanbod: elimineren, reduceren, verhogen en creëren."],["Het strategiecanvas","Met een strategiecanvas teken je op welke factoren een branche concurreert en hoe hoog elke speler scoort. Als jouw lijn op die van concurrenten lijkt, zit je in een rode oceaan. Een blauwe oceaan zie je aan een duidelijk afwijkend profiel.","Teken een strategiecanvas van je branche, en kijk hoe jouw profiel afwijkt."],["Kijk naar niet-klanten","Grote kansen liggen vaak bij mensen die nu geen klant zijn. Waarom kopen ze niet? De auteurs onderscheiden drie lagen niet-klanten en adviseren om naar wat ze gemeen hebben te kijken, in plaats van te focussen op verschillen tussen bestaande klanten.","Praat met iemand die geen klant is, en vraag waarom niet."],["De juiste volgorde","Een goede blauwe-oceaanstrategie klopt in deze volgorde: bruikbaarheid voor de koper, een prijs die massa's aanspreekt, kosten die winst mogelijk maken, en een plan voor adoptie door partners en medewerkers. Mist er één, dan wordt het idee geen succes.","Toets je idee op bruikbaarheid, prijs, kosten en acceptatie."]]},{"id":"c-shoe-dog","title":"Shoe Dog","titleNl":"Shoe Dog","author":"Phil Knight","year":2016,"topic":"Ondernemen","summary":"Phil Knight, oprichter van Nike, vertelt eerlijk over de beginjaren van zijn bedrijf. Het is geen handboek, maar een verhaal over doorzetten, risico nemen en een team van buitenbeentjes.","ideas":[["Een gek idee","In 1962 had de jonge Phil Knight wat hij zijn gekke idee noemde: Japanse hardloopschoenen importeren in de Verenigde Staten, zoals Japanse camera's de Duitse hadden verdrongen. Hij reisde naar Japan en wist een deal te sluiten met fabrikant Onitsuka, het merk Tiger.","Heb je een gek idee? Schrijf het op en zet er een eerste kleine stap in."],["Begonnen uit de kofferbak","Knight verkocht de schoenen eerst zelf, op atletiekwedstrijden en vanuit zijn auto. Samen met zijn oude atletiekcoach Bill Bowerman, die zelf schoenen ontwierp, richtte hij Blue Ribbon Sports op. Zijn passie voor hardlopen hielp hem verkopen.","Begin met wat je zelf kunt doen, ook als het klein is."],["Altijd geldgebrek","Het bedrijf groeide snel, maar had voortdurend geldgebrek. Knight leende steeds meer bij banken, die hem vaak wantrouwden. Groei vraagt geld voor voorraad, en dat geld was er niet. Het verhaal laat zien hoe gevaarlijk snelle groei kan zijn voor een jong bedrijf.","Kijk naar je eigen groei: heb je genoeg buffer om de volgende stap te zetten?"],["Breuk met de leverancier","Na jaren samenwerking ontdekte Knight dat Onitsuka hem wilde passeren. Hij besloot een eigen merk te starten. Zo ontstond Nike, genoemd naar de Griekse godin van de overwinning. Het swoosh-logo werd voor een klein bedrag ontworpen door een studente.","Ben je afhankelijk van één leverancier of klant? Wat is je plan als dat wegvalt?"],["Het team van buitenbeentjes","Knight beschrijft zijn vroege team als een groep buitenbeentjes met bijzondere talenten. Hij gaf ze veel vrijheid en vertrouwde ze. Hun gedeelde passie en loyaliteit hielpen het bedrijf door moeilijke tijden.","Geef je team vrijheid en vertrouwen, en waardeer hun eigenaardigheden."],["Bowerman en innovatie","Bill Bowerman experimenteerde voortdurend met nieuwe ontwerpen. Een bekend verhaal is dat hij een nieuwe zool maakte met het wafelijzer van zijn vrouw. Innovatie kwam uit nieuwsgierigheid naar wat lopers nodig hadden.","Vraag je klanten wat ze echt nodig hebben, en experimenteer."],["Niet stoppen","Knight vat zijn les samen als: niet stoppen. Er waren veel momenten waarop het bedrijf bijna ten onder ging. Wat hem dreef was niet geld, maar het gevoel bij te dragen aan iets wat ertoe doet. Hij moedigt jonge mensen aan om een roeping te zoeken, geen baan.","Wat is voor jou een roeping in plaats van een baan?"]]},{"id":"c-mom-test","title":"The Mom Test","titleNl":"The Mom Test","author":"Rob Fitzpatrick","year":2013,"topic":"Ondernemen","summary":"Een kort, praktisch boek over hoe je met klanten praat om te leren of je idee goed is. Iedereen liegt tegen je als je naar je idee vraagt, zelfs je moeder; dus stel andere vragen.","ideas":[["Iedereen liegt over je idee","Als je mensen vraagt wat ze van je idee vinden, zeggen ze aardige dingen om je niet te kwetsen. Je moeder zal je idee altijd goed vinden. De Mom Test is een manier om vragen te stellen waar zelfs je moeder eerlijk op moet antwoorden.","Vraag in je volgende klantgesprek niet wat ze van je idee vinden."],["Praat over hun leven","Vraag niet naar je idee, maar naar het leven van de ander: hun problemen, gewoonten en wat ze nu doen. Mensen zijn goed in vertellen wat ze hebben meegemaakt. Ze zijn slecht in voorspellen wat ze in de toekomst zouden doen of kopen.","Vraag naar hun huidige problemen en hoe ze die nu oplossen."],["Vraag naar specifieke ervaringen","Vraag niet 'zou je dit gebruiken?', maar 'wanneer had je dit probleem voor het laatst, en wat heb je toen gedaan?'. Concrete ervaringen uit het verleden zeggen veel meer dan meningen of hypothetische uitspraken.","Vraag: wanneer had je dit probleem voor het laatst, en wat deed je toen?"],["Pas op met complimenten","Complimenten zijn waardeloos als data. Als iemand zegt dat je idee geweldig is, vraag dan door naar wat hij nu doet en wat het hem kost. Laat je niet misleiden door enthousiasme zonder bewijs.","Bij een compliment: vraag door naar wat ze nu doen en wat het hen kost."],["Zoek naar commitment","Echte interesse blijkt uit actie: tijd, reputatie of geld. Vraagt iemand om een vervolgafspraak, stelt hij je voor aan een beslisser of wil hij vooraf betalen? Dat zijn signalen dat het probleem echt speelt. Zonder commitment ben je vaak alleen beleefd ontvangen.","Vraag om een concrete vervolgstap, zoals een introductie of vooruitbetaling."],["Houd het informeel","Gesprekken werken beter als ze voelen als een gewoon gesprek, niet als een formeel interview. Je hoeft geen grote afspraken te plannen; je kunt leren tijdens een koffie of op een evenement. Houd het kort en richt je op het probleem.","Plan een informeel gesprek met een potentiële klant bij een koffie."],["Bereid je voor en evalueer","Bepaal vooraf de drie belangrijkste dingen die je wilt leren. Maak na elk gesprek notities en deel ze met je team. Zo bouw je een beeld op van je klanten, gebaseerd op feiten in plaats van op aannames.","Bepaal voor elk gesprek de drie dingen die je wilt leren, en noteer daarna wat je hoorde."]]},{"id":"c-innovators-dilemma","title":"The Innovator's Dilemma","titleNl":"Het dilemma van de innovator","author":"Clayton M. Christensen","year":1997,"topic":"Ondernemen","summary":"Harvard-professor Clayton Christensen legt uit waarom goed geleide, succesvolle bedrijven toch ten onder gaan door nieuwe technologieën. Hij introduceerde het begrip disruptieve innovatie.","ideas":[["Goed management kan je fataal worden","Christensen stelt dat bedrijven niet falen door slecht management, maar juist door goed management. Ze luisteren naar hun beste klanten, investeren in betere producten en richten zich op winstgevende markten. Precies daardoor missen ze nieuwe technologieën.","Kijk naar je beste klanten: worden je producten te geavanceerd voor wat zij nodig hebben?"],["Ondersteunende versus disruptieve innovatie","Ondersteunende innovaties verbeteren bestaande producten voor bestaande klanten. Disruptieve innovaties zijn in het begin slechter, maar goedkoper, eenvoudiger of handiger. Ze spreken eerst een kleine, minder veeleisende markt aan.","Welke simpele, goedkope oplossing in je branche wordt nu genegeerd?"],["Het voorbeeld van harde schijven","Christensen bestudeerde de industrie van harde schijven. Steeds kwam er een kleiner formaat schijf op, dat eerst niet goed genoeg was voor de bestaande klanten. De gevestigde fabrikanten negeerden het, en verloren later de markt aan nieuwkomers.","Denk aan een technologie die je nu als speelgoed afdoet. Hoe zou die over vijf jaar kunnen zijn?"],["De technologie haalt de markt in","Disruptieve technologieën verbeteren snel. Op een gegeven moment zijn ze goed genoeg voor de gewone markt, terwijl gevestigde producten meer bieden dan klanten nodig hebben. Dan schakelen klanten over op het goedkopere, eenvoudigere alternatief.","Bieden je producten meer dan klanten nodig hebben? Waar ligt de grens?"],["Kleine markten voldoen niet","Voor een groot bedrijf zijn de eerste markten van een disruptieve technologie te klein om interessant te zijn. Ze leveren niet genoeg groei op. Daarom investeert het bedrijf er niet in, en laat het ruimte aan nieuwe spelers.","Kijk naar een kleine markt die je groot bedrijf niet interesseert. Wie zou daar kunnen groeien?"],["Een aparte organisatie","Christensen adviseert gevestigde bedrijven om disruptieve technologieën onder te brengen in een aparte, kleine organisatie. Die kan zich richten op kleine markten en bescheiden marges, zonder de druk van de grote moederorganisatie.","Geef een nieuw initiatief een eigen ruimte, los van de rest van je organisatie."],["Ontdekken door te doen","Voor disruptieve technologieën bestaan nog geen markten om te analyseren. Je kunt niet vooraf voorspellen hoe ze gebruikt zullen worden. Christensen adviseert daarom om te leren door te experimenteren, met plannen die gericht zijn op leren in plaats van uitvoeren.","Bij iets nieuws: plan om te leren, niet om direct uit te voeren."]]},{"id":"c-100m-offers","title":"$100M Offers","titleNl":"$100M Offers","author":"Alex Hormozi","year":2021,"topic":"Ondernemen","summary":"Ondernemer Alex Hormozi beschrijft hoe je een aanbod maakt dat zo goed is dat mensen zich dom voelen als ze nee zeggen. Het boek gaat over waarde, prijs en het verpakken van je aanbod.","ideas":[["Een onweerstaanbaar aanbod","Hormozi noemt zo'n aanbod een Grand Slam Offer: het biedt zoveel waarde dat klanten het niet kunnen weigeren. Hij stelt dat de meeste ondernemers zich richten op marketing, terwijl een beter aanbod veel meer verschil maakt.","Kijk naar je huidige aanbod: is het zo goed dat klanten zich dom voelen als ze nee zeggen?"],["Kies de juiste markt","Begin met een markt die al pijn heeft, koopkracht heeft, makkelijk te bereiken is en groeit. Hormozi stelt dat een goede markt belangrijker is dan je aanbod of je vaardigheden. Als je in een slechte markt zit, zwem je tegen de stroom in.","Beoordeel je markt: heeft hij pijn, koopkracht, is hij bereikbaar en groeit hij?"],["Rek je prijs op","Concurreer niet op prijs. Hormozi stelt dat een hoge prijs je ruimte geeft om meer waarde te leveren en betere resultaten voor klanten te halen. Klanten die meer betalen, zijn vaak ook meer betrokken. Een lage prijs leidt tot een race naar beneden.","Concurreer je op prijs? Wat zou je extra kunnen leveren als je meer vraagt?"],["De waardevergelijking","Hormozi beschrijft waarde aan de hand van vier factoren. De waarde stijgt met het gewenste resultaat en de waargenomen kans dat het lukt. De waarde daalt met de tijd tot het resultaat en de moeite en opoffering die het kost. Werk aan alle vier.","Werk aan je aanbod: hoe kun je het resultaat groter, sneller, zekerder en makkelijker maken?"],["Bouw het aanbod op","Maak een lijst van alle problemen die je klant heeft op weg naar het resultaat. Bedenk voor elk probleem een oplossing en kies hoe je die levert. Bundel daarna de oplossingen die veel waarde hebben voor de klant en weinig kosten voor jou.","Maak een lijst van problemen van je klant en bedenk voor elk een oplossing."],["Schaarste, urgentie en bonussen","Versterk je aanbod met echte schaarste, zoals een beperkt aantal plaatsen, en urgentie, zoals een deadline. Voeg bonussen toe die bepaalde bezwaren wegnemen. Hormozi waarschuwt dat het eerlijk moet zijn; nep-schaarste schaadt je reputatie.","Voeg een eerlijke deadline of bonus toe aan je aanbod."],["Garanties","Een sterke garantie neemt het risico weg voor de klant. Hormozi beschrijft verschillende vormen, zoals geld terug als het resultaat uitblijft, of doorgaan tot het resultaat er is. Een garantie laat zien dat je in je eigen product gelooft.","Bedenk een garantie die het risico voor je klant wegneemt."]]}]</script>

function topicColor(t){const i=TOPICS.indexOf(t);let h=i>=0?i:[...String(t||"")].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,0);return `var(${TC[h%TC.length]})`}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dayKey=(d=new Date())=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();

/* ---------- opslag ---------- */
const S={books:[],saved:[],deep:{},shared:{},prof:{onboarded:false,goals:[],topics:[],goal:5,read:[],progress:{},day:"",count:0,streak:0,last:""}};

function profChanged(now){profDirty=true;lsSet();clearTimeout(profTimer);profTimer=setTimeout(flushProf,now?0:1500)}
async function flushProf(){if(!profDirty)return;if(LOCAL){profDirty=false;return}if(profWriting){profTimer=setTimeout(flushProf,800);return}
