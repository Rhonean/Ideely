n rust en raken uitgeput door veel sociale drukte. Extraverten krijgen juist energie van prikkels en gezelschap. Introversie is iets anders dan verlegenheid: verlegenheid is angst voor afkeuring.","Merk op wanneer je energie krijgt en wanneer je leegloopt. Plan je week daarop."],["Het mythe van groepsdenken","Brainstormen in groepen levert volgens onderzoek dat Cain aanhaalt vaak minder en slechtere ideeën op dan mensen die eerst alleen nadenken. Open kantoren en continu teamwerk passen slecht bij diep nadenken. Ruimte voor alleen werken is waardevol, voor iedereen.","Laat iedereen voor een brainstorm eerst alleen ideeën opschrijven, en bespreek ze daarna samen."],["Introverte leiders","Extraverte leiders zijn niet altijd beter. Cain beschrijft onderzoek waaruit blijkt dat introverte leiders soms beter presteren met proactieve teams, omdat ze beter luisteren en ideeën van anderen laten bloeien. Rustig leiderschap kan krachtig zijn.","Geef in je team ruimte aan mensen die minder snel praten, bijvoorbeeld door schriftelijk input te vragen."],["Gevoeligheid","Sommige mensen reageren als baby al sterk op prikkels; zij worden vaker introvert. Cain beschrijft onderzoek van Jerome Kagan hierover. Gevoeligheid brengt ook voordelen: oog voor detail, empathie en zorgvuldigheid.","Zie gevoeligheid als kracht: bij welke taken helpt jouw oog voor detail?"],["Voorbij je natuur","Introverten kunnen zich extravert gedragen als iets ze echt aan het hart gaat, bijvoorbeeld een spreker die een geliefd onderwerp presenteert. Psycholoog Brian Little noemt dat vrije trekken. Wel is het belangrijk om daarna herstelplekken te hebben om weer op te laden.","Plan na een drukke sociale dag bewust een herstelmoment."],["Samenleven en opvoeden","In relaties tussen een introvert en een extravert botsen vaak de behoeften aan prikkels en rust. Wie dat begrijpt, kan beter afspraken maken. Cain adviseert ouders en leraren om stille kinderen niet te pushen extravert te worden, maar hun manier van denken te waarderen.","Bespreek met je partner of collega's hoeveel prikkels en rust jullie elk nodig hebben."]]},{"id":"c-flow","title":"Flow: The Psychology of Optimal Experience","titleNl":"Flow","author":"Mihaly Csikszentmihalyi","year":1990,"topic":"Psychologie","summary":"Psycholoog Mihaly Csikszentmihalyi onderzocht wanneer mensen zich het gelukkigst voelen. Zijn antwoord: in flow, een toestand van volledige opgaan in een uitdagende activiteit.","ideas":[["Wat flow is","Flow is de toestand waarin je zo opgaat in een activiteit dat je tijd en jezelf vergeet. Csikszentmihalyi vond die ervaring bij schaakspelers, rotsklimmers, chirurgen en fabrieksarbeiders. Mensen beschrijven het als de beste momenten van hun leven.","Denk terug aan een moment waarop je de tijd vergat. Wat deed je toen precies?"],["Uitdaging en vaardigheid in balans","Flow ontstaat als de uitdaging net groot genoeg is voor je vaardigheden. Te makkelijk geeft verveling, te moeilijk geeft angst. Naarmate je vaardigheden groeien, heb je grotere uitdagingen nodig om in flow te blijven. Zo groei je.","Maak een taak die te saai is moeilijker, of een taak die te zwaar is kleiner."],["Kenmerken van flow","Flow-ervaringen hebben gemeenschappelijke kenmerken: duidelijke doelen, directe feedback, volledige concentratie, een gevoel van controle, verlies van zelfbewustzijn en een veranderd tijdsbesef. De activiteit wordt een doel op zich.","Stel voor je volgende werkblok een duidelijk doel en manier om direct te zien of je vooruitgaat."],["Orde in je bewustzijn","Csikszentmihalyi stelt dat ons bewustzijn snel in wanorde raakt, bijvoorbeeld door piekeren. Hij noemt dat psychische entropie. Flow brengt orde, omdat al je aandacht op één doel is gericht. Wie zijn aandacht leert sturen, kan zijn ervaring van het leven verbeteren.","Als je merkt dat je piekert, kies een activiteit die al je aandacht vraagt."],["Flow in werk","Werk kan een bron van flow zijn, vaak meer dan vrije tijd. In onderzoek ervoeren mensen op het werk vaker flow dan bij passieve vrijetijdsbesteding zoals televisiekijken. Toch zeggen ze liever vrij te zijn. Wie zijn werk ziet als een reeks uitdagingen, kan er meer uit halen.","Zie een routinetaak op je werk als uitdaging: kun je hem sneller of beter doen?"],["Autotelische persoonlijkheid","Sommige mensen vinden makkelijker flow, ook in gewone of zware omstandigheden. Ze doen dingen om de activiteit zelf, niet om een externe beloning. Csikszentmihalyi noemt dat een autotelische persoonlijkheid. Je kunt die houding ontwikkelen door nieuwsgierigheid en aandacht.","Kies één activiteit die je doet om de activiteit zelf, zonder beloning."],["Zin als samenhang","Op de lange termijn ontstaat geluk als je verschillende flow-ervaringen verbindt in een samenhangend levensdoel. Csikszentmihalyi noemt dat het scheppen van zin. Een groot doel geeft richting aan alle kleinere uitdagingen.","Kijk naar je flow-activiteiten: welk groter doel verbindt ze?"]]},{"id":"c-drive","title":"Drive","titleNl":"Drive","author":"Daniel H. Pink","year":2009,"topic":"Psychologie","summary":"Pink stelt dat wortels en stokken bij creatief werk slecht werken. Echte motivatie komt volgens hem van autonomie, meesterschap en zingeving.","ideas":[["Motivatie 1.0, 2.0 en 3.0","Pink beschrijft drie besturingssystemen. Motivatie 1.0 draait om overleven. Motivatie 2.0 werkt met beloning en straf. Motivatie 3.0 draait om intrinsieke drijfveren. Volgens Pink zijn veel organisaties nog ingericht op 2.0, terwijl het werk om 3.0 vraagt.","Kijk naar je eigen werk: hoeveel draait om beloning en straf, en hoeveel om interesse?"],["Wanneer beloningen falen","Bij eenvoudig, routinematig werk werken beloningen goed. Bij werk dat creativiteit vraagt, kunnen ze averechts werken. Pink beschrijft experimenten, zoals de kaarsproef, waarin een beloning mensen juist slechter liet presteren, omdat hun blik vernauwde.","Merk op wanneer een beloning je creativiteit vernauwt. Kun je de focus terugleggen op het probleem zelf?"],["De nadelen van wortels en stokken","Beloningen kunnen intrinsieke motivatie verminderen, creativiteit doden, goed gedrag ondermijnen, valsspelen aanmoedigen en kortetermijndenken bevorderen. Pink zegt niet dat geld niet uitmaakt. Betaal mensen eerlijk, zodat geld geen issue meer is, en motiveer vervolgens anders.","Als leidinggevende: zorg dat het salaris eerlijk is, en motiveer dan via autonomie en ontwikkeling."],["Autonomie","Mensen willen zelf richting geven aan hun leven. Pink noemt vier vormen: autonomie over taak, tijd, techniek en team. Hij noemt bedrijven die medewerkers tijd geven voor eigen projecten, wat tot waardevolle innovaties leidde.","Kies één aspect van je werk, zoals tijd of aanpak, waar je meer zelf over wilt beslissen."],["Meesterschap","Mensen willen beter worden in iets wat ertoe doet. Meesterschap vraagt een groeimindset en volharding, en is nooit helemaal bereikt. Pink noemt het een asymptoot: je kunt er steeds dichterbij komen, maar het nooit helemaal aanraken. Flow helpt om stappen te zetten.","Kies één vaardigheid om de komende maanden echt beter in te worden."],["Zingeving","Mensen presteren het best als ze werken voor iets dat groter is dan zichzelf. Organisaties kunnen dat versterken door een duidelijk doel te hebben, niet alleen winst. Pink merkt op dat ook taal verschil maakt: spreken over wij in plaats van zij.","Schrijf op voor wie je werk ertoe doet, en wat je bijdraagt aan iets groters."],["Type I en type X","Pink onderscheidt type X-gedrag, gedreven door externe beloningen, en type I-gedrag, gedreven door intrinsieke motivatie. Type I is niet aangeboren maar aan te leren. Volgens Pink leidt het op lange termijn tot betere prestaties, gezondheid en welzijn.","Kijk naar een taak die je doet voor erkenning. Kun je er iets intrinsiek interessants in vinden?"]]},{"id":"c-thinking-in-bets","title":"Thinking in Bets","titleNl":"Denken in kansen","author":"Annie Duke","year":2018,"topic":"Psychologie","summary":"Voormalig professioneel pokerspeler Annie Duke laat zien hoe je beter beslist onder onzekerheid. Elke beslissing is een gok; het gaat om de kwaliteit van de beslissing, niet om de uitkomst.","ideas":[["Het leven is poker, geen schaken","Bij schaken is bijna alle informatie zichtbaar en wint meestal de betere speler. In poker, en in het leven, spelen geluk en verborgen informatie een grote rol. Beslissingen moeten dus worden genomen zonder volledige kennis, en een goede beslissing kan slecht uitpakken.","Bekijk een recente beslissing: hoeveel was jouw keuze en hoeveel was toeval?"],["Beoordeel niet op de uitkomst","Duke noemt de neiging om een beslissing te beoordelen op de uitkomst 'resulting'. Ze gebruikt het voorbeeld van een coach wiens gewaagde keuze verkeerd uitpakte en daarom werd afgeschilderd als de slechtste keuze ooit. De vraag moet zijn: was het een goede beslissing met de informatie van toen?","Beoordeel een beslissing die slecht uitpakte op de informatie die je toen had, niet op de uitkomst."],["Zeg: wil je wedden?","Als je gevraagd wordt om op je mening te wedden, ga je kritischer nadenken over hoe zeker je bent. Duke adviseert om je overtuigingen te zien als gokken met een bepaalde waarschijnlijkheid. Zeg liever 'ik ben er voor zeventig procent zeker van' dan 'ik weet het zeker'.","Zet een percentage bij je volgende stellige mening: hoe zeker ben je echt?"],["Leer van uitkomsten","Na een uitkomst moet je bepalen welk deel door je beslissing kwam en welk deel door geluk. We nemen meestal de eer voor goede uitkomsten en schuiven slechte af op pech. Wie eerlijker naar beide kijkt, leert sneller.","Schrijf na een goede uitkomst op welke rol geluk speelde, en na een slechte welke rol jouw keuze speelde."],["Bouw een denkgroep","Zoek mensen die je helpen om eerlijk naar je beslissingen te kijken. Duke beschrijft afspraken voor zo'n groep: gericht op nauwkeurigheid, verantwoording en openheid voor verschillende standpunten. Belonen van eerlijkheid in plaats van gelijk hebben is daarbij essentieel.","Zoek één of twee mensen met wie je eerlijk over beslissingen kunt praten, zonder oordeel."],["Reis door de tijd","Bedenk hoe je toekomstige zelf over deze beslissing zou denken, en wat je verleden zelf ervan zou vinden. Duke noemt dit mentale tijdreizen. Het helpt om impulsieve beslissingen in het moment te voorkomen en meer vanuit lange termijn te kiezen.","Vraag bij een impulsieve keuze: hoe denkt mijn toekomstige ik hierover over een jaar?"],["Verken scenario's","Bedenk vooraf verschillende mogelijke uitkomsten en hun kansen. Gebruik ook een premortem: stel je voor dat het mislukt is en vraag waarom. Zo ontdek je risico's die je anders over het hoofd ziet, en ben je minder verrast als het tegenzit.","Doe voor een belangrijk besluit een premortem: het is mislukt, waarom?"]]},{"id":"c-richest-man-babylon","title":"The Richest Man in Babylon","titleNl":"De rijkste man van Babylon","author":"George S. Clason","year":1926,"topic":"Geld","summary":"In parabels die zich afspelen in het oude Babylon geeft Clason tijdloze geldlessen. De kern: spaar een vast deel van je inkomen, laat het voor je werken en bescherm het.","ideas":[["Een deel van wat je verdient is van jou","De belangrijkste les van de rijkste man van Babylon, Arkad: een deel van alles wat je verdient, moet je zelf houden. Clason noemt minstens een tiende. Wie alles uitgeeft wat hij verdient, wordt nooit rijk, hoe hoog zijn inkomen ook is.","Zet automatisch minstens tien procent van je inkomen apart op het moment dat je salaris binnenkomt."],["Beheers je uitgaven","Uitgaven groeien vanzelf mee met het inkomen. Maak daarom een budget en onderscheid noodzakelijke uitgaven van wensen. Leef van wat er overblijft na het sparen, niet andersom. Volgens Clason kun je meestal met minder dan je denkt.","Maak een overzicht van je vaste lasten en wensen, en kijk welke wens je kunt schrappen."],["Laat je geld werken","Gespaard geld moet zelf weer geld opleveren. Clason beschrijft het als werknemers: elke munt gaat voor je aan het werk en brengt nieuwe munten mee. Die op hun beurt ook weer werken. Zo groeit vermogen door rente op rente.","Laat je spaargeld werken: welk deel kan op lange termijn renderen in plaats van op een spaarrekening te staan?"],["Bescherm je kapitaal","Verlies niet wat je gespaard hebt aan risicovolle of ondoordachte investeringen. In een van de verhalen geeft een personage zijn spaargeld aan een steenbakker om juwelen te kopen; hij wordt bedrogen. Vraag advies aan mensen die verstand hebben van waar je in investeert.","Vraag bij een investering advies aan iemand met echte kennis, niet aan een enthousiaste kennis."],["Maak van je huis een investering","Clason adviseert om een eigen woning te bezitten. Huur is een terugkerende kostenpost, terwijl een eigen huis je op termijn zekerheid en waarde geeft. Het wordt onderdeel van je vermogen.","Bekijk of een eigen woning bij jouw situatie past, en wat je nu aan woonlasten kwijt bent."],["Zorg voor de toekomst","Leg voorzieningen aan voor je oude dag en voor je gezin, zodat zij niet in de problemen komen als je wegvalt. Clason ziet dit als verantwoordelijkheid, niet alleen als slimme financiële keuze.","Controleer of je verzekeringen en pensioen goed geregeld zijn voor jezelf en je gezin."],["Vergroot je verdienvermogen","Blijf leren en word beter in je werk. Wie meer kennis en vaardigheden heeft, verdient meer. Clason legt ook de nadruk op betrouwbaarheid: schulden afbetalen, je woord houden en hard werken bouwen een reputatie op die kansen oplevert.","Kies één vaardigheid om dit jaar te verbeteren die je inkomen kan verhogen."]]},{"id":"c-teach-rich","title":"I Will Teach You to Be Rich","titleNl":"I Will Teach You to Be Rich","author":"Ramit Sethi","year":2009,"topic":"Geld","summary":"Sethi geeft een praktisch programma voor geldzaken, oorspronkelijk gericht op jonge Amerikanen. Kern: automatiseer je financiën, beleg eenvoudig en geef ruim uit aan wat je echt belangrijk vindt.","ideas":[["Een rijk leven is persoonlijk","Rijk zijn betekent voor Sethi niet zuinig zijn op alles, maar ruim uitgeven aan wat je echt waardeert en meedogenloos besparen op wat je niet belangrijk vindt. Bepaal wat jouw rijke leven is. Voor de een is dat reizen, voor de ander lekker eten.","Schrijf op waar jij graag ruim geld aan uitgeeft en waar je makkelijk op kunt besparen."],["Focus op grote winsten","Veel geldadvies gaat over kleine dingen zoals koffie to go. Sethi vindt dat zonde van je aandacht. Grote winsten zitten in je salaris onderhandelen, automatisch beleggen, de juiste rekeningen kiezen en dure schulden aflossen. Die leveren veel meer op.","Kies één grote winst: onderhandelen over salaris, hoge kosten verlagen of automatisch beleggen."],["Een bewust uitgavenplan","In plaats van een strak budget adviseert Sethi een bewust uitgavenplan: een deel voor vaste lasten, een deel voor beleggen, een deel voor sparen voor doelen en de rest vrij te besteden. Zo weet je wat je kunt uitgeven zonder schuldgevoel.","Verdeel je inkomen in vaste lasten, beleggen, sparen voor doelen en vrij besteedbaar."],["Automatiseer alles","Zet automatische overboekingen op, direct na je salaris: naar beleggingen, spaardoelen en vaste lasten. Zo hoef je niet elke maand te kiezen. Sethi noemt dit het belangrijkste: een systeem dat werkt zonder dat je er veel tijd aan besteedt.","Zet vandaag één automatische overboeking op, direct na je salaris."],["Beleg eenvoudig","De meeste mensen hebben geen expert nodig om te beleggen. Sethi adviseert brede, goedkope indexfondsen voor de lange termijn, in plaats van losse aandelen of markttiming. Kosten en uitstel kosten je meer dan je denkt.","Kijk naar de kosten van je beleggingen. Kun je overstappen naar een breed, goedkoop fonds?"],["Begin, ook onvolmaakt","Uitstel is de grootste vijand. Sethi stelt dat het beter is om nu te beginnen met een redelijk plan dan te wachten op het perfecte plan. Een paar uur per week gedurende een paar weken is genoeg om de basis te leggen.","Zet deze week één kleine, onvolmaakte stap in plaats van te wachten op het perfecte plan."],["Verdien meer","Besparen heeft een grens, verdienen niet. Sethi adviseert om te onderhandelen over je salaris, je vaardigheden te ontwikkelen en eventueel iets ernaast te doen. Ook hier gaat het om grote stappen die direct veel verschil maken.","Bereid een gesprek over je salaris voor met concrete resultaten die je hebt behaald."]]},{"id":"c-millionaire-next-door","title":"The Millionaire Next Door","titleNl":"De miljonair hiernaast","author":"Thomas J. Stanley & William D. Danko","year":1996,"topic":"Geld","summary":"Op basis van onderzoek onder Amerikaanse miljonairs laten Stanley en Danko zien dat veel rijke mensen er niet rijk uitzien. Ze leven zuinig en bouwen vermogen op door discipline.","ideas":[["Rijk zien is niet rijk zijn","Mensen met dure auto's en grote huizen zijn vaak niet de echt rijken. Veel van hun inkomen gaat op aan uitgaven. De werkelijke miljonairs wonen vaak in gewone wijken, rijden in gebruikte auto's en vallen niet op. De auteurs noemen dat het verschil tussen inkomen en vermogen.","Kijk eens anders naar mensen om je heen: zegt hun levensstijl echt iets over hun vermogen?"],["Een eenvoudige formule","De auteurs geven een vuistregel voor wat je vermogen zou moeten zijn: je leeftijd maal je jaarinkomen, gedeeld door tien. Wie ver daarboven zit, noemen ze een goede vermogensopbouwer; wie ver eronder zit, een slechte. Het gaat erom hoe goed je je inkomen omzet in vermogen.","Reken je eigen verwachte vermogen uit met de formule, en zie het als richtpunt, niet als oordeel."],["Leef onder je stand","Het belangrijkste kenmerk van de miljonairs is dat ze leven onder hun stand. Ze geven minder uit dan ze zich kunnen veroorloven. Ze maken budgetten, weten wat ze uitgeven en kopen minder statusspullen.","Kies één uitgavenpost waarbij je bewust onder je stand leeft."],["Tijd en energie voor vermogen","Miljonairs besteden veel tijd aan het plannen en beheren van hun financiën. Wie veel uitgeeft, besteedt die tijd vaak aan consumeren. Volgens de auteurs is het plannen van je financiën een van de sterkste voorspellers van vermogen.","Plan elke maand een vast uur om naar je financiën te kijken."],["Status is duur","Wie wil laten zien dat hij geslaagd is, moet veel uitgeven aan huis, auto en kleding. Daardoor blijft er weinig over om te sparen. De auteurs zien dat bij veel hoge inkomens, zoals artsen en advocaten, het vermogen tegenvalt door die levensstijl.","Vraag je bij je volgende grote aankoop af: koop ik dit voor mezelf of voor de buitenwereld?"],["Geen economische afhankelijkheid voor kinderen","Veel rijke ouders geven hun volwassen kinderen regelmatig geld. Volgens het onderzoek bouwen die kinderen daardoor minder vermogen op dan hun broers of zussen die het zelf moesten doen. De auteurs pleiten voor zelfstandigheid in plaats van financiële afhankelijkheid.","Als je kinderen hebt: hoe help je ze zelfstandig te worden, in plaats van afhankelijk?"],["Kansen herkennen","Veel miljonairs zijn ondernemers, vaak in gewone sectoren. Ze zagen kansen en bouwden langzaam op. Het boek benadrukt dat geen glamoureuze route nodig is: discipline, sparen en geduld leveren op de lange termijn veel op.","Kijk naar je eigen werk: welke gewone kans zou je kunnen uitbouwen?"]]},{"id":"c-bogle","title":"The Little Book of Common Sense Investing","titleNl":"Het kleine boek van verstandig beleggen","author":"John C. Bogle","year":2007,"topic":"Geld","summary":"John Bogle, oprichter van Vanguard en grondlegger van het indexfonds voor particulieren, betoogt dat de meeste beleggers het best af zijn met een goedkoop, breed gespreid indexfonds dat ze lang vasthouden.","ideas":[["De markt als geheel","Bedrijven als geheel verdienen geld en groeien. Beleggers als groep krijgen samen het rendement van de markt, vóór kosten. Daarna betalen ze kosten. Daarom presteert de gemiddelde belegger na kosten slechter dan de markt. Dat noemt Bogle de rekenkunde van beleggen.","Bedenk dat het gemiddelde rendement van alle beleggers samen gelijk is aan de markt, min kosten."],["Kosten tellen zwaar","Fondskosten, transactiekosten en belastingen lijken klein, maar vreten op de lange termijn een groot deel van je rendement op. Door rente op rente groeit dat verschil enorm. Een fonds met lage kosten heeft dus een structureel voordeel.","Zoek de totale kosten van je beleggingen op en reken uit wat ze je over twintig jaar kosten."],["Verslaan van de markt is moeilijk","De meeste actief beheerde fondsen presteren over lange perioden slechter dan de index. En de fondsen die het een tijdje goed doen, houden dat zelden vol. Bogle concludeert dat het zoeken naar de winnende beheerder een verliezersspel is.","Kijk of je fondsen de afgelopen tien jaar beter deden dan hun index, na kosten."],["Koop de hooiberg","Zoek niet naar de naald in de hooiberg, maar koop de hele hooiberg. Met een breed indexfonds bezit je een klein deel van alle bedrijven in een markt. Je krijgt dan het marktrendement, met lage kosten en brede spreiding.","Overweeg een breed gespreid indexfonds als basis van je portefeuille."],["Laat je niet meeslepen","Beleggers kopen vaak als de markt hoog staat en verkopen als die laag staat, omdat ze emoties volgen. Daardoor halen ze een lager rendement dan de fondsen waarin ze beleggen. Bogle adviseert om vast te houden en niet te handelen op nieuws.","Spreek met jezelf af dat je bij een koersdaling niet verkoopt, en schrijf dat op."],["Pas op met trends","Nieuwe, populaire fondsen en hippe sectoren trekken veel geld aan, vaak op het moment dat ze al duur zijn. Bogle waarschuwt voor modegrillen en voor ETF's die aanzetten tot veel handelen. Saai en goedkoop werkt beter.","Vraag je bij een populair beleggingsthema af: koop ik dit omdat het al hard is gestegen?"],["Spreiding naar leeftijd","Bogle adviseert een mix van aandelen en obligaties die past bij je leeftijd en risicobereidheid. Een vuistregel die hij noemt: een percentage obligaties gelijk aan je leeftijd. Hoe ouder, hoe meer stabiliteit. Pas de mix aan je eigen situatie aan.","Kijk of de verhouding tussen aandelen en obligaties bij je leeftijd en risicobereidheid past."]]},{"id":"c-die-with-zero","title":"Die with Zero","titleNl":"Die with Zero","author":"Bill Perkins","year":2020,"topic":"Geld","summary":"Hedgefondsbelegger Bill Perkins stelt dat veel mensen te lang sparen en te weinig leven. Het doel van geld is ervaringen, op het juiste moment in je leven.","ideas":[["Optimaliseer je leven, niet je geld","Perkins stelt dat het doel van geld verdienen is om er een rijk leven mee te leiden. Wie sterft met veel ongebruikt geld, heeft levensuren gewerkt voor niets. Hij pleit ervoor om bewust te plannen hoe je je vermogen in je leven gebruikt.","Vraag je af: waarvoor spaar ik eigenlijk, en wanneer ga ik dat geld gebruiken?"],["Ervaringen zijn het doel","Je leven is uiteindelijk de som van je ervaringen. Investeer daarom in ervaringen die bij jou passen. Ervaringen leveren ook later nog plezier op, via herinneringen. Perkins noemt dat het herinneringsdividend.","Plan dit jaar één ervaring waar je over tien jaar nog met plezier aan terugdenkt."],["Alles heeft zijn tijd","Sommige ervaringen kun je alleen op bepaalde leeftijden goed doen. Backpacken door Europa is op je twintigste anders dan op je zeventigste. Perkins adviseert je leven op te delen in tijdvakken en per periode te bedenken wat je wilt doen.","Verdeel je leven in periodes van vijf of tien jaar en schrijf per periode op wat je wilt meemaken."],["Gezondheid, tijd en geld","Je hebt gezondheid, tijd en geld nodig voor ervaringen. In je jeugd heb je tijd en gezondheid maar weinig geld; later geld maar minder gezondheid. Gebruik geld om tijd te kopen als je nog gezond bent.","Welke ervaring kun je nu nog makkelijk doen, maar over tien jaar niet meer?"],["Geef bij leven","Erfenissen komen vaak als kinderen al rond de vijftig zijn, wanneer het geld minder verschil maakt. Perkins adviseert om eerder te geven, als het meer impact heeft. Hetzelfde geldt voor goede doelen.","Denk na of je iemand nu al kunt helpen, in plaats van het geld later na te laten."],["Plan je uitgaven","Perkins pleit voor een plan om je vermogen geleidelijk op te maken. Bij dalende gezondheid neemt je vermogen om dingen te ondernemen af. Hij noemt producten zoals een lijfrente om je inkomen tot je dood te garanderen, zodat je niet uit angst hoeft te blijven sparen.","Maak een globaal plan voor hoe je je vermogen in de loop van je leven gaat gebruiken."],["Waag het","Wie jong is, kan grotere risico's nemen, omdat de gevolgen van falen kleiner zijn. Perkins moedigt aan om dromen niet uit te stellen tot je pensioen. De grootste fout is volgens hem niet te veel uitgeven, maar te lang wachten met leven.","Welke droom stel je uit tot later? Wat is de kleinste stap die je nu kunt zetten?"]]},{"id":"c-intelligent-investor","title":"The Intelligent Investor","titleNl":"De intelligente belegger","author":"Benjamin Graham","year":1949,"topic":"Geld","summary":"Benjamin Graham, de leermeester van Warren Buffett, beschrijft de basis van waardebeleggen. Hij leert je onderscheid maken tussen beleggen en speculeren en kalm blijven als de markt schommelt.","ideas":[["Beleggen of speculeren","Volgens Graham is een belegging een handeling die na grondige analyse veiligheid van het kapitaal en een redelijk rendement belooft. Alles wat daar niet aan voldoet, is speculatie. Speculeren is niet verboden, maar moet je bewust en met een beperkt deel van je geld doen.","Kijk naar je beleggingen: welk deel is beleggen en welk deel eigenlijk speculatie?"],["Meneer de Markt","Graham vergelijkt de beurs met een zakenpartner, Meneer de Markt, die elke dag een prijs noemt. Soms is hij euforisch en vraagt te veel, soms somber en biedt te weinig. Je hoeft niet op hem te reageren; je kunt zijn stemmingen gebruiken om goedkoop te kopen of duur te verkopen.","Zie een koersdaling als een aanbieding van Meneer de Markt, niet als een signaal om te verkopen."],["Veiligheidsmarge","Koop alleen als de prijs ruim onder de geschatte waarde ligt. Dat verschil is je veiligheidsmarge: een buffer tegen fouten in je analyse en tegen pech. Graham noemt dit de kern van verstandig beleggen.","Vraag je bij een aankoop af: hoeveel ruimte is er voor fouten in mijn inschatting?"],["Defensief of ondernemend","Graham onderscheidt twee soorten beleggers. De defensieve belegger wil weinig tijd en risico, en houdt een eenvoudige, gespreide portefeuille aan. De ondernemende belegger besteedt veel tijd aan onderzoek om betere kansen te vinden. Beide kunnen goed werken, als je weet welke je bent.","Bepaal of je een defensieve of ondernemende belegger bent, en richt je portefeuille daarop in."],["Aandelen en obligaties","Graham adviseert defensieve beleggers om hun vermogen te verdelen over aandelen en obligaties, ergens tussen een kwart en driekwart in aandelen. Pas de verhouding aan als de markt duur of goedkoop is, maar ga niet naar de uitersten.","Stel een vaste verhouding vast tussen aandelen en obligaties en herbalanceer één keer per jaar."],["Je grootste vijand ben jezelf","Volgens Graham is het grootste probleem van de belegger vaak zijn eigen gedrag. Hebzucht en angst leiden tot kopen op hoge koersen en verkopen op lage. Discipline, geduld en onafhankelijk denken zijn daarom belangrijker dan intelligentie.","Schrijf je beleggingsregels op en lees ze terug als de markt hard daalt of stijgt."],["Kijk naar het bedrijf","Een aandeel is een stukje van een bedrijf, geen lot in een loterij. Kijk daarom naar de omvang, financiële gezondheid, winstgeschiedenis en dividend van het bedrijf. Pas op voor populaire groeiaandelen met hoge verwachtingen; die zijn vaak te duur.","Kijk bij een aandeel naar het bedrijf: verdient het geld, en is de prijs redelijk?"]]},{"id":"c-spark","title":"Spark","titleNl":"Spark: hoe beweging je hersenen verandert","author":"John J. Ratey & Eric Hagerman","year":2008,"topic":"Gezondheid","summary":"Psychiater John Ratey legt uit hoe lichaamsbeweging het brein verandert. Beweging verbetert leren, stemming en concentratie en beschermt tegen veroudering van de hersenen.","ideas":[["Beweging is voor je brein","Wij zien sport vooral als iets voor het lichaam. Ratey stelt dat de grootste winst in het brein zit. Beweging verbetert het leervermogen, vermindert stress en angst en helpt bij concentratie. Ons brein is ontstaan in een lichaam dat veel moest bewegen.","Plan een wandeling of korte workout vlak voor een taak waarbij je moet leren of nadenken."],["De schoolles van Naperville","Ratey beschrijft een school in Naperville, Illinois, waar gymles werd omgevormd tot dagelijkse conditietraining met hartslagmeters. De leerlingen werden fitter en scoorden ook beter op toetsen. Voor Ratey is dit een praktijkvoorbeeld van wat beweging met leren doet.","Voeg tien minuten stevig bewegen toe aan het begin van je werkdag en merk het effect op je focus."],["Kunstmest voor het brein","Bij beweging maakt het lichaam BDNF aan, een eiwit dat Ratey kunstmest voor het brein noemt. Het helpt hersencellen te groeien en verbindingen te maken. Daardoor kun je na het bewegen beter leren en onthouden.","Plan beweging vlak voordat je iets nieuws gaat leren."],["Beweging tegen stress en angst","Beweging traint je lichaam om met stress om te gaan, en dempt de reactie op stressoren. Bij angst helpt het ook: je ervaart lichamelijke signalen zoals een snelle hartslag in een veilige context. Daardoor worden ze minder bedreigend.","Ga bij stress even stevig lopen of een paar trappen op en af, in plaats van alleen te blijven zitten."],["Beweging en stemming","Volgens Ratey helpt regelmatige beweging bij het verminderen van depressieve klachten. Het beïnvloedt stoffen als serotonine, dopamine en noradrenaline, waar ook antidepressiva op aangrijpen. Hij ziet beweging als aanvulling op behandeling, niet als vervanging zonder overleg.","Maak bewegen een vast onderdeel van je week, als aanvulling op andere zorg als je somber bent."],["Aandacht en verslaving","Beweging verbetert de aandacht en kan helpen bij ADHD-klachten, door effecten op dopamine en noradrenaline. Ratey beschrijft ook hoe beweging kan helpen bij het weerstaan van verslavingen, omdat het het beloningssysteem op een gezonde manier activeert.","Kies een bewegingsvorm die ook coördinatie vraagt, zoals dansen, tennis of klimmen."],["Wat te doen","Ratey adviseert de meeste dagen van de week aerobe beweging, met een paar keer per week intensievere inspanning. Combineer het met activiteiten die coördinatie en concentratie vragen, zoals dansen of balsporten. Die prikkelen het brein extra.","Plan de meeste dagen van de week aerobe beweging, met af en toe een intensiever moment."]]},{"id":"c-blue-zones","title":"The Blue Zones","titleNl":"De blauwe zones","author":"Dan Buettner","year":2008,"topic":"Gezondheid","summary":"Journalist Dan Buettner bezocht plekken in de wereld waar opvallend veel mensen heel oud worden. Hij beschrijft wat hun leefstijl gemeen heeft.","ideas":[["De blauwe zones","Buettner beschrijft vijf gebieden waar mensen opvallend vaak gezond oud worden: Sardinië in Italië, Okinawa in Japan, Loma Linda in Californië, het schiereiland Nicoya in Costa Rica en het Griekse eiland Ikaria. Ze liggen ver uit elkaar maar delen leefgewoonten.","Welke van de gewoonten uit de blauwe zones past het makkelijkst in jouw leven?"],["Beweeg natuurlijk","Honderdjarigen in deze gebieden sporten zelden in een sportschool. Ze bewegen de hele dag door: tuinieren, lopen, huishoudelijk werk. Hun omgeving zet ze aan tot bewegen zonder dat ze erover hoeven na te denken.","Richt je dag zo in dat je meer beweegt zonder te sporten: lopen, fietsen, trappen."],["Eet tot je bijna vol bent","Op Okinawa kennen ouderen het gezegde hara hachi bu: stop met eten als je voor tachtig procent vol bent. Ze eten kleinere porties en de laatste maaltijd vaak vroeg op de avond. Zo voorkomen ze overeten zonder diëten.","Stop met eten als je bijna vol bent, en gebruik een kleiner bord."],["Vooral plantaardig","De voeding in de blauwe zones is overwegend plantaardig, met veel bonen, groenten en volkoren producten. Vlees wordt beperkt gegeten, vaak een paar keer per maand. In enkele gebieden drinken mensen met mate wijn, meestal bij een maaltijd met anderen.","Eet deze week een paar keer een maaltijd met bonen of peulvruchten in plaats van vlees."],["Een reden om op te staan","Mensen in de blauwe zones hebben een duidelijk levensdoel. Op Okinawa heet dat ikigai, in Nicoya plan de vida. Weten waarom je 's ochtends opstaat, hangt volgens Buettner samen met een langer leven.","Schrijf op waarom je 's ochtends opstaat. Wat is jouw ikigai of levensplan?"],["Rust en vertragen","Iedere gemeenschap heeft rituelen om stress te verminderen: een dutje, gebed, voorouders gedenken of een vast happy hour met vrienden. Chronische stress verkort het leven; deze routines helpen om dagelijks te ontspannen.","Kies een dagelijks moment van rust: een dutje, een wandeling, een paar minuten stilte."],["Erbij horen","Familie staat centraal: ouders en grootouders wonen vaak dichtbij en partners blijven lang samen. Mensen maken deel uit van een geloofsgemeenschap of hechte vriendenkring. Op Okinawa vormen mensen een moai, een groep vrienden die elkaar levenslang steunt.","Plan regelmatig tijd met familie of een vaste vriendengroep."]]},{"id":"c-body-keeps-score","title":"The Body Keeps the Score","titleNl":"Traumasporen","author":"Bessel van der Kolk","year":2014,"topic":"Gezondheid","summary":"Psychiater Bessel van der Kolk beschrijft hoe trauma het brein en lichaam verandert, en welke behandelingen kunnen helpen bij herstel. Het boek is invloedrijk; sommige behandelclaims worden door vakgenoten bediscussieerd.","ideas":[["Trauma zit in het lichaam","Van der Kolk stelt dat trauma niet alleen een herinnering is, maar iets dat het lichaam blijft beleven. Mensen met trauma reageren op triggers alsof het gevaar nog steeds aanwezig is. Hun lichaam blijft in een staat van alarm.","Merk op hoe stress zich in jouw lichaam laat voelen: in je buik, schouders of ademhaling?"],["Het brein onder trauma","Bij traumatische herinneringen wordt het alarmsysteem van het brein sterk actief, terwijl delen die nodig zijn voor taal en tijdsbesef minder actief worden. Daarom kunnen mensen hun ervaring soms moeilijk in woorden vatten, en voelt het alsof het nu gebeurt.","Als iets uit het verleden heftig blijft voelen, weet dan dat dat een bekende reactie van het brein is."],["Losgekoppeld van het lichaam","Veel mensen met trauma raken vervreemd van hun lichaam. Ze voelen weinig of worden overspoeld door sensaties. Van der Kolk noemt het vermogen om je lichaamssignalen te voelen, interoceptie, een belangrijke stap in herstel.","Neem een paar keer per dag even de tijd om te voelen wat er in je lichaam gebeurt."],["Trauma in de jeugd","Van der Kolk besteedt veel aandacht aan trauma in de kindertijd, zoals verwaarlozing of instabiele opvoeding. Hij verwijst naar onderzoek naar ingrijpende jeugdervaringen, dat laat zien dat zulke ervaringen samenhangen met lichamelijke en psychische problemen op latere leeftijd.","Kijk met mildheid naar jezelf als je merkt dat oude ervaringen je reacties nog beïnvloeden."],["Praten is niet altijd genoeg","Omdat trauma diep in het lichaam zit, helpt praten alleen vaak niet voldoende. Van der Kolk beschrijft behandelingen die het lichaam betrekken, zoals EMDR, yoga, neurofeedback en theater. Hij benadrukt dat herstel per persoon anders verloopt.","Overweeg naast praten ook een lichaamsgerichte vorm van ontspanning, zoals yoga of ademwerk."],["Veiligheid en verbinding","Herstel begint met je veilig voelen, bij jezelf en bij anderen. Relaties waarin je gezien en gehoord wordt, helpen het zenuwstelsel tot rust te komen. Van der Kolk ziet sociale steun als een van de krachtigste beschermers tegen de gevolgen van trauma.","Zoek contact met mensen bij wie je je veilig voelt, vooral in moeilijke periodes."],["Weer eigenaar worden","Het doel van behandeling is dat je weer eigenaar wordt van je lichaam en geest. Dat betekent dat je je gevoelens kunt verdragen, rustig kunt worden en kunt leven in het heden. Van der Kolk roept op om professionele hulp te zoeken als trauma je leven beheerst.","Beheerst iets uit het verleden je leven? Zoek dan hulp bij een huisarts of therapeut."]]},{"id":"c-in-defense-of-food","title":"In Defense of Food","titleNl":"Een pleidooi voor echt eten","author":"Michael Pollan","year":2008,"topic":"Gezondheid","summary":"Journalist Michael Pollan bekritiseert de focus op losse voedingsstoffen en pleit voor terug naar echt eten. Zijn advies past in zeven woorden: eet voedsel, niet te veel, vooral planten.","ideas":[["Eet voedsel, niet te veel, vooral planten","Pollan vat zijn advies samen in zeven woorden. Eet echt voedsel, geen sterk bewerkte producten. Eet niet te veel. En eet vooral planten. Het klinkt eenvoudig, maar volgens Pollan is dat precies wat we zijn kwijtgeraakt.","Kijk naar je boodschappen van deze week: welk deel is echt eten, en welk deel sterk bewerkt?"],["Het tijdperk van voedingsstoffen","Pollan beschrijft nutritionisme: het idee dat voedsel vooral de som is van voedingsstoffen zoals vetten, koolhydraten en vitaminen. Daardoor kijken we naar etiketten in plaats van naar eten. Elke paar jaar is een andere stof de vijand of de redder.","Laat je minder leiden door losse voedingsstoffen op het etiket, en kijk meer naar het product zelf."],["Het westerse dieet","Volgens Pollan hangt het westerse eetpatroon, met veel geraffineerde producten, suiker en weinig groenten, samen met welvaartsziekten. Opvallend is dat mensen met heel verschillende traditionele diëten gezond kunnen zijn, zolang ze het westerse dieet vermijden.","Vervang deze week één bewerkt product door een onbewerkte variant."],["Herken echt eten","Pollan geeft vuistregels: eet niets wat je overgrootmoeder niet als eten zou herkennen. Vermijd producten met veel ingrediënten die je niet kent of kunt uitspreken. Wees voorzichtig met producten die gezondheidsclaims op de verpakking hebben.","Kies producten met weinig ingrediënten die je herkent."],["Vooral planten","Eet veel groenten, fruit en peulvruchten, en zie vlees eerder als bijgerecht. Pollan raadt ook aan om gevarieerd te eten en aandacht te hebben voor de kwaliteit van dierlijke producten. Hoe dieren zijn gevoed, beïnvloedt ook de voedingswaarde.","Maak groenten het hoofdbestanddeel van je bord, en vlees het bijgerecht."],["Niet te veel","Eet langzamer, aan tafel en bij voorkeur met anderen. Stop voordat je vol zit en vermijd eten terwijl je iets anders doet. Pollan wijst op culturen waar maaltijden een sociaal ritueel zijn en mensen daardoor minder overeten.","Eet je volgende maaltijd aan tafel, zonder scherm, en neem er de tijd voor."],["Kook zelf","Wie zelf kookt, eet meer echt eten en weet wat erin zit. Pollan moedigt aan om zelf groenten te kweken, te koken en eten te kopen bij boerenmarkten. Zo kom je dichter bij je voedsel en wordt eten weer iets om van te genieten.","Kook deze week een paar keer extra zelf, met verse ingrediënten."]]},{"id":"c-born-to-run","title":"Born to Run","titleNl":"Born to Run","author":"Christopher McDougall","year":2009,"topic":"Gezondheid","summary":"Journalist Christopher McDougall onderzoekt waarom hij steeds geblesseerd raakte, en vindt in Mexico de Tarahumara, een volk van ultralopers. Het boek maakte barefoot running populair; de blessureclaims zijn wetenschappelijk omstreden.","ideas":[["Waarom doet lopen pijn?","McDougall, zelf een geblesseerde hardloper, vraagt zich af waarom zoveel lopers blessures krijgen. Artsen adviseren hem te stoppen. Hij gaat op zoek naar mensen die juist hun hele leven pijnloos lopen, en komt uit bij de Tarahumara in de Copper Canyons.","Merk op wat je zelf ervaart bij het lopen: waar voel je spanning of ongemak?"],["De Tarahumara","De Tarahumara, ook Rarámuri genoemd, lopen enorme afstanden over ruig terrein op eenvoudige sandalen. Ze lopen met plezier, op hoge leeftijd en zonder high-tech schoenen. McDougall beschrijft hen als een levend bewijs dat mensen gemaakt zijn om te lopen.","Kijk naar je eigen omgeving: welke route kun je lopen over zachte, gevarieerde ondergrond?"],["Gemaakt om te rennen","McDougall bespreekt de theorie van onder anderen Daniel Lieberman dat mensen zich hebben ontwikkeld als duurlopers. We kunnen goed zweten, hebben een veerkrachtige achillespees en kunnen dieren uitputten door ze lang te achtervolgen. Lopen zit in onze evolutie.","Herinner jezelf dat lopen een natuurlijke beweging is, en bouw rustig op."],["Kritiek op de loopschoen","Volgens McDougall hebben zwaar gedempte loopschoenen ervoor gezorgd dat we onnatuurlijk landen, op de hiel. Hij pleit voor minimalistisch of blootsvoets lopen. Let op: later onderzoek bevestigt niet duidelijk dat minimalistische schoenen blessures voorkomen, en een te snelle overstap kan juist blessures geven.","Wil je minimalistische schoenen proberen? Bouw dat heel geleidelijk op en luister naar je lichaam."],["Licht en soepel lopen","De loopstijl die McDougall beschrijft is licht, met korte passen, landen op de middenvoet en een rechte houding. Zijn coach Caballo Blanco vat het samen als makkelijk, licht, soepel en snel: in die volgorde.","Probeer eens met kortere, lichtere passen te lopen."],["Loop met plezier","De beste ultralopers in het boek lopen niet uit verbetenheid, maar uit plezier. Ze beschouwen lopen als spel en als gemeenschappelijke ervaring. McDougall suggereert dat die houding meer bijdraagt aan volhouden dan prestatiedruk.","Laat het tempo los bij je volgende loopje, en loop vooral voor het plezier."],["De grote race","Het boek bouwt op naar een ultrarace in de Copper Canyons tussen de Tarahumara en enkele Amerikaanse toplopers, onder wie Scott Jurek. Meer dan een wedstrijd wordt het een viering van lopen, vriendschap en de eenvoud van een oud menselijk talent.","Zoek een loopmaatje of groep om samen te lopen."]]},{"id":"c-burnout-nagoski","title":"Burnout: The Secret to Unlocking the Stress Cycle","titleNl":"Burn-out: het geheim van de stresscyclus","author":"Emily Nagoski & Amelia Nagoski","year":2019,"topic":"Energie","summary":"De tweelingzussen Emily en Amelia Nagoski leggen uit waarom zoveel mensen, vooral vrouwen, opgebrand raken. De sleutel is om de stresscyclus in je lichaam echt af te ronden.","ideas":[["Stressoren en stress","De auteurs maken onderscheid tussen stressoren, de dingen die stress veroorzaken, en stress zelf, de reactie in je lichaam. Ook als je een stressor oplost, bijvoorbeeld een deadline haalt, blijft de stress in je lichaam aanwezig. Die moet je apart aanpakken.","Schrijf op wat je stressoren zijn, en wat je doet om de stress zelf te verwerken."],["Rond de cyclus af","Stress is bedoeld om een begin, midden en einde te hebben, zoals vluchten voor een roofdier en daarna veilig zijn. In het moderne leven blijft die cyclus vaak hangen. De auteurs noemen manieren om haar af te ronden: bewegen, rustig ademen, lachen, een lange knuffel, huilen en creatieve expressie.","Kies vandaag één manier om je stresscyclus af te ronden: bewegen, ademen, lachen, huilen of een knuffel."],["Beweging is het belangrijkste","De meest effectieve manier om de stresscyclus af te ronden is lichamelijke activiteit. Je lichaam krijgt dan het signaal dat het gevaar voorbij is. Het hoeft niet intensief te zijn: wandelen, dansen of zelfs je spieren aanspannen en ontspannen helpt al.","Ga na een stressvolle dag twintig minuten wandelen of dansen."],["Zin als bron van kracht","Een gevoel van betekenis helpt om met moeilijke dingen om te gaan. Het kan komen uit ambitie, uit verbinding met iets groters of uit zorg voor anderen. Wie weet waarvoor hij het doet, houdt meer vol. Zin hoeft niet altijd plezierig te voelen.","Schrijf op wat jouw werk of leven zin geeft, ook als het zwaar is."],["Het menselijke-gever-syndroom","De auteurs beschrijven het idee dat sommige mensen, vaak vrouwen, verwacht worden altijd mooi, kalm, gul en beschikbaar voor anderen te zijn. Dat put uit. Het herkennen van die verwachting is een eerste stap om er afstand van te nemen.","Merk op wanneer je denkt dat je altijd beschikbaar en vriendelijk moet zijn. Wat zou er gebeuren als je dat loslaat?"],["Rust is geen luxe","Het brein heeft rust nodig om te functioneren; tijdens rust verwerkt het informatie en herstelt het. De auteurs stellen dat mensen veel meer rust nodig hebben dan ze nemen, inclusief voldoende slaap. Rust is daarom een voorwaarde, geen beloning.","Plan bewust rust in je week, en zie het als voorwaarde om goed te functioneren."],["Verbinding geneest","Mensen zijn niet gemaakt om alleen te functioneren. Steun van anderen, zelfs een kort gesprek of een vriendelijk moment, helpt het zenuwstelsel te kalmeren. De auteurs pleiten ervoor om bewust contact te zoeken en elkaar te helpen bij het afronden van de stresscyclus.","Bel of zie iemand bij wie je je op je gemak voelt."]]},{"id":"c-rest","title":"Rest","titleNl":"Rust","author":"Alex Soojung-Kim Pang","year":2016,"topic":"Energie","summary":"Pang stelt dat rust geen tegenstelling is van werk, maar een partner ervan. Hij laat zien hoe creatieve en succesvolle mensen bewust rustten en daardoor beter werkten.","ideas":[["Rust is een vaardigheid","We zien rust vaak als het ontbreken van werk. Pang stelt dat rust een actieve vaardigheid is die je kunt leren. Goed rusten maakt je creatiever en productiever, en is geen teken van luiheid.","Plan deze week bewust rust in je agenda, net zo serieus als een werkafspraak."],["Vier uur geconcentreerd werk","Pang beschrijft hoe veel beroemde wetenschappers en schrijvers, zoals Charles Darwin, ongeveer vier uur per dag geconcentreerd werkten. De rest van de dag wandelden ze, deden ze een dutje of correspondeerden ze. Ze waren daarmee juist heel productief.","Probeer een dag met vier uur geconcentreerd werk en de rest lichtere taken."],["Het ochtendritme","Veel creatieve mensen werkten 's ochtends, als hun hoofd fris was. Pang adviseert om je belangrijkste werk vroeg te doen. Een vast ritme maakt het makkelijker om dagelijks aan de slag te gaan zonder op inspiratie te wachten.","Doe je belangrijkste werk in de ochtend, voordat de dag je overneemt."],["Wandelen en dutten","Wandelen helpt het brein ideeën te verwerken en verbanden te leggen. Een kort dutje verbetert de alertheid en het geheugen. Pang beschrijft beide als vormen van rust die je bewust in je dag kunt inbouwen.","Plan een dagelijkse wandeling zonder telefoon, of een kort dutje."],["Stoppen op het goede moment","Ernest Hemingway stopte met schrijven als hij wist hoe het verder moest. Zo was het makkelijk om de volgende dag weer te beginnen, en werkte zijn onderbewuste ondertussen door. Pang noemt dit een slimme manier om momentum te behouden.","Stop morgen met werken op een punt waarop je weet hoe het verder moet."],["Diepe rust","Naast korte pauzes is er diepe rust: activiteiten die je volledig opnemen en je loskoppelen van werk. Denk aan sport, een veeleisende hobby of een sabbatical. Juist uitdagende activiteiten herstellen je vaak beter dan niets doen.","Kies een uitdagende hobby die je echt loskoppelt van werk."],["Slaap en lichaamsbeweging","Goede slaap en regelmatige beweging zijn de basis van rust. Pang beschrijft hoe beweging het brein scherper maakt en hoe slaap het geheugen en de creativiteit voedt. Wie hierop bezuinigt, verliest uiteindelijk meer tijd dan hij wint.","Kijk naar je slaap en beweging. Zijn die op orde voordat je meer werk aanneemt?"]]},{"id":"c-when","title":"When: The Scientific Secrets of Perfect Timing","titleNl":"Wanneer","author":"Daniel H. Pink","year":2018,"topic":"Energie","summary":"Pink laat zien dat timing veel uitmaakt. Op basis van onderzoek beschrijft hij hoe je stemming en prestaties door de dag heen schommelen en hoe je daar je planning op afstemt.","ideas":[["De dag heeft een patroon","Voor de meeste mensen verloopt de dag in drie fasen: een piek in de ochtend, een dip in de vroege middag en herstel in de late middag of avond. Pink baseert dit onder meer op onderzoek naar de stemming in miljoenen tweets en op studies in ziekenhuizen en scholen.","Houd een paar dagen bij wanneer je het scherpst en het slapst bent."],["Leeuwerik, uil of derde vogel","Je chronotype bepaalt het patroon. Ochtendmensen, leeuweriken, hebben hun piek vroeg. Avondmensen, uilen, later. De meeste mensen zitten ertussenin. Pink adviseert om je chronotype te bepalen aan de hand van je slaaptijden op vrije dagen.","Bepaal je chronotype: wanneer word je wakker op een vrije dag zonder wekker?"],["Plan op je piek","Doe analytisch werk dat focus vraagt tijdens je piek. Creatief werk gaat juist vaak beter tijdens het herstel, als je iets minder gefocust bent en meer verbanden ziet. Vermijd belangrijke beslissingen in de middagdip, wanneer mensen vaker fouten maken.","Plan je moeilijkste denkwerk op je piekmoment en creatief werk in je herstelfase."],["De kracht van pauzes","Korte pauzes herstellen je aandacht. Pink beschrijft een studie naar rechters die gunstiger beslisten na een pauze, al is dit onderzoek later bediscussieerd. Pauzes zijn het effectiefst als ze sociaal zijn, buiten, in beweging, en echt los van werk.","Neem een korte pauze buiten, in beweging of met iemand, in plaats van achter je scherm."],["Het slimme dutje","Een kort dutje van tien tot twintig minuten verbetert alertheid zonder dat je suf wakker wordt. Pink beschrijft de nappuccino: drink een kop koffie en ga direct liggen. De cafeïne begint te werken als je na twintig minuten wakker wordt.","Probeer een kort dutje van tien tot twintig minuten in de middagdip."],["Begin opnieuw","Momenten zoals een nieuw jaar, een verjaardag of het begin van de week voelen als een nieuw begin. Daardoor zijn mensen dan gemotiveerder om iets nieuws te starten. Pink noemt dit het verse-start-effect. Gebruik zulke momenten bewust.","Gebruik een nieuw begin, zoals maandag of de eerste van de maand, om iets nieuws te starten."],["Middens en eindes","Halverwege een project of het leven zakt de motivatie vaak in, maar een middelpunt kan ook een wekker zijn. En aan het einde willen we graag sterk afsluiten. Pink adviseert om tussendoelen te stellen en eindes bewust vorm te geven.","Stel een tussendoel halverwege je project, en plan een goed einde."]]},{"id":"c-miracle-morning","title":"The Miracle Morning","titleNl":"The Miracle Morning","author":"Hal Elrod","year":2012,"topic":"Energie","summary":"Na een ernstig auto-ongeluk en een financiële crisis ontwikkelde Hal Elrod een ochtendroutine van zes gewoonten. Hij stelt dat de manier waarop je je ochtend begint, de rest van je dag bepaalt.","ideas":[["Hoe je ochtend begint","Elrod stelt dat je dag wordt bepaald door de eerste uren. Wie opstaat met haast en stress, start reactief. Wie de ochtend gebruikt om aan zichzelf te werken, begint met energie en richting. Daarom plant hij bewust tijd voor zelfontwikkeling voordat de dag begint.","Merk op hoe je ochtend nu begint, en hoe dat de rest van je dag beïnvloedt."],["Van ongeluk tot routine","Elrod overleefde een frontale botsing met een dronken bestuurder en kreeg later te maken met financiële problemen. Op zoek naar een uitweg ontwikkelde hij een ochtendritueel waarin hij de gewoonten van succesvolle mensen combineerde. Dat werd de Miracle Morning.","Denk aan een moeilijke periode in je leven. Welke gewoonte zou je daarbij helpen?"],["De zes SAVERS","De routine bestaat uit zes onderdelen, samengevat als SAVERS. Silence: stilte, zoals meditatie of gebed. Affirmations: bevestigingen. Visualization: visualisatie. Exercise: beweging. Reading: lezen. Scribing: schrijven, zoals een dagboek. Elk onderdeel kan kort zijn.","Probeer morgen alle zes de SAVERS, elk één minuut."],["Begin klein","Je hoeft niet een uur eerder op te staan. Elrod beschrijft ook een versie van zes minuten: één minuut per onderdeel. Het gaat erom de gewoonte te vestigen. Daarna kun je de tijd uitbreiden.","Begin klein: kies één onderdeel dat je elke ochtend vijf minuten doet."],["Opstaan zonder snooze","Elrod geeft tips om makkelijker op te staan: bepaal de avond ervoor waarom je wilt opstaan, zet je wekker aan de andere kant van de kamer, poets meteen je tanden en drink een glas water. Zo verklein je de verleiding om terug te kruipen.","Zet je wekker aan de andere kant van de kamer en drink direct een glas water."],["Dertig dagen om te wennen","Elrod beschrijft dat een nieuwe gewoonte in fases ingeburgerd raakt: eerst ondraaglijk, dan ongemakkelijk, en ten slotte niet meer weg te denken. Hij adviseert de routine dertig dagen vol te houden voordat je beoordeelt of het werkt.","Houd je ochtendroutine dertig dagen vol voordat je beoordeelt of hij werkt."],["Bevestigingen met actie","Elrod waarschuwt voor vage positieve affirmaties. Zijn bevestigingen beschrijven wat je wilt bereiken, waarom het belangrijk is, wat je ervoor gaat doen en wanneer. Zo worden ze een plan in plaats van een wens.","Schrijf een bevestiging met wat je wilt, waarom, wat je gaat doen en wanneer."]]},{"id":"c-make-time","title":"Make Time","titleNl":"Make Time","author":"Jake Knapp & John Zeratsky","year":2018,"topic":"Energie","summary":"Twee voormalig ontwerpers bij Google beschrijven een eenvoudig dagelijks systeem om tijd en energie te maken voor wat belangrijk is. Het draait om vier stappen: highlight, laser, energize en reflect.","ideas":[["Twee krachten die je tijd stelen","De auteurs noemen twee krachten die je dag opslokken: de Busy Bandwagon, de cultuur van altijd druk zijn, en de Infinity Pools, apps en media die eindeloos content aanbieden. Wilskracht alleen helpt daar niet tegen; je moet je omgeving en standaardinstellingen veranderen.","Kijk naar je dag: welke apps of taken slokken tijd op zonder dat je het merkt?"],["Kies een highlight","Kies elke dag één highlight: een activiteit van zestig tot negentig minuten waar je aan het eind van de dag blij mee wilt zijn. Dat kan iets urgents zijn, iets dat voldoening geeft of iets dat plezier geeft. Plan het in je agenda en bescherm het.","Kies voor morgen één highlight en plan er tijd voor in je agenda."],["Laser: focus","Maak het moeilijk om afgeleid te raken. De auteurs geven tips zoals social media-apps van je telefoon verwijderen, uitloggen, je mail op vaste tijden bekijken en je telefoon in een andere kamer leggen. Het gaat om frictie toevoegen aan afleiding.","Verwijder één social-media-app van je telefoon voor een week."],["Energize: laad je batterij op","Je hebt energie nodig om je highlight goed te doen. De auteurs baseren hun tips op hoe mensen vroeger leefden: elke dag bewegen, echt eten, cafeïne slim timen, buiten zijn, mensen in het echt zien en goed slapen.","Plan een wandeling buiten of een maaltijd met echte ingrediënten."],["Cafeïne slim gebruiken","De auteurs adviseren om je eerste koffie niet direct na het opstaan te drinken, maar iets later, als je natuurlijke alertheid begint te dalen. Drink kleine hoeveelheden verspreid in de ochtend, en stop ruim voor het slapengaan.","Drink je eerste koffie iets later en stop met cafeïne ruim voor het slapen."],["Reflect: leer van je dag","Neem elke avond een paar minuten om terug te kijken. Heb je je highlight gedaan? Welke tactieken hielpen? Wat leidde je af? Zo pas je de methode aan op jezelf. De auteurs presenteren hun tips als experimenten, niet als regels.","Schrijf vanavond op: heb ik mijn highlight gedaan, wat hielp en wat leidde af?"],["Kies wat bij je past","Het boek bevat tientallen tactieken. Je hoeft ze niet allemaal te gebruiken. Probeer er een paar, kijk wat werkt en laat de rest. Het doel is niet productiever worden voor het werk, maar tijd maken voor wat jij belangrijk vindt.","Kies twee tactieken uit het boek en test ze een week."]]},{"id":"c-leaders-eat-last","title":"Leaders Eat Last","titleNl":"Leiders eten als laatste","author":"Simon Sinek","year":2014,"topic":"Leiderschap","summary":"Sinek legt uit waarom sommige teams elkaar door dik en dun steunen. Het antwoord ligt in een cirkel van veiligheid die leiders creëren door eerst voor hun mensen te zorgen.","ideas":[["Leiders eten als laatste","De titel komt uit het Amerikaanse marinierskorps, waar officieren als laatste eten zodat hun mensen eerst geholpen worden. Volgens Sinek is dat de essentie van leiderschap: je eigen belang opofferen voor dat van de groep.","Kijk naar je eigen gedrag als leider: wanneer zet je de belangen van je team voor die van jezelf?"],["De cirkel van veiligheid","In elke organisatie zijn er gevaren van buiten: concurrentie, economie, tegenslag. Een goede leider zorgt ervoor dat mensen binnen de organisatie zich veilig voelen voor elkaar. Binnen die cirkel van veiligheid durven ze samen te werken en risico's te nemen.","Vraag je team: wat maakt dat jullie je hier wel of niet veilig voelen?"],["Chemicaliën van gedrag","Sinek gebruikt vier stoffen in het lichaam om gedrag te verklaren. Endorfine en dopamine geven een gevoel van prestatie. Serotonine en oxytocine geven een gevoel van status, vertrouwen en verbondenheid. Organisaties die alleen op prestaties sturen, lopen het risico het vertrouwen kwijt te raken.","Kijk naar je team: wordt alleen prestatie beloond, of ook samenwerking en vertrouwen?"],["Abstractie is gevaarlijk","Als mensen voor leiders cijfers in een spreadsheet worden, verliezen leiders hun empathie. Sinek beschrijft hoe ontslagrondes om cijfers te halen het vertrouwen in een organisatie vernietigen. Hoe groter de afstand tussen leider en mensen, hoe makkelijker zulke beslissingen worden.","Ken je de mensen achter de cijfers? Plan een persoonlijk gesprek met iemand die je weinig spreekt."],["Mensen boven cijfers","Sinek noemt voorbeelden van bedrijven die in moeilijke tijden geen mensen ontsloegen, maar iedereen een deel van het verlies liet dragen. Medewerkers voelden zich daardoor beschermd en werden loyaler. Volgens Sinek leveren zulke keuzes op de lange termijn meer op.","Bedenk bij een moeilijke beslissing hoe die je mensen raakt, niet alleen de cijfers."],["Leiderschap is een keuze","Je hoeft geen formele positie te hebben om leider te zijn. Iedereen kan ervoor kiezen om voor anderen te zorgen, ze te beschermen en ze te laten groeien. Leiderschap is volgens Sinek een verantwoordelijkheid, geen rang.","Kies één moment deze week waarop je een collega helpt zonder dat het je taak is."],["Echt contact","Vertrouwen groeit door tijd en aandacht, niet door e-mails of beloningen. Sinek pleit voor persoonlijk contact, ook in een digitale wereld. Een leider die zijn mensen kent en echt aanwezig is, bouwt een team dat ook in zware tijden bij elkaar blijft.","Spreek iemand in persoon in plaats van via mail, en geef je volle aandacht."]]},{"id":"c-five-dysfunctions","title":"The Five Dysfunctions of a Team","titleNl":"De vijf frustraties van teamwork","author":"Patrick Lencioni","year":2002,"topic":"Leiderschap","summary":"In de vorm van een bedrijfsverhaal beschrijft Lencioni vijf problemen die teams verlammen. Ze bouwen op elkaar voort, met gebrek aan vertrouwen als fundament.","ideas":[["Een verhaal over een directieteam","Lencioni vertelt over Kathryn, een nieuwe CEO van een technologiebedrijf met een slecht functionerend directieteam. Ze ziet getalenteerde mensen die niet samenwerken. Via haar aanpak legt Lencioni zijn model uit van vijf teamproblemen, opgebouwd als een piramide.","Op welk niveau van de piramide zit jouw team nu het meest vast?"],["1. Gebrek aan vertrouwen","De basis van de piramide is gebrek aan vertrouwen. Lencioni bedoelt kwetsbaarheidsvertrouwen: durven toegeven dat je iets niet weet, een fout hebt gemaakt of hulp nodig hebt. Zonder dat vertrouwen houden mensen zich groot en verbergen ze zwaktes.","Deel in je team iets wat je niet weet of een fout die je maakte. Kijk wat het met het vertrouwen doet."],["2. Angst voor conflict","Zonder vertrouwen vermijden teams openlijke discussie. Ze kiezen voor kunstmatige harmonie. Daardoor worden belangrijke onderwerpen niet besproken, of gebeurt dat achter de schermen. Lencioni pleit voor gezond, inhoudelijk conflict over ideeën.","Benoem in een overleg een onderwerp waar iedereen omheen draait, en nodig uit tot open discussie."],["3. Gebrek aan betrokkenheid","Als mensen hun mening niet hebben kunnen geven, voelen ze zich niet echt verbonden aan besluiten. Ze knikken mee, maar doen niet voluit mee. Het doel is niet consensus, maar dat iedereen gehoord is en zich daarna achter het besluit schaart.","Vraag aan het eind van een overleg of iedereen gehoord is, en of iedereen achter het besluit staat."],["4. Vermijden van aanspreken","Teamleden die niet echt achter een besluit staan, spreken elkaar ook niet aan op gedrag dat ervan afwijkt. Lencioni stelt dat collega's elkaar moeten aanspreken, niet alleen de leidinggevende. Dat vraagt duidelijke afspraken over wat er van iedereen verwacht wordt.","Spreek met je team af hoe jullie elkaar aanspreken als iemand afwijkt van afspraken."],["5. Geen aandacht voor resultaten","De top van de piramide: mensen kijken naar hun eigen afdeling, status of ego in plaats van naar de gezamenlijke resultaten. Een sterk team zet het teamdoel boven individuele belangen. Kathryn maakt de collectieve resultaten daarom het belangrijkste.","Maak een gezamenlijk teamresultaat zichtbaar en bespreek het elke week."],["Het eerste team","Een les uit het boek: leden van een directieteam moeten dat team zien als hun eerste team, niet de afdeling die ze leiden. Alleen dan nemen ze beslissingen die goed zijn voor het geheel. Dit vraagt een omslag in loyaliteit.","Vraag je af: wat is mijn eerste team, en handel ik daarnaar?"]]},{"id":"c-good-to-great","title":"Good to Great","titleNl":"Good to Great","author":"Jim Collins","year":2001,"topic":"Leiderschap","summary":"Jim Collins en zijn onderzoeksteam vergeleken bedrijven die van goed naar uitzonderlijk groeiden met vergelijkbare bedrijven die dat niet deden. Ze vonden een aantal opvallende patronen.","ideas":[["Goed is de vijand van groots","Collins opent met het idee dat goed de vijand is van groots. Omdat veel organisaties goed genoeg zijn, worden ze nooit groots. Zijn team zocht bedrijven die na jaren van gemiddelde resultaten een sprong maakten en die vijftien jaar lang vasthielden.","Waar ben je nu goed genoeg in, wat je ervan weerhoudt om echt goed te worden?"],["Leiderschap op niveau 5","De leiders van de topbedrijven waren geen charismatische sterren. Ze combineerden persoonlijke bescheidenheid met een onwrikbare professionele wil. Bij succes wezen ze naar anderen, bij tegenslag naar zichzelf. Collins noemt dit leiderschap op niveau 5.","Geef bij succes de eer aan je team, en neem bij tegenslag zelf de verantwoordelijkheid."],["Eerst wie, dan wat","De topbedrijven begonnen niet met een strategie, maar met de juiste mensen. Collins gebruikt het beeld van een bus: zorg eerst dat de juiste mensen in de bus zitten, de verkeerde eruit, en iedereen op de juiste stoel. Bepaal pas daarna waar je naartoe rijdt.","Kijk naar je team: zitten de juiste mensen op de juiste plek, voordat je een nieuwe strategie kiest?"],["Kijk de harde feiten onder ogen","Grote bedrijven durfden de brute werkelijkheid onder ogen te zien, terwijl ze tegelijk geloofden dat ze uiteindelijk zouden winnen. Collins noemt dit de Stockdale-paradox, naar een Amerikaanse officier die jaren krijgsgevangene was en het overleefde door realisme én vertrouwen.","Benoem de harde waarheid van je situatie, en wat je ondanks dat gelooft dat je kunt bereiken."],["Het egelconcept","De topbedrijven kozen één helder concept op het snijvlak van drie cirkels: waar ze de beste van de wereld in konden zijn, waar ze gepassioneerd over waren en wat hun economische motor dreef. Ze deden alleen wat in dat concept paste.","Schrijf voor jezelf of je bedrijf op: waar ben je de beste in, waar ben je gepassioneerd over, en wat brengt geld op?"],["Een cultuur van discipline","De grote bedrijven hadden gedisciplineerde mensen, gedisciplineerd denken en gedisciplineerd handelen. Daardoor hadden ze minder bureaucratie nodig. Ze zeiden vooral ook nee tegen kansen die niet in hun egelconcept pasten.","Kies één kans om nee tegen te zeggen omdat hij niet in je kern past."],["Het vliegwiel","De sprong naar groots kwam niet door één grote verandering. Het was als het draaien van een zwaar vliegwiel: eerst langzaam, met veel inspanning, en daarna steeds sneller. Collins waarschuwt voor de neerwaartse spiraal van steeds nieuwe programma's en reorganisaties.","Kijk naar je laatste resultaten. Welke kleine stappen bouwen het vliegwiel op?"]]},{"id":"c-turn-ship","title":"Turn the Ship Around!","titleNl":"Turn the Ship Around!","author":"L. David Marquet","year":2012,"topic":"Leiderschap","summary":"Kapitein David Marquet beschrijft hoe hij de slechtst presterende onderzeeër van de Amerikaanse marine omvormde tot een van de beste. Hij stapte af van bevelen geven en maakte iedereen leider.","ideas":[["Een schip dat hij niet kende","Marquet werd onverwacht kapitein van de USS Santa Fe, een onderzeeër die hij niet tot in detail kende. Toen hij een bevel gaf dat technisch onmogelijk was, voerde de bemanning het toch uit. Hij besefte dat een systeem van bevel en gehoorzaamheid gevaarlijk is.","Merk op wanneer je team iets doet omdat jij het zei, ook als het niet klopt."],["Leider-leider in plaats van leider-volger","In het traditionele model geeft de leider bevelen en volgen de anderen. Marquet bouwde een model waarin iedereen leider is: mensen nemen zelf beslissingen binnen hun verantwoordelijkheid. Daardoor groeit het vermogen van de hele organisatie.","Kies één beslissing die je kunt delegeren aan iemand dichter bij het werk."],["Ik ben van plan om","Een concrete verandering: officieren vroegen niet langer om toestemming, maar zeiden 'kapitein, ik ben van plan om...'. De kapitein antwoordde meestal alleen 'goed'. Zo verschoof de verantwoordelijkheid naar wie de informatie had.","Laat je team zeggen 'Ik ben van plan om...' in plaats van om toestemming te vragen."],["Controle geven","Marquet stelt dat je controle moet geven, niet nemen. Dat betekent beslissingsbevoegdheid zo laag mogelijk in de organisatie leggen. Mensen voelen zich dan eigenaar van hun werk in plaats van uitvoerders van opdrachten.","Welke bevoegdheid kun je lager in de organisatie leggen?"],["Competentie is nodig","Controle geven werkt alleen als mensen de kennis hebben om goede beslissingen te nemen. Marquet investeerde daarom in technische training. Hij stopte met briefings waarin hij uitlegde wat er ging gebeuren, en vroeg de bemanning zelf uit te leggen wat ze gingen doen.","Investeer in de kennis van je team, zodat ze zelf goede beslissingen kunnen nemen."],["Helderheid over het doel","Om goed te kunnen beslissen moeten mensen weten wat het doel is en welke waarden gelden. Marquet maakte dat expliciet en herhaalde het voortdurend. Zo konden mensen in nieuwe situaties zelf de goede keuze maken.","Zorg dat iedereen het doel en de waarden kent, en herhaal ze vaak."],["Resultaat","De Santa Fe ging van de slechtst beoordeelde naar een van de best beoordeelde onderzeeërs. Bovendien werden veel officieren van de bemanning later zelf commandant. Volgens Marquet bewijst dat dat dit leiderschapsmodel ook na zijn vertrek bleef werken.","Kijk naar je team: zou het werk goed doorgaan als jij er een maand niet was?"]]},{"id":"c-radical-candor","title":"Radical Candor","titleNl":"Radicale openhartigheid","author":"Kim Scott","year":2017,"topic":"Leiderschap","summary":"Kim Scott, die leidinggaf bij Google en Apple, beschrijft hoe je eerlijke feedback geeft zonder je mensen te kwetsen. De sleutel: persoonlijk betrokken zijn en direct uitdagen.","ideas":[["Twee dimensies","Scott beschrijft feedback langs twee assen: hoeveel je persoonlijk om iemand geeft, en hoe direct je iemand uitdaagt. Radicale openhartigheid is beide tegelijk: je geeft om de persoon én je bent eerlijk over wat beter moet.","Kijk naar je laatste feedback: gaf je om de persoon én was je eerlijk?"],["Vier kwadranten","Wie wel uitdaagt maar niet geeft om de ander, is meedogenloos agressief. Wie geeft om de ander maar niet uitdaagt, is ruïneus empathisch: te aardig om eerlijk te zijn. Wie geen van beide doet, is manipulatief onoprecht. Volgens Scott maken de meeste managers de fout van ruïneuze empathie.","In welk kwadrant val jij het vaakst? Wat kun je doen om naar radicale openhartigheid te bewegen?"],["Een leerzaam compliment","Scott vertelt hoe haar leidinggevende Sheryl Sandberg haar na een geslaagde presentatie zei dat ze vaak 'eh' zei. Toen Scott dat wegwuifde, zei Sandberg dat ze het duidelijker zou zeggen: het maakte haar dom klinkend. Dat was ongemakkelijk, maar hielp haar enorm.","Geef iemand een eerlijke, specifieke opmerking die hem helpt, ook als het even ongemakkelijk is."],["Vraag eerst om feedback","Begin met het vragen om kritiek op jezelf, voordat je anderen kritiek geeft. Stel een vraag die uitnodigt, zoals 'wat kan ik doen of stoppen met doen om het samenwerken makkelijker te maken?'. Verdraag de stilte en beloon eerlijkheid.","Vraag deze week één collega: wat kan ik doen of stoppen met doen om beter samen te werken?"],["Geef feedback goed","Geef feedback snel, in persoon, en persoonlijk in een-op-een gesprekken. Prijs in het openbaar, bekritiseer privé. Wees specifiek en richt je op het gedrag, niet op de persoon. Scott noemt het advies: humble, helpful, immediate, in person.","Geef je volgende feedback snel, in persoon, en richt je op het gedrag, niet op de persoon."],["Ken je mensen","Scott onderscheidt mensen op een steile groeicurve, die snel willen groeien, en mensen op een rustige curve, die stabiel goed werk leveren. Beide zijn waardevol. Een goede leider weet wat iedereen wil en geeft passende kansen.","Vraag je teamleden wat ze willen: snel groeien of stabiel goed werk leveren?"],["Leiden zonder ego","Volgens Scott gaat leidinggeven om het creëren van de omstandigheden waarin mensen goed werk kunnen doen. Daarbij hoort het delen van besluiten: luisteren, debatteren, beslissen, overtuigen en uitvoeren. De leider hoeft niet alle antwoorden te hebben.","Laat bij een besluit eerst iedereen meedenken en debatteren, voordat je beslist."]]},{"id":"c-culture-code","title":"The Culture Code","titleNl":"De cultuurcode","author":"Daniel Coyle","year":2018,"topic":"Leiderschap","summary":"Daniel Coyle onderzocht succesvolle groepen, van sportteams tot speciale eenheden. Hij beschrijft drie vaardigheden die een sterke groepscultuur bouwen: veiligheid, kwetsbaarheid en een gedeeld doel.","ideas":[["Cultuur is gedrag","Cultuur is geen vaag gevoel, maar een reeks concrete gedragingen. Coyle vertelt over een experiment waarin kinderen het beter deden bij het bouwen van een toren dan businessstudenten. De kinderen probeerden gewoon samen dingen uit, terwijl de studenten met status bezig waren.","Kijk naar je team: welk gedrag laat zien wat er echt belangrijk is, los van wat er in de waarden staat?"],["Bouw veiligheid","Groepen werken goed als mensen signalen krijgen dat ze erbij horen. Coyle noemt die signalen ‘belonging cues’: aandacht, oogcontact, luisteren, gelijkwaardigheid. Ze moeten herhaald worden, want het brein blijft voortdurend checken of het veilig is.","Geef je collega's volle aandacht in gesprekken: oogcontact, luisteren, geen telefoon."],["Eén slechte appel","Coyle beschrijft onderzoek waarin één deelnemer zich negatief gedroeg en daarmee de prestaties van de hele groep fors verlaagde. Andersom kan één persoon die warmte en energie uitstraalt een team ook optillen. Gedrag is besmettelijk.","Merk op hoe jouw stemming de groep beïnvloedt. Breng bewust energie en warmte in."],["Deel kwetsbaarheid","Vertrouwen ontstaat niet vóór kwetsbaarheid, maar erdoor. Als een leider een fout toegeeft of om hulp vraagt, durven anderen dat ook. Coyle noemt dit een kwetsbaarheidslus: één persoon toont kwetsbaarheid, de ander reageert met hetzelfde, en zo groeit vertrouwen.","Deel als eerste een fout of twijfel in je team, en reageer met dank als anderen hetzelfde doen."],["Leiders die luisteren","Goede leiders praten minder en luisteren meer. Ze stellen vragen, laten stiltes vallen en reageren op slecht nieuws met dank in plaats van woede. Coyle beschrijft het speciale Amerikaanse militaire team, de Navy SEALs, waar na elke missie eerlijk wordt geëvalueerd zonder rang.","Reageer op slecht nieuws met dank voor het delen, niet met frustratie."],["Een gedeeld doel","Sterke groepen hebben een duidelijk verhaal over wie ze zijn en waar ze naartoe gaan. Coyle noemt dat het geven van gedeeld doel. Ze herhalen het voortdurend, in simpele zinnen, slogans en rituelen. Zo weet iedereen wat belangrijk is.","Formuleer in één zin waar je team voor staat, en herhaal die vaak."],["Benoem prioriteiten","Coyle adviseert om prioriteiten te benoemen en te rangschikken. Wees duidelijk over wat het belangrijkste is, en vertaal dat naar concreet gedrag. Een goed voorbeeld is een restaurant waar de kok zijn standaarden in eenvoudige regels uitdrukt die iedereen kent.","Rangschik je teamprioriteiten en vertaal de belangrijkste naar concreet gedrag."]]},{"id":"c-art-of-war","title":"The Art of War","titleNl":"De kunst van het oorlogvoeren","author":"Sun Tzu","year":null,"topic":"Leiderschap","summary":"Een oude Chinese tekst over militaire strategie, toegeschreven aan generaal Sun Tzu. De lessen over voorbereiding, kennis en het vermijden van onnodige strijd worden nu ook toegepast in zaken en leiderschap.","ideas":[["Winnen zonder te vechten","Volgens Sun Tzu is de hoogste kunst niet honderd veldslagen winnen, maar de vijand onderwerpen zonder te vechten. Strijd kost mensen en middelen. Een slimme strateeg bereikt zijn doel door voorbereiding, diplomatie en de tegenstander te slim af te zijn.","Is er een conflict waarin je je doel kunt bereiken zonder te vechten?"],["Ken jezelf en de ander","Een beroemd idee uit de tekst: wie zijn vijand en zichzelf kent, hoeft honderd veldslagen niet te vrezen. Wie alleen zichzelf kent, wint en verliest afwisselend. Wie geen van beide kent, verliest altijd. Kennis is de basis van elke strategie.","Schrijf op wat je weet over jezelf en de andere partij, voordat je een belangrijk gesprek ingaat."],["Planning vooraf","Sun Tzu stelt dat de veldslag vaak al gewonnen of verloren is voordat hij begint. Een generaal moet vooraf de omstandigheden afwegen: moreel, terrein, weer, leiderschap en discipline. Wie de meeste voordelen heeft verzameld, wint.","Bereid je volgende belangrijke situatie grondig voor: wat zijn je sterke en zwakke punten?"],["Misleiding","Alle oorlogvoering is gebaseerd op misleiding. Laat je sterk lijken als je zwak bent, en zwak als je sterk bent. Doe alsof je ver weg bent als je dichtbij bent. Het doel is dat de tegenstander verkeerde inschattingen maakt.","Let bij onderhandelingen op wat de ander wel en niet laat zien. Wat zegt dat?"],["Snelheid en duur","Een lange oorlog put een land uit. Sun Tzu adviseert om snel te handelen en langdurige campagnes te vermijden. In de praktijk betekent dit: kies je moment, zet in op beslissende acties en verspil geen middelen aan eindeloze strijd.","Vermijd langdurige conflicten die energie kosten. Kies een beslissend moment om te handelen."],["Gebruik het terrein","Sun Tzu beschrijft verschillende soorten terrein en hoe je die kunt gebruiken. Pas je strategie aan aan de omstandigheden, zoals water dat zich aanpast aan de vorm van de grond. Wie flexibel is, kan zwaktes van de tegenstander benutten.","Pas je aanpak aan de situatie aan, in plaats van één vaste strategie te gebruiken."],["De rol van de leider","Een goede generaal is wijs, betrouwbaar, menselijk, moedig en streng. Hij zorgt goed voor zijn soldaten, maar handhaaft ook discipline. Sun Tzu waarschuwt dat een leider nooit uit woede mag aanvallen; emoties zijn tijdelijk, de gevolgen van een slechte beslissing blijvend.","Neem nooit een belangrijke beslissing uit woede. Wacht tot je rustig bent."]]},{"id":"c-love-languages","title":"The 5 Love Languages","titleNl":"De vijf talen van de liefde","author":"Gary Chapman","year":1992,"topic":"Relaties","summary":"Relatietherapeut Gary Chapman stelt dat mensen liefde op verschillende manieren geven en ontvangen. Wie de liefdestaal van zijn partner leert spreken, kan de relatie sterk verbeteren. Het model is populair, maar wetenschappelijk beperkt onderbouwd.","ideas":[["Verschillende talen","Chapman zag in zijn praktijk dat stellen vaak langs elkaar heen praten. De ene partner toont liefde op een manier die de ander niet herkent. Hij onderscheidt vijf liefdestalen. Iedereen heeft er volgens hem een of twee die het meest resoneren.","Vraag je partner of vriend: wanneer voel je je het meest gewaardeerd door mij?"],["De verliefdheid gaat voorbij","De eerste verliefdheid voelt moeiteloos, maar duurt volgens Chapman gemiddeld zo'n twee jaar. Daarna moet liefde een keuze worden. Juist dan wordt het belangrijk om bewust de taal van je partner te spreken, zodat diens emotionele tank gevuld blijft.","Kijk naar je relatie: wat doe je bewust om de ander te laten voelen dat hij of zij belangrijk is?"],["Woorden van bevestiging","Voor sommige mensen is het horen van waardering, complimenten en aanmoediging de belangrijkste uiting van liefde. Kritiek of harde woorden komen bij hen extra hard aan. Zeg dus vaker wat je waardeert aan je partner.","Zeg vandaag één specifieke, oprechte waardering tegen je partner."],["Quality time","Voor anderen gaat het om onverdeelde aandacht: samen iets doen, een echt gesprek voeren zonder telefoon. Het gaat niet om hoeveel tijd, maar om de kwaliteit van de aandacht. Afgeleid zijn voelt voor hen als afwijzing.","Plan een moment samen zonder telefoon, met echte aandacht."],["Cadeaus","Voor sommige mensen is een cadeau een tastbaar symbool van liefde. De waarde zit niet in de prijs, maar in het gebaar: je hebt aan hen gedacht. Belangrijke momenten vergeten raakt hen diep.","Denk aan een klein cadeau dat laat zien dat je aan de ander dacht."],["Dienstbaarheid","Voor deze mensen spreken daden luider dan woorden. Hulp bij taken, de vaatwasser uitruimen of iets regelen dat ze zelf niet leuk vinden, voelt als liefde. Beloftes die niet worden nagekomen, komen hard aan.","Doe iets wat je partner niet graag doet, zonder dat hij of zij erom vraagt."],["Lichamelijke aanraking","Voor sommigen is aanraking de belangrijkste taal: een hand vasthouden, een knuffel, een arm om de schouder. Het gaat niet alleen om seksualiteit. Chapman adviseert om je eigen taal en die van je partner te ontdekken door te kijken waar je om vraagt en waarover je klaagt.","Geef je partner vaker een aanraking: een hand, een knuffel, een arm om de schouder."]]},{"id":"c-gottman","title":"The Seven Principles for Making Marriage Work","titleNl":"Zeven principes voor een goede relatie","author":"John M. Gottman & Nan Silver","year":1999,"topic":"Relaties","summary":"Relatieonderzoeker John Gottman bestudeerde duizenden stellen in zijn lab. Hij beschrijft wat succesvolle relaties onderscheidt en welke signalen wijzen op problemen.","ideas":[["Onderzoek in het liefdeslab","Gottman observeerde stellen terwijl ze praatten over meningsverschillen en hun dagelijks leven. Op basis van die observaties kon hij met opvallende nauwkeurigheid voorspellen welke relaties stand zouden houden. Zijn adviezen zijn gebaseerd op wat stabiele stellen echt doen.","Kijk naar je relatie: wat zie je terug van wat stabiele stellen doen?"],["De vier ruiters","Gottman beschrijft vier gedragingen die op problemen wijzen: kritiek op de persoon, minachting, defensief reageren en stonewalling, je afsluiten van het gesprek. Minachting is volgens hem de sterkste voorspeller van een scheiding.","Merk op wanneer je kritiek, minachting, verdediging of stilte gebruikt in een ruz
