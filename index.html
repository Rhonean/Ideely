, geef het dan snel en ruiterlijk toe.","Zeg bij een meningsverschil eerst wat je waardeert aan het standpunt van de ander."],["Laat de ander ja zeggen","Begin een gesprek vriendelijk en met punten waarover je het eens bent, zodat de ander al snel 'ja' zegt. Laat de ander vooral zelf praten. Mensen hechten meer aan ideeën die ze zelf bedacht hebben, dus laat het idee zoveel mogelijk van hen voelen.","Begin een lastig gesprek met punten waarover jullie het eens zijn."],["Corrigeer zonder te kwetsen","Wijs indirect op fouten en praat eerst over je eigen fouten. Stel vragen in plaats van bevelen te geven. Laat de ander zijn gezicht redden. En prijs elke kleine verbetering. Zo wil iemand veranderen in plaats van zich te verdedigen.","Geef feedback door eerst een eigen fout te benoemen en daarna een vraag te stellen in plaats van een opdracht."]]},{"id":"c-attached","title":"Attached","titleNl":"Gehecht","author":"Amir Levine & Rachel Heller","year":2010,"topic":"Relaties","summary":"Psychiater Amir Levine en psycholoog Rachel Heller passen de hechtingstheorie toe op volwassen liefdesrelaties. Ze beschrijven drie hechtingsstijlen en hoe je daarmee een betere relatie bouwt.","ideas":[["Hechting stopt niet na je jeugd","De hechtingstheorie beschrijft hoe kinderen een band vormen met hun verzorgers. Levine en Heller laten zien dat volwassenen in liefdesrelaties vergelijkbare patronen vertonen. Onze behoefte aan nabijheid van een partner is volgens hen biologisch en niet iets om je voor te schamen.","Denk na over hoe jij reageert als je partner afstand neemt: zoek je contact of trek je je terug?"],["Drie hechtingsstijlen","Veilig gehechte mensen voelen zich comfortabel met intimiteit en zijn warm en betrouwbaar. Angstig gehechte mensen verlangen naar nabijheid en maken zich zorgen of hun partner wel genoeg van hen houdt. Vermijdend gehechte mensen ervaren intimiteit als verlies van onafhankelijkheid en houden afstand. Ongeveer de helft van de mensen is veilig gehecht.","Herken je jezelf vooral in veilig, angstig of vermijdend? Hoe zie je dat terug in eerdere relaties?"],["De afhankelijkheidsparadox","Hoe meer je erop kunt vertrouwen dat je partner er voor je is, hoe zelfstandiger en zelfverzekerder je de wereld in gaat. Afhankelijkheid is dus geen zwakte. Een veilige basis maakt je juist vrijer.","Vraag je af: durf ik op mijn partner te steunen, en voelt dat als vrijheid of als zwakte?"],["Angstige patronen","Bij onzekerheid zet een angstig gehecht iemand allerlei strategieën in om contact te herstellen, zoals steeds aan de partner denken of de ander idealiseren. Soms volgt protestgedrag: niet terugbellen, jaloers maken of dreigen te vertrekken. Dat vergroot meestal juist de afstand.","Merk je protestgedrag op, zoals niet terugbellen of dreigen? Benoem in plaats daarvan direct wat je nodig hebt."],["Vermijdende patronen","Vermijdend gehechte mensen gebruiken strategieën om afstand te houden: focussen op kleine gebreken van de partner, verlangen naar een ideale ex, of zich terugtrekken als het te intiem wordt. Vaak beseffen ze zelf niet dat dit nabijheid blokkeert.","Merk je dat je kleine gebreken bij je partner gaat zoeken als het intiem wordt? Benoem dat patroon voor jezelf."],["De angstig-vermijdende val","Angstig en vermijdend gehechte mensen trekken elkaar opvallend vaak aan. De één zoekt nabijheid, de ander trekt zich terug, en dat versterkt elkaars angsten. Zo'n relatie voelt intens, maar is vaak instabiel en uitputtend.","Herken je de dans van achtervolgen en terugtrekken? Bespreek het patroon samen op een rustig moment."],["Kies voor veilige hechting","Volgens de auteurs is een veilig gehechte partner een van de beste voorspellers van een gelukkige relatie. Let al vroeg op signalen van vermijding, zoals gemengde boodschappen of het ontwijken van gesprekken over de relatie. Met een veilige partner kunnen ook angstig gehechte mensen tot rust komen.","Let bij een nieuwe relatie op of iemand consequent, betrouwbaar en open is over de relatie."],["Communiceer je behoeften direct","Zeg duidelijk wat je nodig hebt, zonder verwijten of spelletjes. Hoe je partner daarop reageert, vertelt veel. Een partner die je behoeften serieus neemt, is iemand bij wie je je veilig kunt voelen. Wie je behoeften steeds afdoet als overdreven, past waarschijnlijk minder goed bij je.","Formuleer één behoefte in een eenvoudige zin, zonder verwijt, en deel die met je partner."]]},{"id":"c-meditations","title":"Meditations","titleNl":"Overpeinzingen","author":"Marcus Aurelius","year":180,"topic":"Filosofie","summary":"De persoonlijke aantekeningen van de Romeinse keizer en stoïcijn Marcus Aurelius, nooit bedoeld voor publicatie. Hij spoort zichzelf aan tot rust, plichtsbesef en aanvaarding van wat hij niet kan veranderen.","ideas":[["Een dagboek voor jezelf","Marcus Aurelius schreef deze aantekeningen voor zichzelf, waarschijnlijk tijdens veldtochten in de laatste jaren van zijn leven. Het is geen systematische filosofie, maar een reeks herinneringen en aansporingen. Juist daardoor voelt het tekst na bijna twee millennia nog persoonlijk.","Schrijf deze week elke avond drie zinnen voor jezelf: wat deed ik goed, wat kan beter, wat leerde ik?"],["Begin de dag voorbereid","Hij spoort zichzelf aan om de dag te beginnen met de gedachte dat hij ondankbare, arrogante en onaardige mensen zal tegenkomen. Ze handelen zo omdat ze niet beter weten. Wie dat verwacht, raakt er minder door van slag en kan blijven samenwerken, omdat we gemaakt zijn om elkaar te helpen.","Neem 's ochtends een minuut om je voor te bereiden op lastige mensen of situaties van vandaag."],["Niet de dingen, maar je oordeel","Het zijn niet de gebeurtenissen die je van streek maken, maar je oordeel erover. Haal het oordeel weg, en de klacht verdwijnt ook. Daarmee legt Marcus de rust bij jezelf: je kunt niet alles beheersen wat gebeurt, wel hoe je het interpreteert.","Bij een ergernis: vraag jezelf welk oordeel je eraan toevoegt, en hoe het eruitziet zonder dat oordeel."],["Wat in de weg staat, wordt de weg","Een obstakel kan volgens Marcus zelf een kans worden. Wat je hindert in je handelen, bevordert juist een ander soort handelen: geduld, moed of creativiteit. Het idee dat tegenslag materiaal is om mee te werken, is een kern van de stoïcijnse houding.","Kies een obstakel waar je nu tegenaan loopt. Wat kun je juist door dit obstakel oefenen of leren?"],["Alles verandert","Marcus herinnert zichzelf er steeds aan dat alles voorbijgaat: mensen, roem, rijken en ook hijzelf. Hij beschrijft de wereld als een rivier die voortdurend stroomt. Dat besef helpt om niet te veel waarde te hechten aan status en bezit.","Denk aan iets waar je veel waarde aan hecht. Hoe verandert je houding als je bedenkt dat het tijdelijk is?"],["Leef alsof elke daad je laatste is","Doe elke taak alsof het de laatste van je leven is: zonder haast, zonder toneelspel, zonder eigenbelang. Het bewustzijn van de dood is bij Marcus geen somber gegeven, maar een manier om aandachtig en zuiver te handelen in het hier en nu.","Doe één alledaagse taak vandaag met volle aandacht, alsof het de laatste keer is."],["Trek je terug in jezelf","Mensen zoeken rust op het platteland, aan zee of in de bergen. Marcus schrijft dat je overal en altijd in jezelf kunt terugtrekken. Een rustige geest is een toevluchtsoord dat je overal meeneemt. Gebruik het vaak en houd het eenvoudig.","Neem een paar minuten om rustig te zitten en je aandacht naar binnen te richten, zonder telefoon."],["Dankbaarheid voor wat je leerde","Het eerste boek is een lijst van wat hij van anderen leerde: van zijn grootvader goede zeden, van zijn moeder vroomheid en eenvoud, van zijn leraren zelfbeheersing. Zo laat hij zien dat karakter gevormd wordt door de mensen om je heen, en dat dankbaarheid daarbij hoort.","Schrijf op wat je van drie mensen in je leven hebt geleerd, en laat het een van hen weten."]]},{"id":"c-obstacle","title":"The Obstacle Is the Way","titleNl":"Het obstakel is de weg","author":"Ryan Holiday","year":2014,"topic":"Filosofie","summary":"Holiday vertaalt de stoïcijnse filosofie naar een praktische aanpak voor tegenslag. Hij beschrijft drie disciplines: waarneming, actie en wil.","ideas":[["Drie disciplines","Holiday beschrijft drie stappen om met tegenslag om te gaan. Waarneming: hoe je naar het probleem kijkt. Actie: wat je eraan doet. Wil: hoe je omgaat met wat je niet kunt veranderen. Samen maken ze van een obstakel een kans.","Neem een probleem van nu en verdeel het: hoe kijk ik ernaar, wat kan ik doen, wat moet ik aanvaarden?"],["Kijk objectief","Beschrijf wat er gebeurt zonder het meteen goed of slecht te noemen. Holiday noemt Rockefeller, die als jonge boekhouder tijdens de financiële paniek van 1857 rustig bleef en leerde kansen te zien waar anderen alleen chaos zagen. Emoties zijn niet verboden, maar ze moeten je oordeel niet overnemen.","Beschrijf een tegenvaller in neutrale feiten, zonder woorden als 'ramp' of 'oneerlijk'."],["Beheers je zenuwen","In moeilijke situaties is kalmte een vaardigheid die je kunt trainen. Wie zijn zenuwen beheerst, ziet meer opties. Holiday adviseert om je af te vragen: wat is hier eigenlijk aan de hand, wat is binnen mijn macht, en wat niet?","Als je spanning voelt: noem drie dingen die je wel en drie die je niet in de hand hebt."],["Kom in beweging","Wacht niet op het perfecte moment. Begin, ook als het klein is. Holiday beschrijft hoe doorzettingsvermogen en blijven proberen vaak doorslaggevend zijn: generaal Grant probeerde Vicksburg op allerlei manieren in te nemen voor het lukte. Elke mislukte poging levert informatie op.","Zet vandaag één kleine stap in iets wat je al te lang laat liggen, ook al is het niet perfect."],["Volg het proces","Richt je niet op het eindresultaat dat overweldigend voelt, maar op de volgende stap. Doe die goed en ga dan naar de volgende. Zo worden grote obstakels opgeknipt in hanteerbare taken. Het proces is iets wat je kunt beheersen; de uitkomst niet altijd.","Verdeel een groot project in de eerstvolgende stap, en richt je alleen daarop."],["Gebruik het obstakel zelf","Soms is de beste aanpak om het obstakel tegen zichzelf te gebruiken in plaats van er frontaal tegenin te gaan. Holiday noemt Gandhi, die de kracht van zijn tegenstanders gebruikte door niet terug te vechten. Zo werd geweld van de tegenpartij een argument voor zijn zaak.","Is er iets wat je tegenwerkt? Bedenk hoe je die tegenkracht juist kunt gebruiken."],["Bereid je voor op het ergste","Stoïcijnen oefenden met het vooraf bedenken wat er mis kan gaan. Daardoor ben je minder verrast en sneller herstellen als het gebeurt. Het is geen pessimisme, maar realisme: je verwacht het onverwachte en plant ervoor.","Doe een premortem: stel je voor dat je plan mislukt. Wat ging er mis, en hoe voorkom je dat?"],["Omarm wat gebeurt","De wil is je innerlijke kracht als niets meer helpt. Holiday gebruikt het begrip amor fati: liefde voor je lot. Accepteer niet alleen wat je overkomt, maar probeer het te omarmen als brandstof. Ook het besef van sterfelijkheid helpt om te focussen op wat telt.","Kies één ding dat je niet kunt veranderen en probeer het deze week te aanvaarden als onderdeel van je pad."]]},{"id":"c-crucial-conversations","title":"Crucial Conversations","titleNl":"Cruciale gesprekken","author":"Kerry Patterson, Joseph Grenny, Ron McMillan & Al Switzler","year":2002,"topic":"Communicatie","summary":"Een praktische gids voor gesprekken waarin veel op het spel staat, meningen verschillen en emoties hoog oplopen. De auteurs geven stappen om in dialoog te blijven in plaats van te zwijgen of aan te vallen.","ideas":[["Wat is een cruciaal gesprek?","Een gesprek is cruciaal als er veel op het spel staat, meningen verschillen en emoties sterk zijn. Juist dan pakken we het vaak het slechtst aan: we vermijden het, of we gaan erin met de verkeerde toon. Hoe je zulke gesprekken voert, bepaalt veel van je relaties en resultaten.","Denk aan een gesprek dat je al te lang uitstelt. Waarom is het cruciaal, en wat kost het om het niet te voeren?"],["Vul de gezamenlijke pool","Dialoog betekent dat alle relevante informatie vrij kan stromen. De auteurs spreken van een pool van gedeelde betekenis. Hoe meer iedereen bijdraagt, ook onwelgevallige meningen, hoe beter de besluiten en hoe meer mensen zich eraan committeren.","Vraag in een lastig overleg actief naar de mening van wie het stilst is."],["Begin bij je hart","Vraag jezelf midden in een lastig gesprek af wat je echt wilt: voor jezelf, voor de ander en voor de relatie. Daardoor verschuift je focus van gelijk krijgen naar een goede uitkomst. Weiger de keuze tussen eerlijk zijn en aardig zijn; zoek een manier om allebei te doen.","Vraag voor een moeilijk gesprek: wat wil ik echt voor mezelf, de ander en de relatie?"],["Let op stilte en geweld","Onder druk vervallen mensen in stilte (zwijgen, ontwijken, sarcasme) of in geweld (domineren, labelen, aanvallen). Leer die signalen bij jezelf en anderen herkennen. Ze betekenen dat iemand zich niet veilig voelt, en dat je even moet terugstappen.","Merk je dat je stil wordt of scherp reageert? Neem dat als teken om even terug te stappen."],["Maak het veilig","Veiligheid rust op twee pijlers: een gedeeld doel en wederzijds respect. Als een van de twee wankelt, herstel dat eerst. Bied zo nodig excuses aan, of gebruik contrast: zeg wat je níet bedoelt en daarna wat je wél bedoelt. Zoek samen naar een doel waar iedereen achter staat.","Gebruik contrast: 'Ik bedoel niet dat je slecht werk levert. Ik wil wel dat we de deadline halen.'"],["Beheers je verhalen","Tussen wat je ziet en wat je voelt zit een verhaal dat je jezelf vertelt. Vaak zijn dat verhalen over slachtoffers, schurken of hulpeloosheid. Ga terug naar de feiten en vraag je af: waarom zou een redelijk mens doen wat deze persoon doet?","Merk het verhaal op dat je jezelf vertelt over iemand. Welke feiten heb je echt?"],["Deel je visie met STATE","De auteurs geven een volgorde om je standpunt te delen. Begin met de feiten. Vertel daarna je verhaal, je interpretatie. Vraag naar de visie van de ander. Spreek voorzichtig en stellig tegelijk, zonder het als vaststaand feit te brengen. En nodig uit om je visie te toetsen.","Begin met feiten, deel dan je interpretatie voorzichtig en vraag hoe de ander het ziet."],["Rond af met afspraken","Een goed gesprek eindigt met heldere afspraken. Bepaal hoe besluiten worden genomen: wie beslist, wie wordt geraadpleegd? Leg vast wie wat doet en wanneer, en hoe je terugkoppelt. Zonder dat verdampt de dialoog in goede bedoelingen.","Sluit je volgende overleg af met: wie doet wat, wanneer, en hoe horen we van elkaar?"]]},{"id":"c-voss","title":"Never Split the Difference","titleNl":"Never Split the Difference","author":"Chris Voss & Tahl Raz","year":2016,"topic":"Communicatie","summary":"Voormalig FBI-gijzelingsonderhandelaar Chris Voss vertaalt technieken uit levensbedreigende situaties naar zakelijke en alledaagse onderhandelingen. Centraal staat tactische empathie.","ideas":[["Onderhandelen is emotie","Volgens Voss zijn mensen geen rationele beslissers. Emoties en onbewuste reacties bepalen veel. Daarom werkt het beter om de ander te begrijpen en te laten voelen dat hij begrepen wordt, dan om alleen met logica te overtuigen. Voss noemt dit tactische empathie.","Probeer in je volgende onderhandeling eerst te begrijpen wat de ander voelt, voordat je je argumenten geeft."],["Spiegelen","Herhaal de laatste één tot drie woorden van wat de ander zei, met een vragende toon. Dat simpele trucje zorgt dat mensen verder uitleggen en zich gehoord voelen. Het geeft je informatie en tijd, zonder dat je zelf iets hoeft prijs te geven.","Herhaal in je volgende gesprek de laatste woorden van de ander met een vragende toon, en zwijg dan."],["Benoem emoties","Zeg wat je denkt dat de ander voelt: 'Het lijkt erop dat je je zorgen maakt over…'. Door een emotie te benoemen, verliest een negatief gevoel vaak een deel van zijn kracht. Na het label zwijg je, zodat de ander kan reageren.","Benoem eens een emotie: 'Het lijkt erop dat je hier gefrustreerd over bent.' Laat daarna stilte vallen."],["Doe vooraf een beschuldigingsaudit","Noem zelf alle negatieve dingen die de ander over jou of je voorstel zou kunnen denken, voordat hij ze uitspreekt. 'Je zult misschien denken dat ik onredelijk ben.' Daarmee haal je de angel eruit en wordt de ander vaak juist milder.","Bedenk voor een lastig gesprek wat de ander negatief over jou kan denken, en benoem dat zelf als eerste."],["Mik op 'dat klopt'","'Je hebt gelijk' is vaak een manier om van je af te komen. 'Dat klopt' betekent dat de ander zich echt begrepen voelt. Vat zijn situatie en gevoelens zo goed samen dat hij dat zegt. Op dat moment ontstaat er ruimte voor beweging.","Vat het standpunt van de ander zo goed samen dat hij zegt: 'Dat klopt.'"],["Nee is een begin","Mensen voelen zich veilig als ze nee mogen zeggen; het geeft ze controle. Stel daarom vragen waarop nee een goed antwoord is: 'Is het een slecht idee om…?' Een nee opent het gesprek, terwijl je met een geforceerd ja weinig opschiet.","Stel een vraag waarop nee een prima antwoord is: 'Is het een slecht idee om hier volgende week op terug te komen?'"],["Gekalibreerde vragen","Stel open vragen die beginnen met hoe of wat, zoals 'Hoe moet ik dat doen?'. Zo laat je de ander meedenken over jouw probleem, zonder te zeggen dat je nee zegt. Vermijd waarom-vragen; die klinken al snel als een beschuldiging.","Vervang 'waarom' door 'hoe' of 'wat'. Vraag bijvoorbeeld: 'Hoe zie jij dat voor je?'"],["De Ackerman-methode","Voor onderhandelen over een prijs beschrijft Voss een vast patroon. Bepaal je doelprijs. Begin op 65 procent daarvan, verhoog daarna naar 85, 95 en uiteindelijk 100 procent, met steeds kleinere stappen. Eindig met een krom, precies bedrag; dat wekt de indruk dat je goed hebt gerekend.","Bepaal voor je volgende prijsonderhandeling je doelprijs en stappen van 65, 85, 95 en 100 procent."]]},{"id":"c-atomic-habits","title":"Atomic Habits","titleNl":"Elke dag 1% beter","author":"James Clear","year":2018,"topic":"Gewoontes","summary":"Clear laat zien hoe kleine gewoonten door herhaling enorme resultaten opleveren. Hij geeft een praktisch raamwerk met vier wetten om goede gewoonten te bouwen en slechte te doorbreken.","ideas":[["Elke dag 1 procent beter","Kleine verbeteringen lijken niets, maar stapelen op als rente op rente. Wie een jaar lang elke dag één procent beter wordt, is aan het einde ongeveer zevenendertig keer beter. Andersom geldt hetzelfde voor kleine slechte keuzes. Gewoonten zijn de rente op zelfontwikkeling.","Kies één gewoonte en schrijf op hoe die er over een jaar uitziet als je hem elke dag één procent verbetert."],["Systemen boven doelen","Winnaars en verliezers hebben vaak dezelfde doelen. Het verschil zit in het systeem: de dagelijkse processen. Een doel geeft richting, maar het systeem bepaalt de vooruitgang. Richt je daarom op een goed systeem, en de resultaten volgen vanzelf.","Kijk naar een doel. Welk dagelijks systeem zou dat doel bijna vanzelf opleveren?"],["Verander je identiteit","De meest duurzame verandering begint niet bij wat je wilt bereiken, maar bij wie je wilt zijn. Zeg niet 'ik probeer te stoppen met roken', maar 'ik rook niet'. Elke keer dat je een gewoonte uitvoert, stem je als het ware op de persoon die je wilt worden.","Schrijf op wie je wilt zijn: 'Ik ben iemand die...'. Kies vandaag één handeling die daarbij past."],["De gewoontelus","Elke gewoonte volgt vier stappen: een signaal, een verlangen, een reactie en een beloning. Daaruit volgen Clears vier wetten. Maak het zichtbaar, maak het aantrekkelijk, maak het makkelijk en maak het bevredigend. Voor slechte gewoonten draai je ze om.","Kies een ongewenste gewoonte en zoek het signaal dat hem start. Wat zou je anders kunnen doen bij dat signaal?"],["Maak het zichtbaar","Gebruik een uitvoeringsintentie: 'Ik doe X om tijdstip Y op plek Z.' Of gewoontes stapelen: 'Na mijn koffie mediteer ik één minuut.' Richt je omgeving zo in dat goede signalen in het oog springen en slechte uit het zicht verdwijnen.","Formuleer: 'Na [bestaande gewoonte] doe ik [nieuwe gewoonte].' Leg wat je nodig hebt klaar in het zicht."],["Maak het aantrekkelijk","Koppel iets wat je moet doen aan iets wat je graag doet, bijvoorbeeld alleen een podcast luisteren tijdens het sporten. Clear noemt dit verleidingsbundeling. Omring je ook met mensen voor wie jouw gewenste gedrag normaal is, want we passen ons aan de groep aan.","Koppel iets wat je moet doen aan iets wat je leuk vindt, zoals een favoriete podcast alleen tijdens het wandelen."],["Maak het makkelijk","Gebruik de twee-minutenregel: maak een nieuwe gewoonte zo klein dat je hem in twee minuten doet. 'Elke avond lezen' wordt 'één bladzijde lezen'. Verminder frictie voor goed gedrag en vergroot frictie voor slecht gedrag. Herhalingen tellen meer dan perfectie.","Maak je nieuwe gewoonte zo klein dat hij binnen twee minuten klaar is."],["Maak het bevredigend","We herhalen wat goed voelt. Geef jezelf een directe beloning en houd bij wat je doet, bijvoorbeeld met een gewoontetracker. Mis je een keer, geen probleem; Clears regel is: mis het nooit twee keer achter elkaar.","Begin een simpele tracker: een kruisje op de kalender per dag dat je het deed. Mis het nooit twee keer."]]},{"id":"c-power-of-habit","title":"The Power of Habit","titleNl":"De macht der gewoonte","author":"Charles Duhigg","year":2012,"topic":"Gewoontes","summary":"Journalist Charles Duhigg laat zien hoe gewoonten werken in ons brein, in bedrijven en in de samenleving. Hij legt uit hoe je gewoonten kunt veranderen door hun structuur te begrijpen.","ideas":[["De gewoontelus","Onderzoek bij ratten in doolhoven liet zien dat het brein bij herhaald gedrag minder actief wordt: het gedrag verloopt automatisch. Een gewoonte bestaat volgens Duhigg uit drie delen: een signaal, een routine en een beloning. Hoe vaker die lus wordt doorlopen, hoe sterker hij wordt.","Kies een gewoonte die je wilt veranderen en schrijf op: wat is het signaal, de routine en de beloning?"],["Verlangen houdt de lus draaiende","Gewoonten worden krachtig als het brein naar de beloning gaat verlangen. Duhigg beschrijft hoe Febreze pas goed verkocht nadat er een geur aan werd toegevoegd: die geur werd de beloning na het schoonmaken. Zonder verlangen blijft een gewoonte zwak.","Vraag je af naar welke beloning je eigenlijk verlangt bij een slechte gewoonte. Is het rust, contact, afleiding?"],["De gouden regel van verandering","Je kunt een gewoonte niet echt wissen, maar wel veranderen. Houd het signaal en de beloning hetzelfde, en vervang alleen de routine. Zoek dus uit welke behoefte een slechte gewoonte vervult. Als je bijvoorbeeld snoept uit verveling, zoek dan een andere routine die dat verlangen bevredigt.","Houd signaal en beloning gelijk en verzin een nieuwe routine. Probeer die een week."],["Geloof maakt verandering blijvend","Alleen een nieuwe routine is vaak niet genoeg, vooral niet onder stress. Duhigg wijst op groepen zoals de Anonieme Alcoholisten: het geloof dat verandering mogelijk is, versterkt door een groep, helpt nieuwe gewoonten volhouden als het moeilijk wordt.","Zoek iemand of een groep die je steunt bij een verandering. Gedeeld geloof maakt volhouden makkelijker."],["Kerngewoonten","Sommige gewoonten zetten een kettingreactie in gang. Duhigg beschrijft hoe Paul O'Neill bij aluminiumbedrijf Alcoa alles richtte op veiligheid. Daardoor veranderde de hele manier van communiceren en werken, en verbeterden ook de resultaten. Sporten is voor veel mensen zo'n kerngewoonte.","Welke kerngewoonte, zoals bewegen of plannen, zou andere goede gewoonten in gang kunnen zetten?"],["Kleine overwinningen","Kerngewoonten werken vaak via kleine overwinningen. Elk klein succes laat zien dat verandering mogelijk is en maakt de volgende stap makkelijker. Zo groeit vertrouwen en ontstaat momentum, ook voor grotere veranderingen.","Kies een kleine overwinning die je deze week zeker haalt, en vier hem bewust."],["Wilskracht is een gewoonte","Wilskracht werkt als een spier die moe kan worden, maar die je ook kunt trainen. Duhigg beschrijft hoe Starbucks medewerkers vooraf laat bedenken hoe ze zullen reageren op lastige klanten. Door dat plan vooraf te maken, wordt zelfbeheersing een automatische reactie.","Bedenk vooraf hoe je reageert op een moment waarop je zwak wordt: 'Als X gebeurt, doe ik Y.'"],["Gewoonten van organisaties en groepen","Ook organisaties en samenlevingen hebben gewoonten. Duhigg laat zien hoe crises een kans kunnen zijn om slechte routines in organisaties te veranderen. En hoe sociale bewegingen, zoals de busboycot in Montgomery, groeien via vriendschappen, zwakke banden en nieuwe gedeelde gewoonten.","Kijk naar een routine in je team die niemand meer bevraagt. Is die nog nuttig?"]]},{"id":"c-lean-startup","title":"The Lean Startup","titleNl":"De lean startup","author":"Eric Ries","year":2011,"topic":"Ondernemen","summary":"Ries beschrijft een methode om onder grote onzekerheid nieuwe producten en bedrijven te bouwen. Kern is snel leren van echte klanten in plaats van lang plannen.","ideas":[["Wat een startup is","Een startup is volgens Ries een organisatie die een nieuw product of nieuwe dienst maakt onder extreme onzekerheid. Dat kan dus ook een team binnen een groot bedrijf zijn. Traditioneel management werkt dan slecht, want je weet nog niet wat klanten echt willen.","Beschrijf je idee of project in één zin: wat maak je, voor wie, en welke onzekerheid is het grootst?"],["Gevalideerd leren","De echte voortgang van een startup is niet hoeveel er gebouwd is, maar hoeveel je hebt geleerd over wat klanten willen. Dat leren moet je aantonen met echte gegevens uit experimenten. Ries noemt dat gevalideerd leren.","Vraag je bij je volgende stap af: wat leer ik hiervan over wat klanten echt willen?"],["Bouwen, meten, leren","Het hart van de methode is een cyclus: bouw iets, meet hoe klanten erop reageren en leer daarvan. Het doel is om die cyclus zo snel mogelijk te doorlopen. Plan wel omgekeerd: bepaal eerst wat je wilt leren, dan wat je moet meten, en pas dan wat je moet bouwen.","Bepaal eerst wat je wilt leren, dan wat je wilt meten, en pas daarna wat je bouwt."],["Het minimaal levensvatbare product","Een MVP is de eenvoudigste versie van je product waarmee je de cyclus kunt doorlopen. Het hoeft niet mooi of compleet te zijn. Het moet vooral laten zien of je belangrijkste aannames kloppen. Veel ondernemers schamen zich ervoor, maar het levert snel waardevolle kennis op.","Wat is de kleinste versie van je idee waarmee je in een week kunt testen of iemand het wil?"],["Toets je sprongen in het diepe","Elk plan rust op aannames die waar moeten zijn. Ries noemt de twee belangrijkste: de waardehypothese, levert dit echt waarde op voor klanten, en de groeihypothese, hoe vinden nieuwe klanten het product. Test die eerst, voordat je veel tijd en geld investeert.","Schrijf je twee grootste aannames op: waarom zouden mensen dit willen, en hoe vinden ze je?"],["Pas op voor ijdelheidscijfers","Totale aantallen gebruikers of downloads stijgen bijna altijd en voelen goed, maar zeggen weinig. Ries pleit voor bruikbare cijfers, bijvoorbeeld per cohort: hoe gedragen groepen klanten die in dezelfde periode instapten zich? Zo zie je of je aanpassingen echt iets verbeteren.","Kijk naar je cijfers. Welke vertellen je echt of je beter wordt, en welke voelen alleen goed?"],["Pivoteren of volhouden","Op vaste momenten beslis je of je doorgaat met je strategie of een koerswijziging maakt: een pivot. Daarbij houd je vast aan wat je hebt geleerd en verander je één onderdeel, zoals de doelgroep, het probleem of het verdienmodel. Te lang twijfelen is duurder dan op tijd bijsturen.","Plan een vast moment om te beslissen: doorgaan met deze aanpak, of één ding veranderen?"],["Werk in kleine batches","Kleine stappen leveren sneller feedback op en maken fouten eerder zichtbaar. Ries gebruikt het voorbeeld van brieven vouwen: één voor één afmaken is vaak sneller dan alles stap voor stap in bulk. Bij problemen helpt de methode van vijf keer waarom vragen om de echte oorzaak te vinden.","Lever een volgend stuk werk in een kleinere versie op, om sneller feedback te krijgen."]]},{"id":"c-zero-to-one","title":"Zero to One","titleNl":"Van nul naar één","author":"Peter Thiel & Blake Masters","year":2014,"topic":"Ondernemen","summary":"Investeerder en PayPal-oprichter Peter Thiel betoogt dat echte vooruitgang komt van iets nieuws maken, niet van kopiëren. Hij beschrijft hoe je een bedrijf bouwt dat een unieke positie inneemt.","ideas":[["Van nul naar één","Iets kopiëren wat al werkt, is van één naar n gaan: horizontale vooruitgang. Iets nieuws maken is van nul naar één: verticale vooruitgang. Thiel stelt dat technologie, in de brede zin van nieuwe manieren om dingen te doen, de belangrijkste bron van echte vooruitgang is.","Vraag je bij een plan af: maak ik iets nieuws, of doe ik iets wat al bestaat net iets beter?"],["De tegendraadse vraag","Thiel stelt sollicitanten graag een vraag: welke belangrijke waarheid zie jij die weinig mensen met je delen? Goede antwoorden zijn zeldzaam. Ze vormen het startpunt voor een bedrijf dat iets ziet wat anderen missen.","Beantwoord voor jezelf: welke belangrijke waarheid zie ik die de meeste mensen niet zien?"],["Concurrentie is voor verliezers","Volgens Thiel verdwijnt winst in markten met veel concurrentie. Bedrijven die echte waarde creëren en die waarde kunnen behouden, zijn monopolisten in hun eigen niche. Hij bedoelt geen illegaal monopolie, maar een product dat zo goed is dat er geen echt alternatief is.","Kijk naar je markt: concurreer je vooral op prijs? Hoe kun je iets bieden wat niemand anders biedt?"],["Kenmerken van een monopolie","Thiel noemt vier kenmerken: eigen technologie die minstens tien keer beter is dan het alternatief, netwerkeffecten, schaalvoordelen en een sterk merk. Een bedrijf met een of meer van deze eigenschappen kan zijn voorsprong lang vasthouden.","Welk van de vier kenmerken (technologie, netwerk, schaal, merk) kun je versterken in je werk of bedrijf?"],["Begin klein en domineer","Begin in een kleine markt die je kunt veroveren, en breid daarna uit. Amazon begon met boeken, PayPal richtte zich eerst op een kleine groep intensieve eBay-verkopers. Een te grote markt in het begin betekent te veel concurrentie en te weinig aandacht.","Kies een kleine groep klanten die je volledig kunt bedienen, voordat je breder gaat."],["De laatste zijn telt","Het gaat niet om de eerste zijn, maar om als laatste een grote stap in een markt te zetten en daarna jarenlang van een monopolie te profiteren. De waarde van een bedrijf ligt vooral in de geldstromen die het in de verre toekomst kan genereren.","Denk na over de lange termijn: wat moet je bouwen dat over tien jaar nog waarde heeft?"],["Plan de toekomst","Thiel onderscheidt bepaald en onbepaald optimisme. Een bepaalde optimist heeft een concreet plan voor een betere toekomst en werkt daaraan. Een onbepaalde optimist verwacht dat het beter wordt, maar weet niet hoe, en spreidt zijn kansen. Volgens Thiel bouw je vooral met het eerste iets groots.","Maak een concreet plan voor een betere toekomst, in plaats van alleen opties open te houden."],["De machtswet","In durfkapitaal levert één investering vaak meer op dan alle andere bij elkaar. Die machtswet geldt ook breder: een paar keuzes bepalen het grootste deel van het resultaat. Spreid je niet over veel kleine kansen, maar zoek die ene zaak waarin je echt uitblinkt.","Kijk naar je activiteiten: welke ene levert het grootste deel van je resultaat op? Focus daarop."]]},{"id":"c-grit","title":"Grit","titleNl":"Grit: de kracht van passie en doorzettingsvermogen","author":"Angela Duckworth","year":2016,"topic":"Mindset","summary":"Psycholoog Angela Duckworth onderzocht waarom sommige mensen uitblinken en anderen afhaken. Haar antwoord: niet talent maar grit, een combinatie van passie en doorzettingsvermogen voor doelen op lange termijn.","ideas":[["Talent is niet genoeg","Duckworth zag bij militaire cadetten van West Point, spellingwedstrijden en verkopers dat talent weinig voorspelde wie het volhield. Wat wel voorspelde, was grit: blijven gaan voor een doel op lange termijn, ook als het tegenzit. Onze fascinatie voor natuurtalent leidt ons af van wat echt telt.","Kies iets waarin je beter wilt worden. Hoeveel uur oefening heb je er echt in gestoken?"],["Inspanning telt twee keer","Duckworth vat het samen in twee vergelijkingen. Talent maal inspanning levert vaardigheid op. Vaardigheid maal inspanning levert prestatie op. Inspanning telt dus twee keer mee. Iemand met minder talent die langer doorgaat, haalt vaak meer dan iemand met veel talent die eerder stopt.","Kijk naar een vaardigheid waar je 'geen talent' voor hebt. Hoeveel inspanning heb je er werkelijk in gestopt?"],["Passie groeit, je vindt haar niet","Passie is volgens Duckworth zelden een plotselinge ontdekking. Ze ontstaat in fases: eerst interesse, dan oefening, daarna het besef dat je werk ertoe doet voor anderen, en ten slotte hoop. Wie wacht op de ene grote passie, gunt zichzelf geen tijd om haar te laten groeien.","Wat interesseert je al langer? Geef het een maand bewuste aandacht voordat je beslist of het je passie is."],["Doelgericht oefenen","Experts oefenen anders: met een duidelijk afgebakend doel net buiten hun bereik, volle concentratie, directe feedback en herhaling met verbetering. Duckworth baseert zich hier op onderzoek van Anders Ericsson. Dat soort oefening is vaak niet leuk, maar wel wat het verschil maakt.","Kies één onderdeel van een vaardigheid dat je net niet beheerst, en oefen dat gericht met feedback."],["Een doel boven je doelen","Mensen met veel grit hebben een hoogste doel waaraan hun andere doelen bijdragen. Lagere doelen mogen ze loslaten of vervangen als ze niet werken. Het hoofddoel blijft staan. Zo combineren ze koppigheid over de richting met flexibiliteit over de route.","Schrijf je hoogste doel op en de doelen eronder. Welk lager doel kun je loslaten zonder het hoofddoel op te geven?"],["Hoop als doorzettingsvermogen","Grit hangt samen met een bepaalde hoop: de verwachting dat je eigen inspanning de toekomst kan verbeteren. Duckworth verbindt dit met de groeimindset van Carol Dweck. Wie gelooft dat hij kan leren, zet na een tegenslag door in plaats van op te geven.","Na een tegenslag: schrijf op wat jij kunt doen om het de volgende keer beter te laten gaan."],["Grit kun je van buitenaf laten groeien","Ouders en organisaties kunnen grit stimuleren door hoge verwachtingen te combineren met warme steun. Duckworth noemt ook een cultuur van grit: als je omgeving doorzetten normaal vindt, ga je je daaraan aanpassen. In haar eigen gezin geldt dat je iets moeilijks kiest en het niet halverwege opgeeft.","Kies samen met je gezin of team één moeilijk ding dat je niet halverwege opgeeft."]]},{"id":"c-power-of-now","title":"The Power of Now","titleNl":"De kracht van het nu","author":"Eckhart Tolle","year":1997,"topic":"Mindset","summary":"Spiritueel leraar Eckhart Tolle stelt dat veel lijden ontstaat doordat we ons vereenzelvigen met ons denken. Door volledig aanwezig te zijn in het huidige moment komt er volgens hem innerlijke rust.","ideas":[["Je bent niet je gedachten","Tolle beschrijft hoe hij na jaren van angst en depressie een radicale verandering doormaakte. Zijn kernboodschap: de meeste mensen zijn een gevangene van hun denkende geest. Ze denken voortdurend en zien dat aan voor wie ze zijn. Wie leert zijn gedachten te observeren, ontdekt dat hij meer is dan die stroom.","Neem vandaag drie keer een minuut om alleen te luisteren naar de gedachten in je hoofd, zonder ze te volgen."],["Observeer de denker","Een eerste stap is luisteren naar de stem in je hoofd, zonder te oordelen. Op het moment dat je je gedachten waarneemt, ontstaat er afstand en een gevoel van aanwezigheid. Tolle noemt die waarnemende aandacht de toegang tot rust.","Merk bij een zorg op: 'Er is een gedachte over...'. Kijk of er afstand ontstaat."],["Alleen het nu bestaat","Verleden en toekomst bestaan volgens Tolle alleen als gedachten. Het enige wat je ooit echt hebt, is dit moment. Toch leven we vooral in herinneringen en verwachtingen, waardoor we het heden behandelen als middel om ergens anders te komen.","Doe één handeling vandaag, zoals tanden poetsen of afwassen, met volle aandacht voor wat je voelt en ziet."],["Psychologische tijd","Tolle onderscheidt kloktijd van psychologische tijd. Kloktijd is praktisch: plannen, afspraken maken, leren van fouten. Psychologische tijd is je identiteit zoeken in het verleden en je vervulling in de toekomst. Dat laatste veroorzaakt onrust, zorgen en spijt.","Merk op hoe vaak je denkt 'als dit klaar is, dan ben ik tevreden'. Kun je nu al tevreden zijn met dit moment?"],["Het pijnlichaam","Tolle beschrijft opgehoopte oude emotionele pijn als een soort energieveld dat hij het pijnlichaam noemt. Het kan plotseling wakker worden en je gedachten overnemen, bijvoorbeeld in een ruzie. Door het bewust waar te nemen in plaats van ermee samen te vallen, verliest het zijn greep.","Bij een sterke emotionele reactie: voel de emotie in je lichaam en observeer haar, in plaats van erop te reageren."],["Overgave is geen opgeven","Overgave betekent bij Tolle niet dat je alles maar laat gebeuren. Het betekent dat je innerlijk aanvaardt wat er nu is, in plaats van ertegen te vechten. Vanuit die aanvaarding kun je wel in actie komen, maar dan helder en zonder innerlijke weerstand.","Bij iets wat je niet kunt veranderen: accepteer het eerst innerlijk, en kijk dan wat je wel kunt doen."],["Ingangen tot het nu","Praktische manieren om aanwezig te zijn: let bewust op je ademhaling, voel het innerlijke lichaam, bijvoorbeeld de energie in je handen, en geef volle aandacht aan gewone handelingen zoals afwassen of lopen. Tolle ziet ook stilte en de natuur als toegangspoorten.","Richt bij stress je aandacht op je adem of je handen, en voel ze een minuut lang zo bewust mogelijk."]]},{"id":"c-cant-hurt-me","title":"Can't Hurt Me","titleNl":"Can't Hurt Me","author":"David Goggins","year":2018,"topic":"Mindset","summary":"David Goggins vertelt hoe hij van een moeilijke jeugd en overgewicht uitgroeide tot Navy SEAL en ultraloper. Hij geeft uitdagingen om je mentale weerbaarheid te trainen.","ideas":[["Een moeilijke start","Goggins groeide op met een gewelddadige vader, armoede en racisme. Als jonge man had hij overgewicht en weinig zelfvertrouwen. Hij gebruikt zijn verhaal om te laten zien dat je verleden geen excuus hoeft te zijn, maar brandstof kan worden voor verandering.","Kijk naar je eigen moeilijke ervaringen. Wat heb je daar aan kracht uit gehaald?"],["De verantwoordingsspiegel","Goggins hing briefjes op zijn spiegel met eerlijke, harde waarheden over zichzelf en concrete doelen. Elke dag keek hij zichzelf aan en hield zichzelf verantwoordelijk. Zijn advies: wees genadeloos eerlijk over waar je staat en wat je moet veranderen.","Schrijf drie eerlijke waarheden over jezelf op een briefje, en één concreet doel. Hang het op je spiegel."],["Zoek ongemak op","Goggins stelt dat groei pas begint buiten je comfortzone. Hij zoekt bewust ongemak op, bijvoorbeeld door te gaan hardlopen als hij er het minst zin in heeft. Wie dagelijks iets doet wat hij liever vermijdt, bouwt volgens hem een eelt op de geest.","Kies vandaag één ongemakkelijk ding dat je meestal vermijdt, en doe het."],["De koektrommel","Als het zwaar wordt, haalt Goggins herinneringen aan eerdere overwinningen naar boven, groot en klein. Hij noemt dat zijn koektrommel. Die herinneringen bewijzen dat je al eerder iets moeilijks hebt doorstaan, en geven je kracht om nu door te gaan.","Schrijf een lijst van moeilijke dingen die je eerder hebt doorstaan. Lees die als het zwaar wordt."],["De veertig-procentregel","Als je hoofd zegt dat je op bent, zit je volgens Goggins pas op ongeveer veertig procent van je werkelijke capaciteit. Hij ziet de grens die je voelt als een beschermingsmechanisme van je brein, niet als je echte limiet. Wie leert door die grens te gaan, ontdekt dat er meer in zit.","Als je denkt dat je op bent tijdens het sporten of werken, doe dan nog een klein beetje meer."],["Neem de zielen","Goggins beschrijft hoe hij in zware situaties niet alleen wilde overleven, maar zijn grenzen wilde verleggen tot anderen zich verbaasden. Hij noemt het het nemen van zielen: zo sterk presteren dat het de ander uit het veld slaat. Het gaat hem vooral om mentale voorsprong.","Laat bij je volgende uitdaging zien wat je kunt door net iets meer te doen dan verwacht."],["Plan je dag en win tijd","Goggins plant zijn dagen strak en houdt bij waar zijn tijd heen gaat. Zo vindt hij tijd om te trainen, ook bij een volle agenda. Hij waarschuwt ook: na een succes niet verslappen. Wie zich op zijn lauweren laat rusten, verliest wat hij heeft opgebouwd.","Houd een week bij waar je tijd naartoe gaat, en zoek een uur dat je kunt gebruiken voor je belangrijkste doel."]]},{"id":"c-ego-enemy","title":"Ego Is the Enemy","titleNl":"Ego is de vijand","author":"Ryan Holiday","year":2016,"topic":"Mindset","summary":"Holiday beschrijft hoe ego, een ongezond gevoel van eigen belangrijkheid, ons tegenwerkt in elke levensfase: als we iets nastreven, als we succes hebben en als we falen.","ideas":[["Ego is ongezond zelfbeeld","Holiday gebruikt ego niet in de psychologische betekenis, maar als een overdreven gevoel van eigen belang. Het is de stem die zegt dat jij beter bent dan anderen en dat de regels niet voor jou gelden. Dat ego staat leren, samenwerken en realistisch kijken in de weg.","Merk op wanneer je je beter voelt dan anderen of denkt dat regels niet voor jou gelden. Wat is er dan aan de hand?"],["Praat minder, doe meer","Wie een doel heeft, praat er vaak liever over dan dat hij eraan werkt. Praten geeft een gevoel van vooruitgang zonder de moeite. Holiday adviseert om stil te werken. Laat het werk spreken in plaats van je plannen.","Werk deze week aan een plan zonder erover te vertellen. Laat het resultaat spreken."],["Blijf een student","Wie denkt dat hij al alles weet, stopt met leren. Holiday adviseert om altijd een leerling te blijven. Zoek mensen die verder zijn dan jij, mensen op jouw niveau om mee te oefenen, en mensen die je zelf kunt leren. Zo blijf je scherp en bescheiden.","Zoek iemand die verder is dan jij en vraag om advies, en help zelf iemand die net begint."],["Wees de doener, niet de bekende","Holiday haalt de Amerikaanse strateeg John Boyd aan, die jonge officieren voor de keuze stelde: wil je iemand zijn, of wil je iets doen? Erkenning najagen leidt vaak tot compromissen. Werken aan iets wat ertoe doet, betekent soms dat een ander de eer krijgt.","Vraag je bij een keuze af: kies ik dit om erkenning te krijgen, of om iets bij te dragen?"],["Succes maakt kwetsbaar","Na succes groeit het ego het snelst. Je gaat geloven in je eigen verhaal, wordt arrogant en stopt met leren. Holiday noemt voorbeelden van mensen die alles verloren omdat ze steeds meer wilden. Blijf daarom kritisch op jezelf, juist als het goed gaat.","Na een succes: wat moet je nu blijven leren, en welke valkuil van zelfgenoegzaamheid zie je?"],["Wat is genoeg?","Ego wil altijd meer: meer status, meer geld, meer erkenning. Holiday adviseert om te bepalen wat voor jou echt belangrijk is en wat genoeg is. Wie dat weet, laat zich minder meeslepen door vergelijkingen met anderen.","Schrijf op wat voor jou genoeg is op het gebied van geld, status en erkenning."],["Falen zonder ego","Bij tegenslag zegt het ego dat je oneerlijk behandeld wordt of dat het aan anderen ligt. Holiday stelt dat je falen beter kunt zien als feedback. Meet jezelf aan je eigen standaard en inzet, niet aan uitkomsten die je niet volledig in de hand hebt.","Beoordeel je inzet na een mislukking los van de uitkomst. Heb je gedaan wat je kon?"]]},{"id":"c-courage-disliked","title":"The Courage to Be Disliked","titleNl":"De moed om niet aardig gevonden te worden","author":"Ichiro Kishimi & Fumitake Koga","year":2013,"topic":"Mindset","summary":"In een dialoog tussen een filosoof en een jongeman leggen de Japanse auteurs de psychologie van Alfred Adler uit. Kernboodschap: je bent niet bepaald door je verleden en je kunt vandaag kiezen om gelukkig te zijn.","ideas":[["Je verleden bepaalt je niet","Adler verwerpt het idee dat trauma's uit het verleden je gedrag bepalen. Volgens de filosoof in het boek kies je je gedrag op basis van doelen in het heden. Iemand die niet naar buiten gaat, doet dat niet omdat hij angstig is; hij creëert angst om niet naar buiten te hoeven.","Kijk naar iets wat je vermijdt. Welk doel dient die vermijding misschien, ook als je zegt dat je het wilt?"],["Alle problemen zijn relatieproblemen","Volgens Adler komen al onze zorgen uiteindelijk voort uit relaties met anderen. Zelfs minderwaardigheidsgevoelens ontstaan doordat we ons vergelijken. Wie zijn manier van omgaan met anderen verandert, verandert ook zijn eigen geluk.","Denk aan een zorg. Over welke relatie gaat die eigenlijk?"],["Scheid de taken","Een kernbegrip is het scheiden van taken. Vraag je bij elk probleem af: wie draagt uiteindelijk de gevolgen? Dat is diens taak. Wat anderen van jou vinden, is hun taak, niet de jouwe. Bemoei je niet met de taken van anderen en laat anderen niet in de jouwe treden.","Vraag bij een conflict: wiens taak is dit? Laat los wat niet de jouwe is."],["De moed om afgewezen te worden","Wie wil dat iedereen hem aardig vindt, leeft volgens de verwachtingen van anderen en is niet vrij. Echte vrijheid betekent volgens het boek dat je accepteert dat sommige mensen je niet mogen. Dat is de prijs van leven volgens je eigen keuzes.","Doe deze week één ding waarvan je weet dat niet iedereen het goedkeurt, maar dat bij jou past."],["Horizontale relaties","Adler wijst lof en straf af, omdat ze een verticale relatie veronderstellen: iemand staat boven de ander. Hij pleit voor gelijkwaardige relaties. Bedank iemand liever voor zijn bijdrage dan dat je hem prijst; dat versterkt het gevoel van eigenwaarde.","Vervang een compliment door een bedankje: 'Dank je, dit hielp me echt.'"],["Bijdragen geeft eigenwaarde","Je voelt je waardevol als je het gevoel hebt dat je iets bijdraagt aan anderen. Dat hoeft niet zichtbaar of erkend te zijn. Het gevoel van gemeenschap, het ervaren dat je ergens bij hoort, ziet Adler als de basis van geluk.","Doe iets kleins voor een ander zonder dat er iemand naar kijkt, en merk op hoe dat voelt."],["Leef als een dans","Het leven is volgens de filosoof geen lijn naar een eindpunt, maar een reeks momenten. Wie alleen leeft voor een toekomstig doel, mist het nu. Leef elk moment volledig, als een dans die op zichzelf al de moeite waard is.","Leg je telefoon weg en geef je volle aandacht aan wat je nu aan het doen bent."]]},{"id":"c-daring-greatly","title":"Daring Greatly","titleNl":"De kracht van kwetsbaarheid","author":"Brené Brown","year":2012,"topic":"Mindset","summary":"Onderzoeker Brené Brown laat zien dat kwetsbaarheid geen zwakte is, maar de bron van moed, verbinding en creativiteit. Ze beschrijft hoe schaamte ons klein houdt en hoe je weerbaarheid opbouwt.","ideas":[["In de arena staan","De titel komt uit een toespraak van Theodore Roosevelt over de man in de arena: wie het probeert en misschien faalt, maar wel moedig is. Brown gebruikt dit beeld voor iedereen die zich durft te laten zien, ondanks het risico op kritiek en falen.","Kies een plek waar je jezelf meer zou willen laten zien, ondanks het risico op kritiek."],["Kwetsbaarheid is moed","Brown definieert kwetsbaarheid als onzekerheid, risico en emotionele blootstelling. Ze komt voor bij liefhebben, iets nieuws proberen of om hulp vragen. Hoewel we het als zwakte zien, ervaren we kwetsbaarheid bij anderen juist als moed. Zonder kwetsbaarheid geen echte verbinding.","Deel deze week iets kwetsbaars met iemand die je vertrouwt: een twijfel, een fout of een wens."],["Het gevoel van tekortschieten","Onze cultuur draait volgens Brown om schaarste: nooit genoeg tijd, geld, succes of schoonheid. Daardoor voelen veel mensen dat ze zelf niet genoeg zijn. Dat gevoel houdt ons klein en voorkomt dat we risico nemen of ons laten zien.","Let op gedachten als 'ik ben niet genoeg'. Schrijf er één tegenover die je ook gelooft."],["Schaamte versus schuld","Schuld zegt: ik heb iets slechts gedaan. Schaamte zegt: ik ben slecht. Schuld kan helpen om gedrag te veranderen, schaamte maakt mensen juist defensief of terugtrekkend. Schaamte gedijt bij geheimhouding, stilte en oordeel, en verliest kracht als je erover praat met iemand die empathisch reageert.","Bij een fout: zeg 'ik heb iets fout gedaan' in plaats van 'ik ben slecht'."],["Schilden die we gebruiken","Om ons te beschermen gebruiken we schilden zoals perfectionisme, verdoving met eten of werk, en vreugde vermijden uit angst dat het misgaat. Brown noemt dit laatste het voorvoelen van onheil. Het tegengif is dankbaarheid: bewust genieten van wat goed is.","Merk op welk schild jij gebruikt: perfectionisme, verdoving of vreugde vermijden. Kies één moment om het te laten zakken."],["Weerbaarheid tegen schaamte","Brown beschrijft vier elementen: schaamte herkennen en weten wat haar triggert, kritisch kijken naar de boodschappen en verwachtingen erachter, contact zoeken met mensen die je vertrouwt, en hardop benoemen wat je voelt. Zo herstel je sneller.","Bij schaamte: benoem het en vertel het aan iemand die je vertrouwt in plaats van het geheim te houden."],["Leiden en opvoeden met kwetsbaarheid","In gezinnen, scholen en organisaties ontstaat innovatie en vertrouwen pas als mensen fouten durven te maken. Brown pleit voor leiders en ouders die zelf kwetsbaarheid tonen, feedback geven zonder te beschamen en een cultuur maken waarin je mag falen.","Erken als leider of ouder eens een eigen fout, en laat zien hoe je ervan leert."]]},{"id":"c-essentialism","title":"Essentialism","titleNl":"Essentialisme","author":"Greg McKeown","year":2014,"topic":"Productiviteit","summary":"McKeown pleit voor minder maar beter: bewust kiezen wat echt belangrijk is en al het andere laten vallen. Zo lever je de grootste bijdrage aan wat ertoe doet.","ideas":[["Minder maar beter","Een essentialist doet niet meer dingen, maar de juiste dingen. Wie probeert overal een beetje vooruitgang te boeken, komt nergens echt verder. Door je energie op één richting te richten, kom je veel verder op wat telt. Het is een discipline, geen eenmalig besluit.","Kies je drie belangrijkste prioriteiten voor deze maand en schrap of stel de rest uit."],["Als je niet kiest, kiest een ander","Als je zelf geen prioriteiten stelt, doen anderen dat voor je. McKeown waarschuwt voor het paradox van succes: succes leidt tot meer kansen, die leiden tot versnippering, en dat ondermijnt het succes. Kiezen is een vaardigheid die je kunt ontwikkelen.","Kijk naar je agenda: hoeveel van je tijd wordt bepaald door anderen en hoeveel door jezelf?"],["Neem tijd om te verkennen","Essentialisten nemen bewust tijd om te denken, te spelen en te slapen. Pas als je afstand neemt, zie je wat echt belangrijk is. McKeown adviseert om ruimte in je agenda te maken voor nadenken, en om slaap te beschermen als bron van helder denken.","Plan deze week een uur zonder schermen om na te denken over wat echt belangrijk is."],["De negentig-procentregel","Bij het kiezen tussen opties: beoordeel iets op het belangrijkste criterium met een score van nul tot honderd. Scoort het lager dan negentig, behandel het dan als een nul en laat het vallen. Een duidelijk ja of een duidelijk nee voorkomt dat je overal half ja tegen zegt.","Beoordeel je volgende verzoek met een cijfer. Lager dan negen? Dan is het een nee."],["Zeg vriendelijk nee","Nee zeggen voelt ongemakkelijk, maar wie overal ja tegen zegt, laat het belangrijke liggen. McKeown geeft manieren om netjes te weigeren: scheid de beslissing van de relatie, bied een alternatief, of zeg 'ik kijk even in mijn agenda'. Respect groeit vaak juist als je duidelijke grenzen stelt.","Oefen een vriendelijke nee: 'Ik zou je graag helpen, maar ik kan het nu niet goed doen.'"],["Snoei en bouw buffers in","Durf projecten te stoppen, ook als je er al veel in hebt gestoken; dat is het verzonken kostenfenomeen. Verwijder obstakels in plaats van harder te duwen. En bouw buffers in je planning, want dingen duren bijna altijd langer dan gedacht.","Stop met één project dat je alleen voortzet omdat je er al veel in hebt gestoken."],["Maak het essentiële makkelijk","Gebruik routines om het belangrijke vanzelfsprekend te maken. Begin met kleine overwinningen die momentum geven. McKeown adviseert om steeds te vragen: wat is op dit moment het belangrijkste? Focus op het nu, niet op alles wat ook nog moet.","Vraag je drie keer per dag af: wat is op dit moment het belangrijkste?"]]},{"id":"c-one-thing","title":"The ONE Thing","titleNl":"The ONE Thing","author":"Gary Keller & Jay Papasan","year":2013,"topic":"Productiviteit","summary":"Keller en Papasan stellen dat buitengewone resultaten komen van het richten op één ding tegelijk. Ze geven een vraag om dat ene ding te vinden en een aanpak om het te beschermen.","ideas":[["Ga klein","Succes komt niet van zoveel mogelijk doen, maar van zo weinig mogelijk dingen heel goed doen. De auteurs gebruiken het beeld van dominostenen: één kleine steen kan een iets grotere omgooien, en zo verder. Vind de eerste steen en zet die om.","Kies je eerste dominosteen: welk klein ding maakt vandaag al het andere makkelijker?"],["De focusvraag","De kernvraag van het boek: wat is het ene ding dat ik kan doen, waardoor al het andere makkelijker of overbodig wordt? Stel die vraag voor je leven als geheel, voor dit jaar, deze week en vandaag. Het antwoord bepaalt waar je begint.","Stel de focusvraag voor deze week: wat is het ene ding dat ik kan doen waardoor de rest makkelijker wordt?"],["Zes leugens over succes","De auteurs noemen zes misverstanden: dat alles even belangrijk is, dat multitasken werkt, dat je een gedisciplineerd leven moet leiden, dat wilskracht altijd beschikbaar is, dat je een gebalanceerd leven moet leiden en dat groot denken slecht is. Volgens hen houden die ideeën ons van echte vooruitgang af.","Welke van de zes leugens herken je bij jezelf? Kies er één om deze maand bewust tegen te gaan."],["Gewoonten in plaats van discipline","Je hoeft niet over alles gedisciplineerd te zijn. Je hebt alleen genoeg discipline nodig om één gewoonte te bouwen, wat volgens de auteurs ongeveer twee maanden kost. Daarna loopt het vanzelf, en kun je de volgende gewoonte toevoegen.","Kies één nieuwe gewoonte en houd die twee maanden vol voordat je een volgende toevoegt."],["Wilskracht raakt op","Wilskracht is als een batterij die gedurende de dag leegloopt. Doe je belangrijkste werk daarom vroeg op de dag, voordat je wilskracht is opgebruikt door andere beslissingen. Eet goed en plan je moeilijkste taken op momenten dat je fris bent.","Plan je moeilijkste taak in het eerste deel van je dag, voordat je mail opent."],["Blokkeer tijd","Plan elke dag een blok van ongeveer vier uur voor je ene ding, liefst in de ochtend. Bescherm dat blok tegen vergaderingen, mail en onderbrekingen. Plan ook vrije tijd en tijd om te plannen in, en behandel die afspraken met jezelf even serieus als met anderen.","Blokkeer morgen een tijdslot voor je belangrijkste werk en zet je telefoon uit."],["Doel, prioriteit, productiviteit","Je doel bepaalt je prioriteit, en je prioriteit bepaalt je productiviteit. Werk terug van een groot doel op lange termijn naar wat je nu moet doen. Zo hangt wat je vandaag doet direct samen met waar je over vijf jaar wilt zijn.","Schrijf een doel voor over vijf jaar op en werk terug naar wat je deze week moet doen."]]},{"id":"c-four-thousand-weeks","title":"Four Thousand Weeks","titleNl":"Vierduizend weken","author":"Oliver Burkeman","year":2021,"topic":"Productiviteit","summary":"Een gemiddeld leven duurt ongeveer vierduizend weken. Burkeman stelt dat productiviteitstips niet helpen om alles gedaan te krijgen, en dat je juist rust vindt door je beperkingen te aanvaarden.","ideas":[["Het leven is kort","Als je tachtig wordt, leef je ongeveer vierduizend weken. Dat is schokkend weinig. Burkeman gebruikt dit niet om je harder te laten werken, maar om je te laten inzien dat je nooit alles kunt doen wat je zou willen. Die erkenning is het begin van een beter leven.","Reken uit hoeveel weken je ongeveer nog hebt. Wat wil je in die tijd beslist niet missen?"],["De efficiëntievalkuil","Hoe efficiënter je werkt, hoe meer werk er bijkomt. Wie zijn inbox sneller leegt, krijgt meer mail terug. Productiviteit lost het probleem van te veel willen niet op, ze vergroot het juist. Er komt geen moment waarop je alles af hebt.","Merk op wanneer je efficiënter werkt alleen om meer werk aan te nemen. Wat zou je kunnen laten liggen?"],["Kies wat je laat liggen","Omdat je niet alles kunt doen, moet je kiezen wat je bewust níet doet. Burkeman noemt het strategisch onderpresteren: accepteer dat je op sommige gebieden matig bent, zodat je op belangrijke gebieden echt aanwezig kunt zijn. Elke keuze is ook een verlies, en dat mag.","Kies één gebied waarop je deze maand bewust gemiddeld mag presteren."],["Beperk je lopende projecten","Werk aan een vast, klein aantal projecten tegelijk, bijvoorbeeld drie. Pas als er een af is, mag er een nieuwe bij. Zo maak je dingen echt af in plaats van overal half mee bezig te zijn. Dit vraagt wel dat je accepteert dat andere wensen moeten wachten.","Kies maximaal drie lopende projecten. Zet de rest op een wachtlijst tot er een af is."],["Waarom we afleiding zoeken","We vluchten naar onze telefoon niet alleen omdat apps verslavend zijn, maar omdat ons echte werk ongemakkelijk is. Het confronteert ons met onze beperkingen. Burkeman stelt dat je dat ongemak beter kunt aanvaarden dan bestrijden; dan neemt de behoefte aan afleiding af.","Merk het ongemak op voordat je naar je telefoon grijpt. Blijf er tien seconden bij zitten."],["Geduld als superkracht","In een wereld die snelheid beloont, levert geduld voordeel op. Burkeman adviseert om problemen te laten bestaan, kleine stappen te zetten en te accepteren dat goede dingen tijd kosten. Wie alles wil versnellen, ervaart steeds meer onrust.","Kies één ding waar je haast in hebt, en geef het bewust meer tijd dan je zou willen."],["Tijd delen met anderen","Tijd is waardevoller als je hem deelt. Vrije weekenden en vakanties zijn waardevol omdat anderen dan ook vrij zijn. Burkeman wijst erop dat een volledig flexibel leven eenzaam kan zijn. Gemeenschappelijke ritmes, zoals samen sporten of zingen, geven betekenis.","Plan iets samen met anderen op een vast moment: een wandeling, sport of etentje."]]},{"id":"c-eat-that-frog","title":"Eat That Frog!","titleNl":"Eet die kikker!","author":"Brian Tracy","year":2001,"topic":"Productiviteit","summary":"Tracy geeft eenvoudige technieken tegen uitstelgedrag. De kern: begin elke dag met je belangrijkste en vaak lastigste taak, je kikker.","ideas":[["Eet eerst de kikker","De titel verwijst naar een gezegde: als je 's ochtends een levende kikker eet, kan de rest van de dag niet meer tegenvallen. Je kikker is je belangrijkste taak, die je het liefst uitstelt. Doe die als eerste. Heb je twee kikkers, begin dan met de lelijkste.","Bepaal vanavond je kikker voor morgen en doe die als eerste, nog voor je mail opent."],["Schrijf je doelen op","Beslis precies wat je wilt bereiken en schrijf het op. Zet er een deadline bij, maak een lijst van stappen en begin meteen. Tracy stelt dat mensen met opgeschreven doelen veel meer bereiken dan mensen die alleen vaag weten wat ze willen.","Schrijf één doel op met een deadline en de eerste drie stappen. Zet vandaag de eerste stap."],["Plan elke dag vooraf","Plan je dag de avond ervoor. Volgens Tracy bespaart elke minuut plannen tot tien minuten in de uitvoering. Werk met lijsten voor de lange termijn, de maand, de week en de dag. Streep af wat klaar is; dat geeft motivatie.","Maak morgen je lijst de avond ervoor en kijk of je dag rustiger verloopt."],["De 80/20-regel","Twintig procent van je taken levert tachtig procent van je resultaten op. Kijk welke taken dat zijn en geef die voorrang. Vaak zijn de belangrijkste taken ook de moeilijkste, en daardoor de taken die we uitstellen. Juist daar ligt het verschil.","Markeer op je lijst de twintig procent taken die het meeste opleveren."],["Denk aan de gevolgen","Een taak is belangrijk als het grote gevolgen heeft of je hem doet of niet. Kijk dus naar de impact op lange termijn. Tracy gebruikt ook de ABCDE-methode: A moet, B zou moeten, C is leuk, D kun je delegeren en E kun je schrappen. Begin nooit aan B als er nog een A ligt.","Geef je taken een letter: A, B, C, D of E. Begin nooit aan een B als er nog een A ligt."],["Bewust uitstellen","Omdat je nooit alles kunt doen, moet je uitstellen. Het verschil is wat je uitstelt. Tracy adviseert om bewust kleine, onbelangrijke taken uit te stellen of te schrappen, zodat er tijd overblijft voor wat echt telt.","Kies drie kleine taken die je bewust laat liggen deze week."],["Maak het af","Werk met volle concentratie aan één taak tot die klaar is. Steeds opnieuw beginnen kost veel extra tijd. Tracy noemt het afmaken van een belangrijke taak een bron van energie en zelfvertrouwen, en een gewoonte die je kunt trainen.","Werk aan één belangrijke taak tot hij af is, zonder tussendoor iets anders te doen."]]},{"id":"c-4-hour-workweek","title":"The 4-Hour Workweek","titleNl":"Een werkweek van 4 uur","author":"Timothy Ferriss","year":2007,"topic":"Productiviteit","summary":"Ferriss beschrijft hoe je met minder werk meer vrijheid krijgt, via de stappen definitie, eliminatie, automatisering en bevrijding. Het boek is provocerend en vooral bedoeld om anders over werk en leven na te denken.","ideas":[["De nieuwe rijken","Ferriss zet de traditionele levensloop, decennia werken en dan met pensioen, af tegen wat hij de nieuwe rijken noemt. Zij gebruiken tijd en mobiliteit als echte rijkdom. Het doel is niet per se niets doen, maar doen wat je wilt, wanneer je wilt.","Schrijf op wat je zou doen als geld en tijd geen beperking waren. Wat kost dat werkelijk?"],["D: definieer je doelen","Ferriss adviseert om je angsten concreet te maken. Wat is het ergste dat er kan gebeuren als je iets riskeert, hoe zou je het herstellen, en wat kost het je om niets te doen? Vaak blijkt het risico kleiner en het uitstel duurder dan je dacht. Beschrijf ook wat je precies wilt.","Doe de angstoefening: wat is het ergste dat kan gebeuren, hoe herstel ik het, en wat kost niets doen?"],["E: elimineer","Pas de 80/20-regel toe op je werk en je klanten. Schrap taken en mensen die veel tijd kosten en weinig opleveren. Ferriss adviseert ook een informatiedieet: minder nieuws, minder mail checken, kortere vergaderingen. Wees effectief, niet alleen efficiënt.","Kijk welke twintig procent van je taken of klanten tachtig procent van je stress veroorzaakt."],["A: automatiseer","Besteed routinetaken uit, bijvoorbeeld aan virtuele assistenten. Ferriss beschrijft hoe je een klein bedrijf, dat hij een muse noemt, kunt opzetten dat inkomen oplevert zonder dat je er dagelijks bij hoeft te zijn. Test eerst goedkoop of er vraag is voordat je investeert.","Welke terugkerende taak kun je automatiseren, uitbesteden of met een sjabloon versnellen?"],["L: bevrijd jezelf","Probeer onderhandelen over werken op afstand, eerst voor een dag of twee per week. Laat zien dat je dan productiever bent. Zo kun je stap voor stap meer vrijheid krijgen. Ferriss beschrijft ook mini-pensioenen: periodes van enkele maanden reizen of leven in een ander land.","Is er ruimte om af en toe vanuit huis of elders te werken? Stel een proefperiode voor."],["Doe het belangrijkste eerst","Twee vragen helpen volgens Ferriss om te focussen: als je maar twee uur per dag kon werken, wat zou je dan doen? En als je de rest van de week niets kon doen, wat moet er vandaag dan af? Taken dijen uit tot de tijd die je ervoor neemt.","Stel jezelf de vraag: als ik maar twee uur per dag kon werken, wat zou ik dan doen?"],["Kritisch lezen","Het boek is invloedrijk maar ook bekritiseerd. Een werkweek van letterlijk vier uur is voor de meeste mensen niet realistisch, en uitbesteden aan goedkope arbeid roept vragen op. De bruikbare kern is het kritisch bekijken van hoe je tijd besteedt en welke aannames over werk je vasthoudt.","Neem de bruikbare kern mee: welke aanname over werk zou je eens willen testen?"]]},{"id":"c-indistractable","title":"Indistractable","titleNl":"Onafleidbaar","author":"Nir Eyal","year":2019,"topic":"Productiviteit","summary":"Nir Eyal, eerder bekend om zijn boek over verslavende producten, legt uit hoe je controle krijgt over je aandacht. Afleiding begint volgens hem van binnen, niet bij je telefoon.","ideas":[["Afleiding begint van binnen","Eyal stelt dat we niet in de eerste plaats afgeleid raken door technologie, maar door ongemakkelijke gevoelens zoals verveling, onzekerheid of vermoeidheid. Afleiding is een manier om te ontsnappen. Wie dat begrijpt, pakt de oorzaak aan in plaats van alleen de apps.","Merk de volgende keer dat je afdwaalt op welk gevoel eraan voorafging."],["Tractie en afleiding","Eyal onderscheidt tractie, gedrag dat je dichter bij je doelen brengt, en afleiding, gedrag dat je ervan weghaalt. Hetzelfde gedrag kan beide zijn. Een spelletje spelen is tractie als je dat zo had gepland, en afleiding als je eigenlijk had willen werken.","Schrijf voor morgen op wat tractie is en wat afleiding. Plan het gewenste gedrag in."],["Omgaan met interne triggers","Merk het ongemakkelijke gevoel op dat aan afleiding voorafgaat, schrijf het op en onderzoek het nieuwsgierig. Eyal adviseert de tien-minutenregel: geef toe aan de verleiding pas na tien minuten wachten. Vaak is de drang dan verdwenen.","Pas de tien-minutenregel toe: geef een verleiding pas na tien minuten toe."],["Maak tijd voor tractie","Je kunt niet zeggen dat je afgeleid bent als je niet weet waarvan. Plan daarom je dag in tijdblokken, op basis van je waarden. Eyal noemt dit timeboxing. Plan ook tijd voor relaties en voor jezelf, niet alleen voor werk.","Plan je hele dag in tijdblokken, inclusief tijd voor ontspanning en relaties."],["Hack externe triggers","Meldingen, pings en collega's die langskomen kunnen nuttig zijn, of je juist afleiden. Vraag bij elke trigger: dient deze mij, of dien ik deze? Zet meldingen uit, ruim je beginscherm op en maak afspraken over bereikbaarheid op het werk.","Zet alle meldingen uit die je niet direct nodig hebt, en ruim je beginscherm op."],["Voorkom met afspraken met jezelf","Eyal noemt drie soorten vooraf-afspraken: inspanningspacten, zoals apps die het moeilijker maken om af te dwalen; prijspacten, zoals geld inzetten op je doel; en identiteitspacten, waarbij je jezelf ziet als iemand die onafleidbaar is. Gebruik ze pas nadat je de andere stappen hebt gezet.","Kies een vooraf-afspraak met jezelf, zoals een app-blokker tijdens je focusblok."],["Een cultuur van focus","Op het werk is afleiding vaak een symptoom van een cultuur waarin je altijd bereikbaar moet zijn. Eyal adviseert om dat bespreekbaar te maken. Bij kinderen pleit hij voor het aanleren van zelfregulatie in plaats van alleen schermtijd te verbieden.","Bespreek met je team wanneer je wel en niet bereikbaar hoeft te zijn."]]},{"id":"c-second-brain","title":"Building a Second Brain","titleNl":"Een tweede brein bouwen","author":"Tiago Forte","year":2022,"topic":"Productiviteit","summary":"Forte beschrijft hoe je een digitaal notitiesysteem bouwt dat ideeën en kennis bewaart en weer bruikbaar maakt. Zo hoeft je hoofd niet alles te onthouden en wordt het makkelijker om iets te creëren.","ideas":[["Een tweede brein","We consumeren enorm veel informatie, maar vergeten het meeste. Forte stelt voor om een tweede brein te bouwen: een digitale verzameling notities die je helpt onthouden, verbanden leggen en creëren. Je hoofd is voor ideeën bedenken, niet voor alles opslaan.","Kies één plek, zoals een notitie-app, waar je voortaan alles bewaart wat je wilt onthouden."],["CODE: de vier stappen","Forte vat de methode samen in vier stappen. Verzamelen: bewaar wat resoneert. Ordenen: zet het waar je het nodig hebt. Destilleren: haal de essentie eruit. Uitdrukken: gebruik het om iets te maken. Het doel is niet verzamelen, maar uiteindelijk iets creëren.","Neem je laatste project en kijk: wat heb je verzameld, geordend, gedestilleerd en gemaakt?"],["Bewaar wat resoneert","Bewaar niet alles, maar alleen wat je raakt, verrast of nuttig is. Forte noemt twaalf favoriete problemen: vragen waar je al lang mee bezig bent. Informatie die daarbij aansluit, is de moeite waard om te bewaren.","Schrijf je twaalf favoriete vragen of problemen op waar je al langer over nadenkt."],["Ordenen met PARA","Forte ordent alles in vier categorieën. Projecten: korte inspanningen met een einddoel. Areas: verantwoordelijkheden op lange termijn. Resources: onderwerpen die je interesseren. Archief: alles wat niet meer actief is. Je ordent op bruikbaarheid, niet op onderwerp.","Maak vier mappen: Projecten, Areas, Resources en Archief. Verhuis je notities ernaartoe."],["Progressieve samenvatting","Maak notities in lagen. Bewaar eerst de relevante passages, markeer daarna de belangrijkste zinnen, en markeer daarbinnen weer de kern. Zo kun je een notitie later in een paar seconden scannen. Elke keer dat je iets terugleest, mag je een laag toevoegen.","Pak een lange notitie en markeer de belangrijkste zinnen. Markeer daarbinnen de kern."],["Maak met tussenproducten","Grote projecten bestaan uit kleinere bouwstenen: notities, schetsen, onderdelen van eerdere presentaties. Forte noemt die tussenproducten. Wie ze bewaart, kan nieuwe projecten sneller samenstellen in plaats van steeds bij nul te beginnen.","Bewaar bruikbare stukken van een recent project, zodat je ze later kunt hergebruiken."],["Deel eerder","Wacht niet tot iets perfect is. Deel tussentijds werk met anderen om feedback te krijgen. Forte ziet het tweede brein als een hulpmiddel om sneller te leren en creatiever te werken, niet als een archief waar je alleen dingen in stopt.","Deel deze week iets wat nog niet af is, en vraag om feedback."]]},{"id":"c-predictably-irrational","title":"Predictably Irrational","titleNl":"Voorspelbaar irrationeel","author":"Dan Ariely","year":2008,"topic":"Psychologie","summary":"Gedragseconoom Dan Ariely laat met experimenten zien dat mensen niet rationeel kiezen, maar wel op voorspelbare manieren irrationeel. Wie die patronen kent, kan betere beslissingen nemen.","ideas":[["Alles is relatief","We beoordelen dingen zelden op zichzelf, maar in vergelijking met alternatieven. Ariely beschrijft een abonnement van The Economist: een duurdere papieren versie maakte de combinatie van papier en online ineens aantrekkelijk. Een lokaas-optie stuurt zo welke keuze we maken.","Kijk bij je volgende aankoop of er een opvallende middenoptie is die de andere aantrekkelijk maakt."],["Willekeurige ankers","Ariely liet studenten de laatste twee cijfers van hun burgerservicenummer opschrijven, en daarna bieden op producten. Studenten met hoge cijfers boden flink meer. Een willekeurig getal werd een anker. Eerste prijzen die we zien, blijven onze inschatting van waarde bepalen.","Bepaal vooraf zelf wat iets waard is voordat je een prijs ziet."],["De kracht van gratis","Gratis is niet zomaar een lage prijs; het voelt als iets zonder risico. In experimenten kozen mensen massaal een gratis product boven een veel beter product dat een paar cent kostte. Gratis laat ons dingen kiezen die we eigenlijk niet willen.","Vraag je bij iets gratis af: zou ik dit ook nemen als het een euro kostte?"],["Sociale en marktnormen","We leven in twee werelden: een met sociale normen, zoals vriendschap en wederkerigheid, en een met marktnormen, zoals loon en prijs. Zodra je geld introduceert in een sociale situatie, verdwijnen de sociale normen. Iemand voor een etentje betalen beledigt; samen afwassen niet.","Merk op wanneer je een vriendendienst in geld uitdrukt. Verandert dat de relatie?"],["Opgewonden beslissingen","In een opgewonden of emotionele toestand onderschatten we hoe anders we beslissen. Ariely's onderzoek liet zien dat mensen in zo'n toestand dingen accepteren die ze in rust afwijzen. Neem daarom belangrijke besluiten niet als je boos, hongerig of opgewonden bent.","Neem geen grote beslissingen als je moe, boos of opgewonden bent. Slaap er een nacht over."],["Opties openhouden kost","We hebben moeite om opties op te geven, ook als ze ons weinig opleveren. In een spel bleven deelnemers tijd en geld steken in deuren die op het punt stonden te verdwijnen. Te veel opties openhouden kost energie en focus.","Kies één optie die je al lang openhoudt maar niet gebruikt, en sluit hem af."],["Verwachtingen kleuren ervaringen","Wat we verwachten, beïnvloedt wat we ervaren. Een duurder placebo-pijnstillertje werkte in Ariely's onderzoek beter dan een goedkoop. Bier met een vleugje azijn smaakte beter als mensen het vooraf niet wisten. Prijs en verpakking veranderen de beleving zelf.","Merk op hoe verpakking of prijs je mening over een product beïnvloedt. Probeer eens blind te proeven."]]},{"id":"c-nudge","title":"Nudge","titleNl":"Nudge","author":"Richard H. Thaler & Cass R. Sunstein","year":2008,"topic":"Psychologie","summary":"Thaler en Sunstein laten zien hoe kleine aanpassingen in de keuzeomgeving mensen helpen betere keuzes te maken, zonder ze iets te verbieden. Ze noemen dit libertair paternalisme.","ideas":[["Mensen en Econs","Economische modellen gaan uit van de Econ: een rationeel wezen dat altijd optimaal kiest. Echte mensen hebben beperkte aandacht, weinig zelfbeheersing en laten zich beïnvloeden door de manier waarop keuzes worden gepresenteerd. Beleid moet uitgaan van mensen, niet van Econs.","Kijk naar je eigen omgeving: welke keuze is nu de standaard, en wil je die?"],["Keuzearchitectuur","Iedere situatie waarin mensen kiezen, is ontworpen, bewust of niet. De volgorde van eten in een kantine of het formulier van een verzekering beïnvloedt keuzes. Wie dat ontwerpt, is een keuzearchitect. Neutraal ontwerp bestaat volgens de auteurs niet.","Verplaats gezond eten naar ooghoogte en snoep naar een moeilijk bereikbare plek."],["Wat een nudge is","Een nudge is een duwtje in de goede richting: een kleine aanpassing die gedrag voorspelbaar verandert, zonder opties te verbieden of financiële prikkels flink te veranderen. Fruit op ooghoogte leggen is een nudge; snoep verbieden niet.","Bedenk één kleine nudge voor jezelf, zoals je sportschoenen bij de deur klaarzetten."],["De kracht van de standaardoptie","Mensen blijven vaak bij de standaardoptie. Als werknemers automatisch worden ingeschreven voor een pensioenregeling, met de mogelijkheid om eruit te stappen, doen er veel meer mee. Kies daarom de standaard zorgvuldig: die bepaalt in de praktijk wat de meeste mensen doen.","Zet sparen of beleggen automatisch aan, zodat je er niet elke maand over hoeft te beslissen."],["Libertair paternalisme","De auteurs noemen hun benadering libertair paternalisme. Paternalistisch, omdat je mensen helpt keuzes te maken die beter voor ze zijn. Libertair, omdat iedereen vrij blijft om anders te kiezen. Een nudge moet makkelijk te ontwijken zijn.","Als je anderen helpt kiezen: maak de beste optie de makkelijkste, maar laat ze vrij."],["Morgen meer sparen","Thaler ontwierp met Shlomo Benartzi een regeling waarbij werknemers afspreken om een deel van toekomstige loonsverhogingen te sparen. Omdat het pas later ingaat en ze niets inleveren van hun huidige loon, doen veel mensen mee. Hun spaarquote steeg daardoor sterk.","Spreek met jezelf af dat de helft van je volgende loonsverhoging automatisch naar sparen gaat."],["Goed ontwerp helpt","Goede keuzearchitectuur verwacht fouten, geeft feedback, maakt complexe keuzes overzichtelijk en gebruikt prikkels die mensen opmerken. Een voorbeeld is een vlieg in urinoirs, die mannen beter laat richten. Zulke kleine ontwerpen kunnen grote effecten hebben.","Kijk naar een formulier of proces op je werk: waar maken mensen fouten, en hoe kun je dat ontwerp verbeteren?"]]},{"id":"c-emotional-intelligence","title":"Emotional Intelligence","titleNl":"Emotionele intelligentie","author":"Daniel Goleman","year":1995,"topic":"Psychologie","summary":"Psycholoog en journalist Daniel Goleman maakte emotionele intelligentie populair: het vermogen om eigen en andermans emoties te herkennen en ermee om te gaan. Hij stelt dat dit minstens zo belangrijk is als IQ.","ideas":[["Meer dan IQ","Goleman betoogt dat IQ maar een deel verklaart van succes in werk en leven. Vaardigheden als zelfbeheersing, empathie en omgaan met tegenslag zijn volgens hem minstens zo belangrijk. Zijn bekendste claims over hoe groot dat aandeel precies is, zijn later bekritiseerd, maar het idee kreeg veel navolging.","Geef jezelf een cijfer op de vijf domeinen. Welk domein wil je deze maand versterken?"],["De amygdala-kaping","Bij sterke emoties kan de amygdala, een oud deel van het brein, de leiding overnemen voordat het rationele deel kan meedenken. Goleman noemt dat een kaping. Daardoor doen we in woede of angst dingen waar we later spijt van hebben.","Merk bij een sterke emotie op dat je even moet wachten. Tel tot tien voordat je reageert."],["Vijf domeinen","Goleman beschrijft vijf onderdelen: je eigen emoties kennen, ze reguleren, jezelf motiveren, emoties van anderen herkennen en omgaan met relaties. Samen vormen ze emotionele intelligentie. Het goede nieuws: deze vaardigheden kun je ontwikkelen.","Kies één situatie per dag waarin je bewust een van de vijf vaardigheden oefent."],["Zelfbewustzijn is de basis","Wie zijn eigen gevoelens herkent op het moment dat ze opkomen, kan er beter mee omgaan. Mensen die hun emoties niet opmerken, worden erdoor meegesleept. Zelfbewustzijn is daarom de basis van alle andere emotionele vaardigheden.","Benoem drie keer per dag wat je voelt, in één woord."],["Uitstel van beloning","Goleman beschrijft het marshmallow-experiment: kinderen die konden wachten op een tweede snoepje, deden het later gemiddeld beter. Het vermogen om impulsen te beheersen ten gunste van een doel zag hij als kern van zelfmotivatie. Latere onderzoeken nuanceerden dit verband.","Kies een verleiding die je deze week bewust uitstelt ten gunste van een groter doel."],["Empathie","Empathie begint met het lezen van non-verbale signalen: toon, gezichtsuitdrukking, lichaamstaal. Mensen die dat goed kunnen, zijn vaak beter in relaties en werk. Goleman ziet empathie ook als basis voor moreel gedrag: wie meevoelt, wil een ander helpen.","Let in je volgende gesprek extra op toon en lichaamstaal van de ander."],["Emotionele vaardigheden leren","Goleman pleit ervoor emotionele vaardigheden op scholen en in organisaties te onderwijzen. Kinderen kunnen leren hun gevoelens te benoemen, conflicten op te lossen en impulsen te beheersen. Dat zou volgens hem problemen als agressie en depressie kunnen verminderen.","Help een kind of collega om een gevoel te benoemen in plaats van het weg te praten."]]},{"id":"c-quiet","title":"Quiet","titleNl":"Stil","author":"Susan Cain","year":2012,"topic":"Psychologie","summary":"Susan Cain laat zien dat onze cultuur extraversie verheerlijkt, terwijl introverte mensen veel waardevols bijdragen. Ze legt uit wat introversie is en hoe introverte mensen hun kracht kunnen benutten.","ideas":[["Het extraversie-ideaal","Volgens Cain is vooral de westerse cultuur gaan geloven dat het ideale individu sociaal, dominant en graag in de schijnwerpers is. Die verschuiving ziet ze in de twintigste eeuw, van karakter naar persoonlijkheid. Daardoor voelen introverte mensen zich vaak tekortschieten.","Kijk naar je werkplek en agenda: hoeveel ruimte is er voor rustig, alleen werken?"],["Wat introversie is","Introverten voelen zich het best bij minder prikkels. Ze laden op i
